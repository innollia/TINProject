            - generic [ref=f8e503]:
              - generic [ref=f8e505]:
                - heading "About This Game" [level=2] [ref=f8e506]
                - paragraph [ref=f8e507]:
                  - button "🔎" [ref=f8e511] [cursor=pointer]
                - paragraph [ref=f8e512]: The Idol was lost — but not forgotten. In this followup to the award winning detective game The Case of the Golden Idol, you are an observer that must investigate 20 strange cases of crime, death and depravity - all somehow connected. Use your detective skills to make sense of a grand mystery that unfolds across an age of hallucinogens, disco, fax machines and parapsychology.
                - paragraph [ref=f8e513]
                - paragraph [ref=f8e514]:
                  - button [ref=f8e518]:
                    - img "Pause animation" [ref=f8e519]
                - paragraph [ref=f8e520]
                - heading [level=2] [ref=f8e521]:
                  - strong [ref=f8e522]: 200 YEARS LATER… THE IDOL RISES
                - paragraph [ref=f8e523]: Two hundred years after the unspeakable fate of the Cloudsley family, the Idol's legend lives on only in whispers and myth… but some are determined for this to change. Discover the mysterious forces connecting a tenacious treasure hunter, a team of scientists, the members of an enlightenment-seeking cult and corporate profiteers drawn to the all-powerful artifact.
                - paragraph [ref=f8e524]:
                  - button [ref=f8e528]:
                    - img "Pause animation" [ref=f8e529]
                - paragraph [ref=f8e530]
                - heading "FEATURES" [level=2] [ref=f8e531]
                - heading [level=2] [ref=f8e532]:
                  - strong [ref=f8e533]: LEAD YOUR OWN INVESTIGATION
                - paragraph [ref=f8e534]: The Rise of the Golden Idol is a new type of detective game where you freely explore each crime scene at your own pace, using logic to build your own theories. Click to collect clues and analyze each discovery to determine what happened, why, and who was responsible.
                - paragraph [ref=f8e535]:
                  - button [ref=f8e539]:
                    - img "Pause animation" [ref=f8e540]
                - paragraph [ref=f8e541]
                - heading [level=2] [ref=f8e542]:
                  - strong [ref=f8e543]: A CURIOUS CAST OF CHARACTERS
                - paragraph [ref=f8e544]: Convicted prisoners, new age cult leaders, corporate middle management and many more figures have a role to play in the wider mystery that unfolds — each driven by their own agenda. Scour each scene for key details to put names to faces and deduce their motives.
                - paragraph [ref=f8e545]
                - paragraph [ref=f8e546]:
                  - button [ref=f8e550]:
                    - img "Pause animation" [ref=f8e551]
                - paragraph [ref=f8e552]
                - heading [level=2] [ref=f8e553]:
                  - strong [ref=f8e554]: A NEW APPROACH TO SOLVING CRIMES
                - paragraph [ref=f8e555]: A reworked interface lets you quickly gather key terms from observations and witness testimonies, greatly expanding the depth and variety of each scenario. Upon the conclusion of each chapter, a new type of puzzle lets you revisit past deductions, recap the events of these interconnected cases, and investigate the threads that unify them.
                - paragraph [ref=f8e556]
              - generic [ref=f8e557]: READ MORE
