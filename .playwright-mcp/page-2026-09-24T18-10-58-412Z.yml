        - heading "The Rise of the Golden Idol (Switch) Review" [level=3] [ref=f15e78]
        - paragraph [ref=f15e79]:
          - text: by
          - link "Willem Hilhorst" [ref=f15e80] [cursor=pointer]:
            - /url: /staff/36970
          - text: "-"
          - generic [ref=f15e81]: November 29, 2024, 11:00 am EST
        - generic [ref=f15e82]:
          - generic [ref=f15e83]: "7"
          - paragraph [ref=f15e85]: Perhaps The Fall of a Golden Idol?
          - generic [ref=f15e86]:
            - paragraph [ref=f15e87]:
              - text: Last year I was enamored with
              - link "The Case of the Golden Idol" [ref=f15e88] [cursor=pointer]:
                - /url: https://youtu.be/FNUbkNoSrBM
              - text: ", a mystery detective game that threw all typical conventions of the genre out the window and presented such a unique approach in gameplay and storytelling that I regarded it very highly. Naturally, when developers Color Gray Games announced a follow-up I was immediately on board. While Rise of the Golden Idol refreshes its visual style and adds a new layer on top of the original, the freshness has come off slightly. For those returning for more Golden Idol, you’ll get exactly what you want, but don’t expect a lot of new innovations."
            - paragraph [ref=f15e89]:
              - iframe [ref=f15e90]:
