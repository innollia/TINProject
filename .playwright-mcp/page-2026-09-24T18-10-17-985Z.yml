        - paragraph
        - paragraph [ref=f12e154]:
          - text: Inventive cases have always formed the identity of this series, but here the imagination is bursting out of the screen to give us a generous handful of mysteries that are among the best yet. The plethora of unorthodox, bite-sized sequences in
          - emphasis [ref=f12e155]: Rise
          - text: will keep you busy for an easy 12 to 15 hours, including an antiquity auction where you’ll deduce who’s trying to bid on each arcane lot, an aviary in turmoil filled with menacing fictional bird species, a deceptively deep case that has you learning the routines of an entire apartment complex’s residents, and a catastrophic talent show where most of the competitors are sabotaging each other in creative, underhanded ways.
        - paragraph [ref=f12e156]: Some cases aren't as memorable as others but still play an important role in the overarching plot, no matter how loose that link may initially seem. By the end of the saga, when the full extent of all the schemes of the various parties became clear, I couldn’t help but marvel at all the deft and multilayered setups and payoffs. It’s surprisingly fun to revisit earlier scenes after finishing the whole game to appreciate those events in a brand new context, giving you many chances for “a-has!” even after the credits roll.
        - figure [ref=f12e157]:
          - link [ref=f12e158] [cursor=pointer]:
            - /url: ../../../images/posts/3621/19533-The Rise of the Golden Idol review pic 3.jpg
        - paragraph [ref=f12e160]:
          - text: The one and only area that I thought
          - emphasis [ref=f12e161]: Rise
          - text: "stumbles just a little is within the new interface. In the original game there were two modes: Exploring and Thinking. While “Exploring,” you were allowed to pore over the scene of the crime and inspect clues for words to add to your inventory, while “Thinking” filled the screen with various panels to lay out the case’s logic and identify everyone present. In both modes, your accumulated words were always visible at the bottom of the screen."
        - paragraph [ref=f12e162]:
          - text: In
          - emphasis [ref=f12e163]: Rise
          - text: ", the panels that previously would have all been grouped together on the Thinking screen have instead been divvied up into individual sections that can be toggled on and off at will during your investigation, overlaying small deduction screens on top of your environment. One button opens a panel that identifies the people in the scene, another button, labeled Events, shows the panel needed to solve the current case, and often there’s an additional panel (or two) that contain additional “mini mysteries” within the scene, like learning whose luggage belongs to who, or listing the chronological order of how an event unfolded. Frequently there are also"
          - emphasis [ref=f12e164]: additional
          - text: panels that relate to a multi-case arc, though these can’t be solved until the last case of each of the five main chapters (housing three to four cases each).
        - paragraph [ref=f12e165]: In theory, this level of flexibility allows you to focus only on what you want to solve at any given time. In practice, it can be a bit of a chaotic mess. Even as I slowly got more comfortable with the interface as the game advanced, it never became second nature by the end. Panels can be stacked on top of each other, which can also stack on top of in-game pop-out screens that appear when you click on certain hotspots, all leading to minor visual confusion that the original game never suffered from. It's not too much of a hassle to navigate, but I did find myself fighting with the interface at least once per case. When the first game's presentation was so elegant, it stands out to have the interface take any step backward, even if it's just a slight one.
        - paragraph
        - iframe [ref=f12e167]
        - paragraph
        - paragraph [ref=f12e168]:
          - text: Visually,
          - emphasis [ref=f12e169]: Rise
          - text: retains some similar art direction from
          - emphasis [ref=f12e170]: Case
          - text: ", with characters still featuring the signature exaggerated, slightly grotesque design. However, the old-school pixel art look from Case has been replaced with a much more modern painterly style that hides any trace of blockiness, bolstered by very smooth animation. It’s different for sure, but serves the change of setting rather well. The musical score (by new composer Paul Alexander) is atmospheric and never calls attention to itself, making great use of the new setting to build a soundscape evocative of an off-kilter police procedural, with twangy guitars and moody backing synths that give everything the slightly askew vibe that fits so appropriately."
        - paragraph [ref=f12e171]:
          - text: Unlike the body count of
          - emphasis [ref=f12e172]: Case
          - text: ", there’s actually not a whole lot of murders in"
          - emphasis [ref=f12e173]: Rise
          - text: . A good number of deaths and much of the bodily harm here are more accidental than intended, and most of the cases don’t involve anyone dying at all, focusing instead on the motivations behind assorted thefts, fraud, prison breaks, brainwashing, and unchecked corporate greed. This is a small step away from the
          - emphasis [ref=f12e174]: Obra Dinn
          - text: inspiration (which was “all murder, all the time!”) and opens things up for much more variety, even if the actual deductive gameplay is largely unchanged. Some cases go as dark as the series has ever gotten, while others are whimsical and frankly hilarious. It’s a good balance that prevents things from falling into too strict of a formula, and I was all for it.
        - paragraph [ref=f12e175]:
          - text: And for players who flock to the deductive genre in search of a worthy challenge, oh
          - emphasis [ref=f12e176]: boy
          - text: . The game does a really good job of dangling loads of plausible red herrings to influence your theories and throw you off track. Sometimes it's maybe even
          - emphasis [ref=f12e177]: too
          - text: good at coming up with ways to trick you – and because you’re required to complete quite a few sentences on the deduction panels that all must be
          - emphasis [ref=f12e178]: simultaneously
          - text: correct to progress, it can be very tricky to sleuth out which sentences you got right, and which sentences got you fooled with their devious tricks. For the most part, the difficulty is roughly comparable to
          - emphasis [ref=f12e179]: The Case of the Golden Idol
          - text: ", with several scenes being just a touch on the easier side. Considering the first game was one of the most finely tuned challenges I’ve ever faced, that’s pretty high praise. That said, there were a couple moments in"
          - emphasis [ref=f12e180]: Rise
          - text: that went the other direction, where I was so stumped that I simply couldn’t resist the allure of the in-game hint system – which is simplified this time around, requiring players to merely wait for a short breathing ritual to conclude, rather than complete
          - emphasis [ref=f12e181]: Case
          - text: ’s tedious matching game to get help.
        - heading "Final Verdict" [level=3] [ref=f12e182]
        - paragraph [ref=f12e183]:
          - text: By the end of the game
          - emphasis [ref=f12e184]: ","
          - text: after unwinding the logic of so many off-the-wall crimes and unfortunate accidents – and bouncing back and forth into past scenes to test my theories on how it all tied together – I was fully caught up in the ride. The conclusion was a fittingly wild, humorous, and also melancholy doozy that will stick with me for a while, capping off one of the best whirlwind mystery tales I’ve had the pleasure of playing through in many years. For every theory that reached a dead end, there’d be an "oh MAN, that's crazy!" moment to take its place and keep the momentum racing forward. And even though it may not quite reach the hard-to-beat heights of the original game's sprawling mystery (but only barely), it’s a wonderful sequel that proves Color Gray Games has some of the deduction game scene’s greatest talent of our time. I’m thrilled to check out whatever they create next, and we won’t have to wait long with the exciting promise of a whopping
          - emphasis [ref=f12e185]: four
          - text: "additional DLC packs scheduled to arrive soon. You can probably fill in this blank:"
          - emphasis [ref=f12e186]: The Rise of the Golden Idol
          - text: is one of my ______ games of the year.
