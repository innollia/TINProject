      - heading "AGH" [level=2] [ref=f12e468]
      - generic [ref=f12e469]:
        - heading "About Adventure Game Hotspot" [level=3] [ref=f12e470]
        - paragraph [ref=f12e471]: Welcome to the Adventure Game Hotspot, an independent specialist magazine focused exclusively on adventure gaming!
        - paragraph [ref=f12e472]: Founded in 2022, we are owned and operated by experienced journalists with a wealth of expertise. We offer ongoing reviews, news, podcasts, walkthroughs, and so much more for all the top new releases, as well as editorials, recommendations, and nostalgic reflections on classic titles from the genre’s rich history.
        - paragraph [ref=f12e473]: If you’re a hardcore adventure game fan, you'll feel right at home here! If you're new to the genre and wish to learn more about games with strong narrative, exploration and puzzle elements, you’ve come to the right place! And if you’re a developer who’d like to see your game covered here, we're here to help spread the word!
        - paragraph [ref=f12e474]: If you'd like to get in touch, we appreciate any and all feedback and inquiries, as it’s our goal to make the Hotspot THE place to visit for all your adventure gaming needs.
        - heading "Jack & Joshua" [level=3] [ref=f12e475]
