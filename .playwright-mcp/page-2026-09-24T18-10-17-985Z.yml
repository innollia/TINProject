            - listitem [ref=f12e63]:
              - text: "Published:"
              - time [ref=f12e64]: February 1, 2025
        - heading "Shining almost as brightly as its predecessor, the sequel provides many more inventively offbeat cases to solve with Mad Libs-style deduction" [level=3] [ref=f12e65]
        - separator [ref=f12e66]
        - text:              
        - paragraph [ref=f12e67]:
          - text: In 2022, a modern classic burst onto the scene in
          - link "The Case of the Golden Idol" [ref=f12e68] [cursor=pointer]:
            - /url: ../../../review/119/the-case-of-the-golden-idol
          - text: . Developed by two brothers at Color Gray Games, it aimed to inject a healthy dose of genuine sleuthing into a genre largely absent of it and succeeded – big time. By reinterpreting bits of Lucas Pope’s
          - emphasis [ref=f12e69]: Return of the Obra Dinn
          - text: ", chiefly its core mechanic of identifying murder victims based off of the subtlest of clues,"
          - emphasis [ref=f12e70]: Case
          - text: "still managed to be something entirely of its own: an eighteenth-century epic with fill-in-the-blank gameplay that was equal parts whodunnit, howdunnit and whydunnit (and occasionally whendunnit for good measure). Swiftly followed by a couple of cracking good expansions, the thoughtful deduction game tantalizingly set the stage for a whole new adventure game subgenre to flourish. Mixing observatory reasoning with a streamlined, extremely accessible gameplay design was a hit move, doing a tremendous job in letting players feel like the smartest versions of themselves. It was a glorious trailblazer, and I couldn’t get enough."
        - paragraph [ref=f12e71]:
          - text: With the release of
          - emphasis [ref=f12e72]: The Rise of the Golden Idol
          - text: ", my prayers have been answered: the indie darling has now become a bona fide franchise. And while the charms and originality of the first game may have captured my heart just a touch more, Color Gray didn’t just phone it in with a “safe” sequel here. This bold and risky follow-up honors its predecessor’s events as canon but jettisons much of the aesthetic and setting, trading its Age of Enlightenment intrigue for the trappings of a 1970s conspiracy thriller, with a healthy dose of sci-fi fantasy thrown in for good measure. Despite lacking some elements of the original that I dearly missed, I’ll be darned if"
          - emphasis [ref=f12e73]: The Rise of the Golden Idol
          - text: wasn’t the most fun I’ve had playing a mystery game since… well,
          - emphasis [ref=f12e74]: The Case of the Golden Idol
          - text: "!"
        - paragraph [ref=f12e75]: For a sequel that tonally shakes things up, players familiar with the last game should still feel right at home with how this one works – although there’s been a couple tweaks to the interface I’ll get into shortly. You still play by observing offbeat crime scene tableaus from an omniscient viewpoint, where everyone present is frozen in an endless loop that replays the last few seconds of each scene’s key moment. You’re presented with just enough clues to catch a couple lines of dialogue from the rather suspicious characters around the scene, but the true context of what just occurred will only become clear with a deep dive of rifling through everyone’s pockets, reading over every letter and poster in the area, and often cross-referencing information discovered in previous chapters.
        - figure [ref=f12e76]:
          - link [ref=f12e77] [cursor=pointer]:
            - /url: ../../../images/posts/3621/19532-The Rise of the Golden Idol review pic 1.jpg
        - paragraph [ref=f12e79]:
          - text: You don’t pick up items or solve traditional environmental puzzles in the
          - emphasis [ref=f12e80]: Golden Idol
          - text: mysteries. Instead, inspecting clues will add various words to an imagined “inventory” of sorts. Sometimes the words will be names (with first names and surnames always separated, for extra fun), sometimes they’re objects, and sometimes they’re verbs like “Steal” or “Push.” You’ll use these words to fill the gaps of unfinished case summaries on another screen, where almost all the names, nouns, and verbs are missing. By dragging and dropping the right words to the right blanks, the tangled web of bizarre actions and sinister motives at last comes into focus; then it’s onto the next scene to do it all again. Since you don’t play as an established character, you always passively observe the story as it happens – never affecting the outcome of events, but serving as an all-seeing voyeur that (eventually) understands everything.
        - paragraph [ref=f12e81]:
          - text: The setting of
          - emphasis [ref=f12e82]: Rise
          - text: is a risk that thankfully paid off. As a major fan of the original game’s old-world European vibe, I was wary when the sequel announced its huge departure from that baseline. I had concerns that the more contemporary feel wouldn't have the same transportive, escapist effect this time around, but any such worries vanished in a flash, as the game quickly reminded me it wasn’t tethered to the confines of real history, real geography, or even real science. Just like in
          - emphasis [ref=f12e83]: The Case of the Golden Idol
          - text: ", the mystery takes place in a fully made-up world, albeit one that’s suggestive of our own – with the original game’s setting of Albion (substituting for the real-world UK) making way for"
          - emphasis [ref=f12e84]: Rise
          - text: ’s densely packed metropolises of the Allied States of Hesperia. You can probably guess what it’s a stand-in for.
        - paragraph [ref=f12e85]:
          - text: While it starts off as a somewhat grounded tale of corporate intrigue and cult-centric shenanigans, things quickly escalate with more and more outlandish elements until the world feels equal parts familiar and alien. The golden idol of the first game, still discussed in historical circles 200 years after being destroyed, is somehow back – but with a twist. And returning players who think they had the functions of the idol all sorted out last time will have to dust off their Lemurian history books and get prepared to relearn
          - emphasis [ref=f12e86]: everything
          - text: they thought they knew. On paper, there’s some ridiculously out-there concepts that make up the twists and turns of the crime spree that form this narrative, but I enthusiastically bought into them all without a second thought.
        - figure [ref=f12e87]:
          - link [ref=f12e88] [cursor=pointer]:
            - /url: ../../../images/posts/3621/19531-The Rise of the Golden Idol review pic 2.jpg
        - paragraph [ref=f12e90]:
          - text: It doesn’t hurt that the writers tackle these wilder aspects of the story with gleeful aplomb. The main mystery takes place over a much shorter period than
          - emphasis [ref=f12e91]: Case
          - text: ’s 40-year enigma, and doesn't quite reach the same epic heights. But what
          - emphasis [ref=f12e92]: Rise
          - text: lacks in decades-spanning scope, it more than makes up for it in sheer ingenuity of the individual scenarios, which deserve a standing ovation for the variety and creativity on display.
        - paragraph [ref=f12e93]:
          - text: "Case in point: one early conundrum involves a heist at a drive-in movie theater. Why on earth is there a heist"
          - emphasis [ref=f12e94]: here
          - text: ", of all places? Well, it’s a very special theater sporting some esoteric technology that verges on magic, and obtaining it is one part of the grand plan for some rather shady figures that, once again, want to reshape the world as they see fit. But to figure out how they’ve gone about this, you also need to familiarize yourself with the characters of the schlocky space movie that’s premiering that night, all so you can understand what’s going on inside the minds of the fans (cosplaying as their favorite characters for the costume contest), who hold clues to who the baddie is and all got caught in the pandemonium. And this part is pretty"
          - emphasis [ref=f12e95]: standard
          - text: stuff by
          - emphasis [ref=f12e96]: The Rise of the Golden Idol
          - text: ’s metric.
        - paragraph
