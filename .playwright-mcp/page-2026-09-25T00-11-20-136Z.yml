            - paragraph [ref=f5863e365]: At the museum, Jack Nowak first used the I.D.O.L. to take ≈ 1 month 's worth of Echo Secunda 's memories from the disk and give them to Oriel Toussaint .
            - paragraph [ref=f5863e366]: But Oriel Toussaint wanted more , so Jack Nowak used all the lenses together .
            - paragraph [ref=f5863e367]: Jack Nowak thought this would add the effects of the lenses together . Instead, it caused the effects to multiply .
