              - link "4.4 dev 4" [ref=f18e62] [cursor=pointer]:
                - /url: /article/dev-snapshot-godot-4-4-dev-4/
              - text: release notes for an overview of some key features which were already in that snapshot, and are therefore still available for testing in dev 5.
            - paragraph [ref=f18e63]: Here are highlights of a few new features in dev 5 that you might find particularly exciting!
            - heading "Universalize UID support" [level=3] [ref=f18e64]
            - paragraph [ref=f18e65]: Previously, the UID format was not supported by all Resource types. This proved to be a pain point for users wishing to reference their scripts and other resources in a manner that’s path-agnostic. This, along with a need to refactor their scripts anytime these kinds of files were moved, put a significant duty of care on the end-user that shouldn’t have been necessary.
            - paragraph [ref=f18e66]:
              - text: Starting with dev 5, this will no longer be your burden to bear! Thanks to a long-term effort from
              - link "reduz" [ref=f18e67] [cursor=pointer]:
                - /url: https://github.com/reduz
              - text: ", UIDs will now be applied universally in a way the engine can automatically track and account for. This is achieved via"
              - code [ref=f18e68]: .uid
              - text: files for the resource types that previously didn’t support them, functioning similarly to other metadata files that “track” a main file.
            - paragraph [ref=f18e69]:
              - text: Note that, unlike metadata files,
              - code [ref=f18e70]: .uid
              - text: files are strictly for the editor; the information is migrated to the uid database on export. Despite this, users using version control software
              - strong [ref=f18e71]: should add these files
              - text: ", as they’re required to properly sync data (similar to"
              - code [ref=f18e72]: .import
              - text: files). For more information, see (
              - link "GH-97352" [ref=f18e73] [cursor=pointer]:
                - /url: https://github.com/godotengine/godot/pull/97352
              - text: ).
            - heading "Favorite editor items" [level=3] [ref=f18e74]
            - paragraph [ref=f18e75]:
              - text: A common complaint we hear regarding the inspector is the potential for it to get cluttered. Namely, while there’s generally a wide selection of options available for a given class/script, users will usually only care about a particular subsection that suits them. To account for this,
              - link "YeldhamDev" [ref=f18e76] [cursor=pointer]:
                - /url: https://github.com/YeldhamDev
              - text: brings us the long-awaited ability to pin one’s favorite properties in the inspector! Check out the implementation from PR (
              - link "GH-97352" [ref=f18e77] [cursor=pointer]:
                - /url: https://github.com/godotengine/godot/pull/97415
              - text: ") below:"
            - heading "And more!" [level=3] [ref=f18e79]
            - paragraph [ref=f18e80]: "There are too many exciting changes to list them all here, but here’s a curated selection:"
