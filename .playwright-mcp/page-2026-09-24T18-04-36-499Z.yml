              - text: . Be sure to make frequent backups, or use a version control system such as Git, to preserve your projects in case of corruption or data loss.
            - heading "Known issues" [level=2] [ref=f18e232]
            - paragraph [ref=f18e233]:
              - text: With every release we accept that there are going to be various issues, which have already been reported but haven’t been fixed yet. See the GitHub issue tracker for a complete list of
              - link "known bugs" [ref=f18e234] [cursor=pointer]:
                - /url: https://github.com/godotengine/godot/issues?q=is%3Aissue+is%3Aopen+label%3Abug+
              - text: .
            - heading "Bug reports" [level=2] [ref=f18e235]
            - paragraph [ref=f18e236]:
              - text: As a tester, we encourage you to
              - link "open bug reports" [ref=f18e237] [cursor=pointer]:
                - /url: https://github.com/godotengine/godot/issues
              - text: if you experience issues with this release. Please check the
              - link "existing issues on GitHub" [ref=f18e238] [cursor=pointer]:
                - /url: https://github.com/godotengine/godot/issues
              - text: first, using the search function with relevant keywords, to ensure that the bug you experience is not already known.
            - paragraph [ref=f18e239]: In particular, any change that would cause a regression in your projects is very important to report (e.g. if something that worked fine in previous 4.x releases, but no longer works in this snapshot).
            - heading "Support" [level=2] [ref=f18e240]
            - paragraph [ref=f18e241]:
              - text: Godot is a non-profit, open source game engine developed by hundreds of contributors on their free time, as well as a handful of part or full-time developers hired thanks to
              - link "generous donations from the Godot community" [ref=f18e242] [cursor=pointer]:
                - /url: https://fund.godotengine.org/
              - text: . A big thank you to everyone who has contributed
              - link "their time" [ref=f18e243] [cursor=pointer]:
                - /url: https://github.com/godotengine/godot/blob/master/AUTHORS.md
              - text: or
              - link "their financial support" [ref=f18e244] [cursor=pointer]:
                - /url: https://github.com/godotengine/godot/blob/master/DONORS.md
              - text: to the project!
            - paragraph [ref=f18e245]:
              - text: If you’d like to support the project financially and help us secure our future hires, you can do so using the
              - link "Godot Development Fund" [ref=f18e246] [cursor=pointer]:
                - /url: https://fund.godotengine.org/
              - text: platform managed by
              - link "Godot Foundation" [ref=f18e247] [cursor=pointer]:
                - /url: https://godot.foundation/
              - text: . There are also several
              - link "alternative ways to donate" [ref=f18e248] [cursor=pointer]:
                - /url: /donate
              - text: which you may find more suitable.
