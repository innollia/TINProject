            - paragraph [ref=f18e35]:
              - text: With
              - link "GodotCon" [ref=f18e36] [cursor=pointer]:
                - /url: https://godotengine.org/article/review-godotcon24/
              - text: behind us and our developers recuperated, we’re thrilled to return to a more frequent release-cycle. It’s only been two weeks since we last checked in, yet there’s still so much to talk about! So buckle on in for a breakdown of what you can expect to see in 4.4 dev 5.
            - paragraph [ref=f18e37]: Many of the changes in this release are bug fixes that will be backported to Godot 4.3 and released in 4.3.1! So please test this release well so we can be confident with the changes and release 4.3.1 with them as soon as possible.
            - paragraph [ref=f18e38]: Keep in mind that while we try to make sure each dev snapshot is stable enough for general testing, this is by definition a pre-release piece of software. Be sure to make frequent backups, or use a version control system such as Git, to preserve your projects in case of corruption or data loss.
            - paragraph [ref=f18e39]:
