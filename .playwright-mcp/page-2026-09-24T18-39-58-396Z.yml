                - text: 줄거리
                - link "[편집]" [ref=f1225e1065]:
                  - /url: /edit/%EB%8B%A4%EC%8B%9C%20%EA%B9%A8%EC%96%B4%EB%82%9C%20%ED%99%A9%EA%B8%88%20%EC%9A%B0%EC%83%81/%EC%8A%A4%ED%85%8C%EC%9D%B4%EC%A7%80?section=18
            - generic [ref=f1225e1071]:
              - blockquote [ref=f1225e1072]:
                - generic [ref=f1225e1073]: 테사 네바리는 OPIG 기업의 자금으로 하모니 재단을 운영했다. 테사는 훔친 유물의 부품들을 재조립하여 유물을 다시 만들었고, 이것이 증오를 제거하고 공감을 부여하게 만들어 사람들을 계몽에 도달하게 만든다고 생각으나, 이는 사실 아무 효과가 없었다. 한편 테사가 유물의 부품을 구하는데 과소비를 하여 하모니 재단은 OPIG 기업에 압류되고, 유물을 입수한 오리엘은 유물을 재건하면 작동할 수 있다고 깨닫는다. 새 프로젝트의 팀장인 마리는 테스트하는 걸 주저하고 있던 사이 유진이 유물을 활성화하여 연구실 출입을 금지당한다.
              - blockquote [ref=f1225e1075]:
                - generic [ref=f1225e1076]: 하모니 재단에 알게된 유진 마모트는 재건한 유물이 증오를 부여하도록 설정됐기 때문에 자기가 처벌받았다고 생각한다. 그러나, 사실 그것은 열을 제거하도록 설정되어 있었고, 그 결과 한 새수반을 동결시키고 만다.이사회 점검 도중, 유진 마모트는 증오를 제거하도록 설정하려고 하나, 그만 열을 부여하도록 설정하고, 이에 따라 화재가 일어나고 만다.네이선 호일은 유진 마모트의 발견에 감명받고, 그에게 승진으로 포상했다.
