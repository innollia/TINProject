              - blockquote [ref=f1225e1293]:
                - generic [ref=f1225e1294]: 토요일 피크닉에서, 케네스 오졸라는 소니 소이어를 죽이겠다고 협박했다.그러나, 월요일, 소니 소이어는 연구 실험에 참여한 뒤로 그 협박을 잊었다. 역시 참석했던 라보나 콜름즈는 이 사람의 기억을 받았다.화요일 아침, 소니 소이어는 샤이엔 버드의 사진을 찍었다. 이에 흥분한 케네스 오졸라는 건물에 사는 모든 사람들을 위해 소니 소이어를 사살했다.
              - generic [ref=f1225e1296]: 1975년 9월 21일에 일어난 사건. 4장에서의 일들이 어떻게 일어난 일들인지에 대한 단서를 제공한다.
