              - blockquote [ref=f1225e1210]:
                - generic [ref=f1225e1211]: 장기자랑 쇼에서, 캐머런 플레이크는 미스터 블라드를 이용하여 레코드를 기스를 냄으로써 과거 우승자인 레지나 리틀모어의 공연을 방해했다.한편, 빌마르 프라도는 놀라 락코우의 공연을 방해하려고 우리에서 릴리 벨을 풀어줬다. 그 보복으로, 놀라 락코우는 트럼펫에 탄산음료를 쏟아 부었다.방송이 끝나고, 레지나 리틀모어는 쇼가 조작되었다며 단테 롱고를 공격했다.
              - generic [ref=f1225e1213]:
                - text: 장기자랑 쇼 스타더스트 버라이어티 아워(SVH) 1975년도 대회에서, 복화술사 캐머런 플레이크는 1973년도 우승자
                - link "[18]" [ref=f1225e1214] [cursor=pointer]:
                  - /url: "#fn-18"
                - text: 레지나 리틀모어의 발레 공연을 방해하기 위해 자신의 복화술 인형 미스터 블라드의 이빨로 왈츠 음악이 나오는 레코드판을 긁어 망가뜨린다. 또한 음악가 빌마르 프라도는 전 연인이었던 마술사 놀라 락코우의 공연을 방해하기 위해 놀라가 마술에 사용하는 토끼 릴리 벨을 풀어줬으며, 이 과정에서 토끼에게 손을 물린다. 놀라 락코우는 이에 대한 보복으로 트림쟁이 아타르브 레디가 트림하기 위해 마시려던 탄산음료 O-렌지를 가져가 빌마르의 트럼펫에 쏟아부어 버렸고, 트림을 할 수 없게 된 아타르브는 대신 즉흥적으로 춤을 춘다. 그런데 이 춤에 대한 반응이 의외로 좋아서 1위를 차지했고, 상황을 받아들이지 못한 레지나 리틀모어는 쇼 주최자 단테 롱고에게 달려든다.
