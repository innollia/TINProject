                    - cell [ref=f1225e718]:
                      - generic [ref=f1225e719]: Arthur Blythe, who was in prison for murder, got out of his cell through a window, using a saw blade he got from Steven Aria.아서 블라이스는 살인 죄목으로 수감되었으나, 스티븐 아리아에게서 구한 톱날을 이용하여 창문을 통해 탈옥했다.He entered the yard via a drainpipe, and breached the fence using wire cutters he got from Percy Sainsbury.배수관을 통해 뒷뜰에 들어간 다음, 퍼시 세인즈버리에게서 구한 와이어 절단기를 사용하여 철조망을 넘었다.Finally, he climbed over the wall by attaching sheets, which he got from Jimmy Beswick, to the bars from his window.마지막으로, 지미 베스윅으로부터 구한 침대보를 자기 창문의 창살에 묶어 벽을 타고 넘었다.
                  - row [ref=f1225e720]:
                    - cell [ref=f1225e721]:
                      - strong [ref=f1225e723]: 이름
                    - cell [ref=f1225e724]:
                      - generic [ref=f1225e725]: Patrick Kendal(패트릭 켄달)・Percy Sainsbury(퍼시 세인즈버리)・Jimmy Beswick(지미 베스윅)・Robert Pakenham(로버트 파켄엄)Jason Kempton(제이슨 켐튼)・Daniel Utley(다니엘 어틀리)・Jeremy Smith(제레미 스미스)・Henry Wakefield(헨리 웨이크필드)
              - generic [ref=f1225e726]:
                - text: 1973년 11월 5일, 종신형을 받고 스턴월 감옥에 수감되어 있던 살인범 아서 블라이스는 스티븐 아리아가 보낸 암호문을 통하여 책등 속에 들어있던 톱날을 꺼내, 창문의 창살을 자르고 탈옥했다.
                - link "[6]" [ref=f1225e727] [cursor=pointer]:
                  - /url: "#fn-6"
                - text: 배수관을 타고 뒷뜰에 진입한 후 예술 활동에 관심을 보이는 척하여 간수 퍼시 세인즈버리에게서 구한 와이어 절단기를 사용하여 철조망을 잘라냈다. 마지막으로, 지미 베스윅에게 담배가 든 주머니를 주고 구한 침대보를 잘라낸 자기 창문의 창살에 묶어 감옥 외벽을 넘었다.해금되는 자료는 신문 기사. 아서 블라이스가 유물을 훔치는 것을 발견한 박물관 동료를 찔러 살해했다는 것과 훔친 유물들을 다양한 곳에서 판매했다는 내용이다.
