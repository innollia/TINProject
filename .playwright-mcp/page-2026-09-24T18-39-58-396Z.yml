            - generic [ref=f1225e1779]:
              - blockquote [ref=f1225e1780]:
                - generic [ref=f1225e1781]: 바우어의 비리를 캐기 위해, 라이벌인 앤디어 갱단의 단원 2명이 힐데가르드의 사무실에 녹음기를 설치해 두엇습니다. 3일 후 녹음기를 수거하러 돌아왔을 때, 녹음기는 실수로 비밀 배달 물품에 섞여 개 사육장으로 옮겨졌습니다. 녹음기를 수거하려던 과정에서 앤디어 갱단 단원이 개 사육장 관리인인 레오를 쐈습니다.
              - generic [ref=f1225e1783]:
                - text: 뉴 웰스 개 경주 트랙은 바우어 갱단이 운영하는
                - link "경견장" [ref=f1225e1784] [cursor=pointer]:
                  - /url: /w/%EA%B0%9C%20%EA%B2%BD%EC%A3%BC
                - text: 이었다. 최근에 시작한 문화 유산 건물 복원 계획을 후원하고 운영하고 있던 힐데가르드 바우어는 최근 복원 계획으로 큰 피해를 본 앤디어 갱단을 누르고 영향력을 행사하고 있었고 이로 인해 앤디어 갱단은 힐데가르드 바우어에게 피해를 줄 계획으로 화요일에 그녀의 사무실에 몰래 잠입해 화분에 녹음기를 설치했다.그리고 3일 후, 금요일에 앤디어 갱 단원 2명이 다시 찾아왔지만 지난번과 다르게 방 안쪽에서 널판지까지 박아놓는 바람에 창으로 잠입이 어려워지자 앤디어 갱 단원 한 명이 소리를 질러대며 그를 유인하는 동안에
                - link "[42]" [ref=f1225e1785] [cursor=pointer]:
                  - /url: "#fn-42"
                - text: 남은 한 명이 들어갔지만 난장판이 되어 있고 녹음기가 사라진 것을 눈치챈다.이는 경주견 중 하나인 베니라는 개가 지나치게 방어적인 성향이 되어버린 바람에 곁에 개 사육장 관리인이 데리고 다니며 관리하는 동안 사무실에서 난장판을 벌이는 바람에 녹음기를 숨겨두었던 화분이 넘어져 녹음기가 밀거래 물품과 섞여 버렸기 때문이었다. 그러나 관리인인 레오는 그 사실을 몰랐기에 그대로 그걸 수거해버렸고 사과문을 적고 떠난 상태였다. 그 사과문을 본 앤디어 갱 단원
                - link "[43]" [ref=f1225e1786] [cursor=pointer]:
                  - /url: "#fn-43"
                - text: 은 베니를 찾으려 했지만 곧 베니가 사람이 아닌 개라는 사실을 알게 되고 나서 서둘러 레오를 쫓아갔고, 그를 살해한 후 무사히 녹음기를 수거하고 경찰에게 증언까지 해주고 탈출했다.
            - heading [level=3] [ref=f1225e1792] [cursor=pointer]:
