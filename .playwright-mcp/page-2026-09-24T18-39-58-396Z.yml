            - generic [ref=f1225e2494]:
              - blockquote [ref=f1225e2495]:
                - generic [ref=f1225e2496]: 1797년, 괴물이 엘르아살 가너를 습격했고, 그는 곧바로 괴물을 총격했다. 그후, 아바쿠스 졸리프는 외부에서 지도를 발견했다.
                - generic [ref=f1225e2499]: 1927년, 재스퍼 와일스는 로레타 보르디를 고용하여 에드워드 졸리프의 박물관에서 지도를 절도하도록 했다.
                - generic [ref=f1225e2503]:
                  - text: 그러나 로레타 보르디는 지도를 가지고 도주하려고 했고, 재스퍼 와일스는 로레타 보르디를 말로 유린했다.
                  - link "[82]" [ref=f1225e2504] [cursor=pointer]:
                    - /url: "#fn-82"
              - generic [ref=f1225e2505]:
                - text: 이번 DLC는 1797년 '마지막 사신' 호의 마지막 항해시점과 1927년 유물발굴단의 시점을 전환하며 플레이하게 된다.첫 사건은 진품 지도가 이동한 경위의 추적이 가장 중요하므로, 먼저 제시된 지도들 중 어떤 지도가 진품인지 알아내야 한다. 지도가 진품인지 아닌지를 분석하는 부분이 가장 어려운데 이는 지도의 범례에 나타난 장소, 사물의 특징을 통해 지도의 작성 연도를 추론해야 하기 때문이다.
                - link "[스포일러]" [ref=f1225e2506] [cursor=pointer]:
                  - /url: "#fn-%ec%8a%a4%ed%8f%ac%ec%9d%bc%eb%9f%ac"
                - text: 다만 살인사건 자체는 지도의 내용과 큰 관련이 없는 만큼, 주변의 정황을 이용하여 풀이해야 한다.
