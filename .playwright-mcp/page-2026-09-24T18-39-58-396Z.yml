              - text: 이 시기에 프라비의 죽음을 기리기 위해 만들어진 '프라비의 기적' 영화가 상영되는데, 영화를 관람하던 마술사 샤스타이와 다니치 아카이 부부가 의문을 표하는 대화를 나누었던 것이 적발되어
              - link "[68]" [ref=f1225e2187] [cursor=pointer]:
                - /url: "#fn-68"
              - text: 신성 모독법으로 처형당한다. 이후 오리는 기적의 힘을 맹신하는 정통 교리주의자로서, 코이는 종교를 축재에 이용하는 사이비 교주로서 파벌이 갈라지게 된다.한편, 아카이 부부의 아들은 루트리 왕과 나가사이 형제에게 복수하기 위해 이름을 자마티 피라로 바꾸고 코이의 휘하로 들어간다. 자마티 피라는 자신의 마술 지식을 사용하여 코이 나가사이의 속임수에 적극적으로 협력하면서 코이의 신뢰를 얻는 한편, 코이의 일기장을 몰래 훔쳐
              - link "[69]" [ref=f1225e2188] [cursor=pointer]:
                - /url: "#fn-69"
              - text: 프라비의 사망에 대한 진실을 알게 된다. 프라비의 서기였으나 프라비가 죽은 후 코이의 신도가 된 그레스토 노치는 코이의 기적이 속임수라는 사실을 알게 되었으며, 이것을 코이에게 따지다가 입막음을 위해 살해당한다. (사건 3)코이는 자마티에게 최초 파수꾼 외에 아무도 접근할 수 없는 폭포 성지에 들어갈 수 있는 비밀번호를 알려주어 그곳에서 그레스토의 시체를 처리하도록 한다. 성지에 도착한 자마티는 우연히 폭포 뒤에 비밀 공간이 있다는 것을 알아내게 되고, 폭포에서 기도하는 오리에게 거짓된 폭포의 계시를 내린다. 프라비를 죽인 자는 코이이며, 자신이 오리를 죽음으로부터 보호해 줄 것이니 자신이 정한 날짜에 나가사이 형제가 함께 코이의 사원에서 불의 시련
              - link "[70]" [ref=f1225e2189] [cursor=pointer]:
                - /url: "#fn-70"
              - text: 을 받으라는 것. (사건 4)왕실 의회는 오리가 홀로 살아남을 경우 통제하기 어려울 것이라 생각하여 코이가 살아남게 하기 위해 코이 측의 내부 협력자 자마티에게 코이의 족쇄를 풀 여벌 열쇠를 제공하였다. 오리는 계시대로 폭포가 자신을 보호할 것이라고 믿었고, 코이는 자마티에게 족쇄의 열쇠를 받고 풀려난 후 벙커로 피신할 계획을 세운 채 시험을 받아들이지만, 자마티는 코이의 족쇄를 풀지 않고 그대로 벙커 속에 숨고 아무도 들어오지 못하도록 문을 벨트로 봉해버린다. 나가사이 형제는 불타는 건물 속에서 사망했고, 불타는 건물 속에서 살아 나오면서 유일하게 폭포의 기적을 재현하는 데 성공한 자마티가 새로운 최초 파수꾼으로서 임명된다. (사건 5)이렇게 최초 파수꾼이 된 자마티 피라는 하지 축제일에 루트리 만제크를 독대할 수 있는 기회를 얻었고, 선물로 가지고 온 청동 조각상의 단검으로 루트리를 살해하여 마지막 복수를 성공한 후 해외로 도주한다. (사건 1)
