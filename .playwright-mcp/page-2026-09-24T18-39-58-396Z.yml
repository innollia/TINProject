            - generic [ref=f1225e2559]:
              - blockquote [ref=f1225e2560]:
                - generic [ref=f1225e2561]: 1797년, 사실 에이다 베이커가 감염된 것은 없다.
                - generic [ref=f1225e2565]:
                  - text: 병에 걸리지 않기 위해 톰 애드킨, 자크 트라이튼, 시릴 아미엇은 그
                  - link "[85]" [ref=f1225e2566] [cursor=pointer]:
                    - /url: "#fn-85"
                  - text: 가 준 프로모딜 소금을 복용하였다.
                - generic [ref=f1225e2568]: 살아남은 선원인 스테판 가너는, 경계 근무 중 수면한 탓에 프로모딜 소금 복용이 저지되었다.
                - generic [ref=f1225e2571]: 그러나 프로모딜 소금은 사실 독약이었고, 톰 애드킨, 자크 트라이튼, 시릴 아미엇은 죽고 말았다.
                - generic [ref=f1225e2574]: 1927년, 앙투안 스필스버리는 라디건 올리타의 시체가 발견되자 원정을 종료하길 원했다.
                - generic [ref=f1225e2577]: 원정을 계속하기 위해, 아이반 컨즈는 앙투안 스필스버리를 파라잔으로 살해하였다.
              - generic [ref=f1225e2579]: 증상으로부터 사인을 알아내야 하는데 쉽지 않은 편이다. 워낙 함정이 많으므로 주의해서 찾아보자. 사인을 찾을 때 주변의 반응도 사인에 대한 경악이나 반응도 일체 별로고 아예 다른 증거품이나 시신과 비교하면서 알아낼려고 하면 그런 부분들은 의도적으로 다 가리거나 숨기고 있기 때문에 단순하게 생각할 수 없는 편이다.
