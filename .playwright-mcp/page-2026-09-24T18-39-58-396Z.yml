              - text: 시점은 본편의 한참 이전, 고대의 레무리아 시기를 다룬다.통제의 시대, 레무리아인들은 다른 대륙의 '야만인'들과 교류하기를 거부하고 테크노토피아에 모여 살았다. 뛰어난 기술을 가진 레무리아 인들이었지만 그들에게 있어서도 황금 우상 같은 고대의 유물들은 그 위험성으로 인해 오직 파수꾼들의 엄격한 관리 하에서만 작동되도록 제한되고 있었다. 하지만 그들 중에는 현재의 '통제 정책'을 거부하고 전 세계를 자신들의 우월한 기술력으로 지배하고자 하는 제국주의자도 있었다.지난 밤 술자리에 있었던 해프닝에 대해 파수꾼들이 나눈 대화 기록이 제공된다. 김김 케라가 다리아 진스에게 사랑의 세레나데를 불렀던 이야기, 다리아 진스가 프탈라 키브의 성대모사를 한 이야기, 그리고 헤코 시프트가 술김에 '통제 정책 철폐' 연설을 시작한 이야기도 포함되어 있었다. 그의 정체는 제국주의자였다.
              - link "[73]" [ref=f1225e2412] [cursor=pointer]:
                - /url: "#fn-73"
              - text: 헤코 시프트는 자신의 사상을 온 레무리아에 퍼뜨리려고 했으며, 그를 위해 생각을 설득력 있게 문서화하는 설득자, 문서의 내용을 액체화하여 접촉하는 자에게 주입하는 콰피저, 그리고 액체를 구름으로 만드는 구름 생성기가 필요했다. 그러나 이 유물들은 금고에 압류되어 있었고 금고의 문은 모운 다실바의 베리돌라 인증을 통해서만 열리는 구조였기 때문에 이를 우회할 방법이 필요했다.그러던 어느 날, 탠스카 과수원에서 사고가 발생했다.
              - strong [ref=f1225e2413]: (사건 1)
              - text: 탠스카 과수원은 파수꾼의 승인을 받은 고대 유물로 만들어진 수확기를 사용하는 곳이다. 에텀 러벨은 고모가 평소에 자기 가족을 싫어하는 것을 알고 있었으며, 호승심에 사거리를 조정하는 총구와 안전 장치가 개조된 수확기를 만들어 고모 가족들에 비해 수확량을 비약적으로 상승시키려 했으나 사고로 자신의 아버지를 살해해 버린다. 파수꾼들은 사건의 진상을 밝히기 위해 베리돌라(거짓말 탐지기)를 사용한 수사를 진행했고 용의자 에텀 러벨과 개조된 수확기를 함선으로 수거한다.헤코 시프트는 이 과정에서 개조된 안전장치를 함선으로 밀반입하여 가짜 베리돌라를 만들려고 했다. 파수꾼들의 회의에서 모든 수호자가 임시 베리돌라 조정 권한을 가져보자는 제안은 기각되었지만, 담당자가 이유를 불문하고 업무를 진행할 수 없을 경우 직속 부하가 권한을 대행한다는 안건은 통과되었다. 이에 베리돌라 조정 권한이 있는 자신의 직속 상관 김김 케라를 함정에 빠뜨리려고 했다.헤코 시프트는 김김 케라가 다리아 진스에게 호감을 가지고 있다는 점을 이용해 거짓 쪽지를 전달하여 선물로 위장된 고대 유물을 손에 들게 만들었다.
              - strong [ref=f1225e2414]: (사건 2)
              - text: 김김 케라는 그 상태에서 다른 파수꾼에게 발각되어 유물을 밀반입했다는 누명을 쓰게 된다. 재판부에서 김김 케라는 이에 대해 해명하려 했지만, 그가 장착한 베리돌라가 유도 심문
              - link "[74]" [ref=f1225e2415] [cursor=pointer]:
                - /url: "#fn-74"
              - text: 에 의해 거짓 반응을 보이자 결국 구금 상태가 된다.
              - link "[75]" [ref=f1225e2416] [cursor=pointer]:
                - /url: "#fn-75"
              - text: 김김 케라가 업무에서 배제된 이후 헤코 시프트는 김김 케라의 베리돌라 조율 업무를 인계 받는다.
              - strong [ref=f1225e2417]: (사건 3)
              - text: 헤코 시프트는 개조된 안전 장치를 사용해 반대 결과값을 출력하는 가짜 베리돌라를 제작하는 한편, 정찰 로봇들이 자신의 계획을 방해하지 못하도록 체육관만 순찰하도록 명령을 내린다. 한편 4번 구역에서 익명의 신고자로부터 자의식을 가진 로봇들이 난동을 피운다는 신고가 접수된다.
              - link "[76]" [ref=f1225e2418] [cursor=pointer]:
                - /url: "#fn-76"
              - text: 모든 파수꾼들이 사건 조사를 위해 함선을 비운 시간 동안 계획이 실행된다.함선이 모두 비워진 시간, 미스터 그린이 소형 비행선에 미스터 블루와 미스터 레드를 태워 헤코 시프트의 방의 열려 있는 창문을 통해 함내로 진입하게 한다. 미스터 그린은 지상으로 내려가 헤코 시프트를 태울 준비를 한다. 미스터 레드는 헤코 시프트가 준비해 준 잘못 조정된 임시 베리돌라를 착용한 채로 인증 시스템을 속여 금고로 진입하는 데 성공, 금고에 있는 압류된 유물들과 황금 우상을 수거한다. 이 과정에서 금고에 구금되었던 에텀 러벨도 본의 아니게 자유로워진다.
              - link "[77]" [ref=f1225e2419] [cursor=pointer]:
                - /url: "#fn-77"
              - text: 미스터 레드는 미스터 블루에게 황금 우상을 건네주고, 압류된 유물들을 탈출구 쪽으로 옮기기 시작한다. 황금 우상을 건네 받은 미스터 블루는 상영실로 진입했고, 헤코 시프트의 위치를 추적하는 '오리' 안테나를 무력화한다. 그런데 미스터 블루가 무력화한 '오리'
              - link "[78]" [ref=f1225e2420] [cursor=pointer]:
                - /url: "#fn-78"
              - text: 안테나는 실은 모운 다실바의 것이었다.헤코 시프트는 로봇 하나에 명령해 자신의 죽음을 연출하게 만들고, 미스터 그린의 비행선에 올라타 다시 진입 지점에서 미스터 블루와 미스터 레드를 기다린다. 그러나, 그때 모운 다실바는 로봇을 심문하던 중 자신의 베리돌라 기능이 무력화된 것을 알게 되어
              - link "[79]" [ref=f1225e2421] [cursor=pointer]:
                - /url: "#fn-79"
              - text: 함선에 문제가 생겼다고 판단, 즉시 복귀한다.
              - link "[80]" [ref=f1225e2422] [cursor=pointer]:
                - /url: "#fn-80"
              - text: 그는 미스터 레드를 총으로 쏴 제압하고, 비행선까지 쏘는 데까지는 성공하였지만 비행선의 4연장포에 공격당해 사망한다. 공격당한 비행선은 결국 지상에 불시착한다.그러나, 헤코 시프트의 베리돌라는 여전히 작동 중이었고
              - strong [ref=f1225e2423]: (사건 4)
              - text: 파수꾼들의 함선은 헤코 시프트를 추적해 지근거리까지 다가오고 있었다. 헤코 시프트 일행은 추적 기능이 무력화되는 데이터 디스크 공장으로 피난하지만 더 이상 도망칠 곳이 없었다. 게다가 프탈라 키브가 파수꾼의 세 번째 법령까지 어기며 메가 마이너를 사용해 자신을 죽이려 드는 일촉즉발 상황이었다.미스터 그린과 미스터 블루는 고대 유물에 대한 지식이 있는 헤코 시프트가 필요했지만, 추적으로부터 자유로워지기 위해 헤코 시프트가 사라져야 한다는 모순에 입각해 그것을 벗어나기 위해 그를 쏴버린다. 그리고 함선에서 챙겨온 황금 우상을 사용해 헤코 시프트의 모든 기억을 데이터 디스크에 담은 채로 도주하기로 한다. 그들은 광고판에서 본 수확기의 기능을 사용하여 멀리 떨어진 과수원으로 이동하고자 했으나, 개조된 수확기의 위험성을 몰랐던 그들은 몸이 융합된 채 사망하고 만다.한편, 메가 마이너의 회로에는 빈틈이 있었는데 이는 헤코 시프트가 사망했을 경우가 고려되지 않았던 것이다. 그렇기에 메가 마이너는 살아 있는 헤코 시프트를 찾아 죽일 때까지 모든 것을 파괴하고 무고한 사람들을 납치하는 상태가 되어버렸다. 프탈라 키브가 메가 마이너를 멈춰보려 했으나, 그녀는 이미 세 번째 법령을 어겨 베리돌라가 거짓 반응을 보이는 바람에 인증이 거부되는 상태였다. 그래서 메가 마이너는 디스크 공장을 파괴한 이후에도 함선에 들이닥쳐 함선을 캔을 따듯이 뜯어내며 그 안에 있던 인원들을 모조리 포획하기 시작했다.함선이 무너져 가던 와중에 에텀 러벨은 미스터 레드가 가짜 베리돌라를 사용해 로봇의 인증 시스템을 속이는 장면을 기억하고 있었다. 그는 금고에서 탈출하여 가짜 베리돌라를 사용해 메가 마이너에게 중지 명령을 내려 폭주를 막는 데 성공한다.일련의 사고 이후 프탈라 키브는 파수꾼의 세 번째 법령을 어긴 벌로 재판을 받는다. 헤코 시프트와 그의 동료가 사망한 것이 확인되어 사건은 마무리되었다. 그러나 헤코 시프트의 기억이 들어있던 데이터 디스크는 후대까지 보존되어 결국 현대의 오리엘 투생 교수의 몸으로 부활하였다. 즉, DLC의 헤코 시프트는 본편에서 에코 세쿤다로 불리는 인물과 동일 인물인 것.한편 DLC 1편 시점에서 인격이 다시 분열된 오리엘 투생과 헤코 시프트(=에코 세쿤다)라는 두 인격은 체포되어 정신병원에 수감된 상태에서 서로 대화를 나누게 되지만 고대의 기술로 인류를 위한 발전을 추구해 보자는 오리엘 투생의 말에 헤코 시프트는 현재의 야만인들과 지금의 나약한 레무리아 인들과는 협력 따윈 하고 싶지 않다며 거부하였고, 오리엘 투생은 그러면 이런 고대 지식이 더 이상 쓰이지 않는 것이 최선이라고 말하는 장면이 나온다.이 사실을 알고 본편 17화를 다시 보면 많은 것이 이해된다. 우선 4개의 레무리아 무기 중 하필 베이퍼런을 사용한 이유는 자기 자신의 가짜 죽음을 연출할 정도로 강력하고, 익숙한 무기이기 때문이라는 것을 알 수 있다. 헤코 시프트의 임무는 "레무리아를 레무리아로부터 지키는 것"(수호자)이며, 한줄기 빛이 헤코 시프트를 이상한 기계에 연결하고 있고(베리돌라를 추적하는 장치) 이마에 거짓말을 못하게 하는 보석(베리돌라)가 박혀있는데 그것을 속일 방법을 찾았다. 원래 자신의 적이 되어버림(범죄자가 됨)으로 인해 크게 고통받기도 했다(총에 맞음). 다만 그가 포기하지 않은 것이 무엇인지(레무리아의 제국주의일 수 있다.), 복수하고자 하는 대상이 누구인지(자신을 배신한 동료인지 수호자들인지)는 밝혀지지 않는다.
