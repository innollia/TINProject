              - blockquote [ref=f1225e1244]:
                - generic [ref=f1225e1245]: 마우마티 다실바는 아타르브 레디가 고대 레무리아 스페일 춤 공연을 하는 것을 보고 충격을 받았다. 춤 내용은 다음과 같다.지식은 금지된 문들을 연다. 열쇠들을 도둑질할 사악한 멍청이들을 조심하라.
              - generic [ref=f1225e1247]: 마우마티 다실바는 SVH에서 아타르브 레디가 즉흥적으로 춘 춤을 녹화하여 돌려보며, 어떻게 이 외국인 멍청이가 익히는 데 몇 달이 걸리는 레무리아의 고대 무용 스페일 춤을 배웠냐며 놀라워한다. 삼촌에게 보고 있다고 말하는 것으로 보아 고대 레무리아 스페일 춤을 본 것이 마우마티 혼자만이 아닌 레무리아를 연구하는 사람들이 더 봤을 수도 있다는 가능성을 보여준다.
              - table [ref=f1225e1249]:
                - rowgroup [ref=f1225e1250]:
                  - row [ref=f1225e1251]:
                    - cell [ref=f1225e1252]:
                      - generic [ref=f1225e1253]: 
              - generic [ref=f1225e1257]:
                - text: 한국어로 플레이 시 약간의 문제점이 있는데, 이 게임은 원문이 영어로 된 게임이라 애니메이션의 춤도
                - strong [ref=f1225e1258]: 영어 어순(SVO)
                - text: 을 기준으로 만들어져 있다.
                - strong [ref=f1225e1259]: 그러나 퍼즐의 문장은 한국어 어순(SOV)대로 칸이 나열되어 있기 때문에
                - text: 이 사실을 알 수 없는 한국 게이머는 어리둥절할 수밖에 없다. 이는 영어실력과 무관하게 혼동을 야기하며 퍼즐을 어렵게 만든다.사실 어순이 다르다 해도, 한국어는 조사를 사용하는 교착어이기 때문에 어순에 자유도가 존재하므로 단어 순서를 바꾸는 방식으로 퍼즐을 만들 수 있었다. 영어 어순에 맞추어 목적어를 뒤로 빼면 고어체 잠언이나 선언문 같은 느낌을 주는 문장이 되긴 하지만 한국인으로서 충분히 이해 가능하므로 이런 점까지 세심하게 처리하여 퍼즐을 번역하지 못한 점은 아쉬움이 남는다.다음은 영어 어순에 맞게 배치한 한국어 퍼즐 문장이다.
              - blockquote [ref=f1225e1260]:
                - generic [ref=f1225e1262]:
                  - text: 지식(KNOWLEDGE)은 연다(OPENS) 금지된(FORBIDDEN) 문들을(DOORS). 조심하라(BEWARE) 사악한(EVIL) 멍청이들을(FOOLS). 그들은 도둑질한다(who STEAL)
                  - link "[19]" [ref=f1225e1263] [cursor=pointer]:
                    - /url: "#fn-19"
                  - text: 열쇠들을(KEYS)."
