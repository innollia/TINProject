              - generic [ref=f1225e1794]:
                - text: 사건 3
                - link "[편집]" [ref=f1225e1796]:
                  - /url: /edit/%EB%8B%A4%EC%8B%9C%20%EA%B9%A8%EC%96%B4%EB%82%9C%20%ED%99%A9%EA%B8%88%20%EC%9A%B0%EC%83%81/%EC%8A%A4%ED%85%8C%EC%9D%B4%EC%A7%80?section=35
            - generic [ref=f1225e1802]:
              - blockquote [ref=f1225e1803]:
                - generic [ref=f1225e1804]: 갱단원들은 기억을 혼란스럽게 만드는 장치를 실험하고 있었습니다. 실험 대상 중 가장 큰 영향을 받은 사람이 사실 위장 경찰이라는 걸 알게 되었을 때, 보스는 도망가야 한다는 걸 깨달았습니다. 작업장이 포위된 상황에서, 갱단원들이 차량까지 갈 수 있는 유일한 방법은 대들보를 통해 옆 건물로 이동하는 것이었습니다.
              - generic [ref=f1225e1806]:
                - text: 바우어 갱단은 모종의 경로로 사람들의 기억을 혼란스럽게 만드는 장치를 얻었고, 갱단의 '누군가'가 '작은 여자'의 지시에 따라 그 장치를 자세히 연구하고 기록하고 있었다.
                - link "[44]" [ref=f1225e1807] [cursor=pointer]:
                  - /url: "#fn-44"
                - text: 그는 음파를 발산하는 방식으로 장치의 기능을 사용할 수 있다는 것을 확인한 뒤 이를 '혼란 장치'라고 명명하고, 갱단원들을 각기 다른 세기의 음파에 노출시킨 뒤 변화를 관찰했다.낮은 세기에서는 그저 잠시 겪었던 사건의 순서가 달라지는 게 전부였고, 중간 세기에서는 사건의 순서가 뒤섞이고 본래 사물을 다른 사물로 착각하지만 그래도 현실에 존재할 법한 사물을 대입하는 정도에 그쳤다. 그러나 가장 높은 세기를 경험한 사람은 아예
                - strong [ref=f1225e1808]: 세상을 추상적이고 비현실적인 모습으로 보게 된다.
                - text: 사건의 기본적인 인과와 사물간의 상관관계는 유지되기에 깊게 생각하면 의미를 유추할 수 있지만, 표현이 몹시 난해하여 정상적인 의사소통이 어렵고, 영구적으로 되돌릴 방도가 없다.
                - link "[45]" [ref=f1225e1809] [cursor=pointer]:
                  - /url: "#fn-45"
                - text: 이렇게 '누군가'는 강력한 장치를 만들어냈지만 문제가 생기고 마는데, 가장 높은 세기에 노출된 사내의 정체가 바우어 갱단 내부에 잠입한 경찰이었기 때문이었다. 미쳐버린 그가 자기 옷을 찢어버려 안의 와이어(도청 장치)가 드러나자 '누군가'는 경찰이 자신들을 감시하고 있었다는 것을 알아차린다. 이윽고 경찰들이 건물 봉쇄를 시도하려는 것을 알게 된 갱단원들과 누군가는 그대로 크레인에 매달린 대들보를 밟고 옆 건물로 넘어가 지하 주차장에 있는 차를 타고 도망치는 데 성공한다.
                - link "[46]" [ref=f1225e1810] [cursor=pointer]:
                  - /url: "#fn-46"
                - text: 그리고 도망친 이들 중에 '누군가'가 바로 에코 세쿤다였다는 사실이 드러난다.
