              - blockquote [ref=f1225e1489]:
                - generic [ref=f1225e1490]: 박물관에서 잭 노왁은 먼저 I.D.O.L을 사용하여 디스크의 에코 세쿤다의 =1달치 기억을 추출했다. 그 다음 이를 오리엘 투생에 주입했다.그러나 오리엘 투생은 이를 더 원했고, 잭 노왁은 모든 렌즈를 모두 사용하였다.잭 노왁은 이렇게 하면 렌즈의 효과를 모두 합산한다고 생각했다. 하지만 실제로는 효과를 곱하는 것이었다.
              - blockquote [ref=f1225e1492]:
                - generic [ref=f1225e1493]: 에코 세쿤다는 그 직후 베이퍼런을 붙잡았다. 이는 로완 도일을 경계하게 했다.베이퍼런은 작동에 실패했다. 그러자 에코 세쿤다는 로완 도일에게 창을 던졌다. 그리고 마지막에는 도망쳤다.
              - generic [ref=f1225e1495]:
                - text: 1977년 6월 4일, 오리엘 투생은 아우렐리아 윈스턴이 세븐 시즈 경매에서 낙찰받은 레무리아 인장(디스크)
                - link "[26]" [ref=f1225e1496] [cursor=pointer]:
                  - /url: "#fn-26"
                - text: 의 정체를 확인하고자 잭 노왁과 함께 박물관에 방문한다. 잭은 I.D.O.L을 사용해 인장에서 레무리아인 수호자 에코 세쿤다의 1개월치 기억을 추출한 후 오리엘에게 주입하여 에코 세쿤다의 기억을 볼 수 있게 한다. 그러나 불완전한 기억으로 만족할 수 없었던 오리엘은 더 많은 기억을 원했고, 결국 잭은 렌즈들을 겹쳐서 사용한다. 잭의 예측은 1분, 1일, 3일 렌즈들의 효과가 합산되어 약 4.01일치의 기억을 더 얻을 수 있다는 것이었지만 겹쳐진 렌즈의 효과는
                - strong [ref=f1225e1497]: 곱해져서
                - text: 나타났고, 오리엘은 에코 세쿤다의 모든 기억
                - link "[27]" [ref=f1225e1498] [cursor=pointer]:
                  - /url: "#fn-27"
                - text: 을 주입받아
                - strong [ref=f1225e1499]: 에코 세쿤다가 된다.
                - text: 갑자기 낯선 곳에 떨어져 당황한 에코 세쿤다는 스스로를 지키기 위해 근처에 있던 진열장을 부수고 레무리아 통제의 시대 무기 베이퍼런
                - link "[28]" [ref=f1225e1500] [cursor=pointer]:
                  - /url: "#fn-28"
                - text: 을 집어들지만, 고장 난 베이퍼런은 작동하지 않았다. 에코 세쿤다는 대신 근처의 레무리아 동상이 들고 있던 창을 집어던져 자신을 경계하던 경비원 로완 도일을 공격하고 도주한다. 에코 세쿤다의 전체 기억을 얻은 오리엘 투생의 이상한 행동과 반응을 보고, 잭 노악은 누군가의 모든 기억을 추출해서 주입했을 경우 일부 기억만을 주입했을 때와는 다르게 원래 몸에 있던 기억을 모두 잃어버리고 새로운 기억과 인격으로 덮어쓰기 된다는 사실을 깨닫게 된다.또한 레무리아 동화를 통해서도 다음 세 가지 사실을 알 수 있는데, 첫 번째 전체 기억 추출은 살아 있는 사람에게서만 가능하고, 전체 기억이 추출되면 그 사람은 죽어 버리게 된다. 두 번째로 전체 기억을 디스크에 저장할 수 있는데, 그러면 디스크의 옆면이 표시부가 전부 빨갛게 변하면서 꽉 찼다는 표시가 나타난다. 황금 우상을 통해 디스크에서 전체 기억을 추출해도 디스크에는 기억이 사라지지 않고 계속 남아 있다.
                - link "[29]" [ref=f1225e1501] [cursor=pointer]:
                  - /url: "#fn-29"
                - text: 세 번째로 추출된 전체 기억을 다른 사람에게 주입시키면 주입 대상자의 인격을 지우고 추출된 기억의 소유자가 가진 인격으로 덮어씌우게 된다.
                - link "[30]" [ref=f1225e1502] [cursor=pointer]:
                  - /url: "#fn-30"
                - link "[31]" [ref=f1225e1503] [cursor=pointer]:
                  - /url: "#fn-31"
                - text: 이 사건이 1977년 6월 4일이고 프롤로그의 시간대가 1977년 6월이므로, 정신병원에서 간호사를 목졸라 죽이던 오리엘 투생은 사실 에코 세쿤다임을 추리할 수 있다. 도망갔지만 결국 잡혀서 정신병원에 수감되었고, 탈출을 위해 살인을 범한 것이다.본편에서는 I.D.O.L.의 4중 렌즈의 위험성만 나타내는 짧은 사건이지만, 이후 DLC와 큰 연관이 있는 에피소드니 DLC 플레이 후 다시 조사하는 것을 추천.
