                  - link "[39]" [ref=f1225e1760] [cursor=pointer]:
                    - /url: "#fn-39"
                  - text: 이(가) 2번 자리로 전달되려던 마약, 음식을(를) 훔쳐갔다. 4번 자리에 주차되어 있었던 차량에서 5명의 갱 단원이(가) 추적해 수염 난 남자의 타이어에 총격을(를) 가했다. 그러자 수염 난 남자은(는) 화재용 비상 탈출구로 뛰어 올라갔고, 갱 단원 몇 명이 그를 쫓아갔다. 어째서인지 급수탑이(가) 쓰러졌다. 그러면서 갱 단원 하나가 사망했다. 동시에 문도 열렸다. 수염 난 남자이(가) 아래층(으)로 갔을 때 전투가 벌어졌고, 그 과정에서 그는
                  - link "[40]" [ref=f1225e1761] [cursor=pointer]:
                    - /url: "#fn-40"
                  - text: 손을(를) 잃었다.
              - generic [ref=f1225e1762]:
                - text: 본편 이후 에코 세쿤다의 행방과 관련된 스테이지이다. 정신병원을 탈출한 뒤 오토바이를 타고 달아나던 에코 세쿤다는 어느 패스트푸드 가게의 드라이브 스루에서 음식 봉투를 강탈한다. 그러나 그곳은 갱단이 마약 유통을 목적으로 운영하는 가게였고, 에코 세쿤다가 가져간 봉투에는 마약이 들어있었다. 갱단원들은 마약이 유출될 것을 우려하여 즉시 그를 추적하였다. 급수탑이 무너져 갱단원 하나가 낙사하고, 누군가의 손이 잘려나가는 격렬한 싸움 끝에 세쿤다는 갱단의 추격을 따돌린다.이후 로이 샘슨 형사와 그 동료인 클리프 세이비어 형사가 가게에 도착하여 수사를 시작한다. 특이하게도 갱단의 구역 내에서 발생한 범죄다 보니 사건의 목격자들 대부분이 제대로 된 증언을 하지 않으며, 버거를 도둑맞은 사람은 아예 증언을 거부하는 모습까지 보인다.
                - link "[41]" [ref=f1225e1763] [cursor=pointer]:
                  - /url: "#fn-41"
                - text: 그러나 외국인 관광객 부부의 증언 덕분에 로이 샘슨은 그들이 무엇을 하고 있었고 어째서 증언을 하지 않는지의 이유까지 눈치챈다. 한편 박살 난 옥상 문이나 급수탑, 잘린 팔의 단면을 보면 마치 물질을 깨끗이 제거하는 빔을 쏘는 것 같은 이상한 무기가 사용되었음을 알 수 있다.
