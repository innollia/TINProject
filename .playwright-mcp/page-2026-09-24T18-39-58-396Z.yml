              - blockquote [ref=f1225e1167]:
                - generic [ref=f1225e1168]: 새장에서, 마시 팔머는 부화기에서 과열된 새끼를 발견하고 울고 있었다.한편, 데클란 아스터가 새장에 들어갔을 때, 거기에 있던 졸린눈 꽃찌름이가 그의 팔찌를 훔쳐가고 만다. 곧, 데클란 아스터는 가면 뇌조에게 급여를 하러 갔는데 덤불에 숨겨져 있던 알을 밟고 만다.그 보복으로, 가면 뇌조가 데클란 아스터를 공격하고, 죽이게 된다. 그의 마지막 비명소리는 죽음의 딸랑이 앵무가 흉내 내고, 이는 니탈릭의 헤럴드를 자극하고, 그 결과 크리스탈 무어를 공격하고 만다.
              - generic [ref=f1225e1170]:
                - text: 1975년 8월 30일에 일어난 사건. 얼핏 보면 황금 우상과 아무 관련이 없어 보인다. 졸린눈 꽃찌름이가 황금 우상과 관련 있어 보이는 팔찌를 물고 있는 것, 데클란 아스터가 OPIG의 피험자 지원 서류를 갖고 있고 12시 30분에 약속이 있었다는 것이 연관점의 전부다. 이 시점에서는 팔찌를 왜 차고 있는지, 팔찌에 적힌 문양은 무슨 의미인지 전혀 알 수 없지만, 사건 14 복합단지에 이르면 팔찌와 문양의 의미를 알게 된다.
