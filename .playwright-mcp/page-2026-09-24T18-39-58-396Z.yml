                    - cell [ref=f1225e565]:
                      - generic [ref=f1225e566]:
                        - text: 사고가 일어난 건설 현장의 하수도 파이프에서 루크 브라운의 시체가 발견되었다. 시체는 경찰이 붉은 저주라고 부르는 특이한 상태에 빠져 있었다. 1년 뒤
                        - link "[2]" [ref=f1225e567] [cursor=pointer]:
                          - /url: "#fn-2"
                        - text: 백맨 부부가 유명 과학자 아이작 노왁이 사망한 것을 발견했으며, 아이작 노왁의 시체에서도 붉은 저주가 발견되었다. 누군가
                        - link "[3]" [ref=f1225e568] [cursor=pointer]:
                          - /url: "#fn-3"
                        - text: 의 연락을 받은 엘리자베스 노왁은 사람들이 아이작 노왁이 마약 사용자였다고 생각할 것을 우려했다. 며칠 뒤, 엘리자베스 노왁은 자신이 운영하는 희소 인재 펀드를 통하여 브랜든 백맨의 학비 지원을 제안했고, 그 대가로 아이작 노왁이 붉은 저주와 관련이 있다는 사실을 비밀로 지켜달라고 했다. 기자회견이 열리기 몇 시간 전, 세바스찬 월시 또한 이사회 자리와 컴퓨터 한 대를 받는 대신 사건의 진상을 은폐해 달라는 거래를 제안받았고 이를 승낙했다. 그러나, 뉴 웰스 중앙 포렌식 연구소의 조사 결과, 붉은 저주의 두 희생자
                        - link "[4]" [ref=f1225e569] [cursor=pointer]:
                          - /url: "#fn-4"
                        - text: 중 마약 사용자는 없는 것이 확인되었다.아이작 노왁은 사망 전 스틸사이드 창고에 누군가를 만나러 갔다. 며칠 뒤, 스틸사이드 창고 관계자가 엘리자베스 노왁으로 하여금 세바스찬 월시에게 뇌물을 주어 아이작 노왁 사망 사건 수사를 중단하도록 유도했다.
              - generic [ref=f1225e570]: 붉은 저주의 특징은 눈이 붉은색으로 변한 채 사망한 것. 게다가 붉은 저주로 사망한 사람들이 노숙자였기 때문에 경찰은 마약을 의심했지만 조사 결과 마약은 원인이 아니었다. 이것이 황금 우상과 무슨 연관이 있는지는 나중에 밝혀진다.희소 인재 펀드와 이사회 자리, 컴퓨터를 통해 아이작 노왁의 죽음의 원인을 숨기려고 노력한 것은 엘리자베스 노왁이지만, 사실 이는 헌터 울프라는 수상한 인물이 부추긴 것. 게다가 헌터 울프는 이미 거처의 모든 증거를 인멸하고 도망간 상태다.
