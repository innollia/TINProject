                      - strong [ref=f1225e847]: 이름
                    - cell [ref=f1225e848]:
                      - generic [ref=f1225e849]: Oriel Toussaint(오리엘 투생)・Tesa Nevari(테사 네바리)・Summer Knightly(서머 나이틀리)・Aurelia Winston(아우렐리아 윈스턴)Moumaati Dasilva(마우마티 다실바)・Nils Wilmington(닐스 윌밍턴)・Robbie Froberg(로비 프로버그)・Erwin Bogart(어윈 보가트)
              - generic [ref=f1225e850]: 1974년 8월 13일에 일어난 일. 전작의 레무리아 뱀파이어 DLC에 있던 시간대 변화 시스템이 본작 처음으로 도입된 시나리오이다.프롤로그에 나온 오리엘 투생 교수가 조연으로 등장한다.
