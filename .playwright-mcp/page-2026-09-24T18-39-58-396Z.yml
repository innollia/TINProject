              - blockquote [ref=f1225e1005]:
                - generic [ref=f1225e1006]: 하모니 재단의 폐쇄에 화가 난 시위자 단체가 OPIG 연구실 밖에 모여있었다.시위 도중, 앤디 쇼가 새 수반을 도둑질 하려고 했다. 그러다가 실수로 그것을 부수고 말았을 때, 얼음 덩어리 하나가 떨어져 나와 언덕에서 굴러떨어져, 토비아스 암스텔의 바비큐 그릴을 쳤고, 그게 넘어지면서 그를 부상입혔다.
              - generic [ref=f1225e1008]: 1975년 6월 13일에 일어난 사건. 연구실을 자세히 살펴보면 유진 마모트가 장치를 작동시켜서 창문 밖의 나뭇잎을 얼린 것을 볼 수 있다. 창문 밖에 있던 새 수반에 고여있던 물은 이때 같이 얼어버렸다는 것을 추측할 수 있다. 한편 유진 마모트는 이때 시위자들에게 현혹되어 같은 편이 되었다.
            - heading [level=3] [ref=f1225e1014] [cursor=pointer]:
              - text: 
