              - blockquote [ref=f1225e1556]:
                - generic [ref=f1225e1557]: 헌터 울프는 스틸사이드 창고에서 비밀리에 실험했다.6월, 엘라이자 싱클레어가 나타나 문제를 야기했을 때, 헌터 울프는 I.D.O.L을 루크 브라운에게 사용해 모든 기억을 추출하고 모든 기억을 엘라이자 싱클레어에게 주입했다.그 결과, 루크 브라운은 새로운 신체를 얻게 되었고, 헌터 울프의 조수가 되었다.
              - blockquote [ref=f1225e1559]:
                - generic [ref=f1225e1560]: 9월, 헌터 울프는 해리 스톤에게 I.D.O.L을 사용해 모든 기억을 추출했다. 그런 다음 씨 브리즈에 있던 가브리엘 지라드에게 라이브 방송을 통해 모든 기억을 주입했다.파티가 한창일 때, 해리 스톤은 신디사이저를 파괴해서 음악 솜씨가 없다는 것이 밝혀지는 것을 회피했다.
              - generic [ref=f1225e1562]:
                - text: 스틸사이드 창고 근처 컨테이너에서는 노숙자들이 모여 사는 구역이 있다. 1976년에 삐쩍마른 마빈이 폐병으로 사망한 후, 규칙에 따라 가장 오래 이곳에 살고 있었던 해리 스톤 그리고 더러운 윌리엄, 루크 브라운 순서로 보다 좋은 주거지를 선택하였다. 스틸사이드 창고에서는 헌터 울프가 무언가의 일을 하고 있는 것처럼 보이지만 서로 만나는 일은 없었다.1977년 1월, 헌터 울프가 해리 스톤에게 협력을 구하고 어떤 실험을 시작한다.3월, 오리온 스카이가 새롭게 노숙자 무리에 들어오고 근처 난파선을 주거지로 삼게 된다.4월, 헌터 울프의 실험이 실패한다. 해리 스톤 또는 타인의 개입으로 인한 방해로 여겨지지만 확실하지 않다. 헌터 울프는 자신의 사회 개혁을 위한 계획을 포기하지 않을 것을 결의한다.
                - link "[32]" [ref=f1225e1563] [cursor=pointer]:
                  - /url: "#fn-32"
                - text: 6월, 엘라이자 싱클레어라는 이름의 갱스터가 갱단이 와해된 이후, 스틸사이드 창고로 몸을 피신해온다. 그는 자신의 힘으로 해당 지역의 노숙자들을 갈취하고 이에 반항하는 루크 브라운의 다리를 다치게 할 지경에 이른다. 이들의 도움이 필요했던 헌터 울프는 루크 브라운의 모든 기억을 I.D.O.L으로 추출하고, 엘라이자 싱클레어를 I.D.O.L으로 유인시켜 그의 모든 기억을 루크 브라운의 기억으로 통째로 뒤집어 씌운다. 이전의 늙은 다친 몸에서 젊고 건장한 몸으로 바뀌게 된 루크 브라운(엘라이자 싱클레어)은 자신의 인생을 바꿔준 헌터 울프에게 충성을 다하는 조수가 되어 스틸사이드 창고로 거처를 옮기게 된다. 공석이 된 그의 빈 자리는 다음 서열이었던 오리온 스카이가 차지하게 된다. 노숙자들은 엘라이자 싱클레어를 처리해 주고 자신들을 구해준 헌터 울프를 신뢰하게 되지만, 의심이 많은 더러운 윌리엄은 단순히 엘라이자 싱클레어가 루크 브라운을 죽인 게 아닌가 의심한다.77년 9월, 새로운 노숙자 재밌는 필이 노숙자 무리에 들어오고 나서 얼마 후, 라이브 방송 장비를 구한 헌터 울프는 노숙자들에게 어떤 제안을 한다. 자신의 I.D.O.L을 이용해 해리 스톤의 기억을 모두 추출한 후, 부유하지만 부패한 유력자들 중 한 명인 가브리엘 지라드에게 가짜 이벤트 안내장을 보내 해리 스톤의 기억이 담긴 I.D.O.L의 기억 주입 영상을 수신하도록 한 것. 그 결과, 해리 스톤의 몸은 모든 기억을 잃고 죽게 되었고, 더러운 윌리엄은 핸터 울프가 이번엔 해리 스톤을 죽인 것이 아닌가 의심한다.
                - link "[33]" [ref=f1225e1564] [cursor=pointer]:
                  - /url: "#fn-33"
                - text: 해리 스톤(가브리엘 지라드)은 자신의 생일 축하연을 하던 보트 선상으로 다시 올라온 후, 파티 참가자들 몰래 음료를 신시사이저에 끼얹어 고장내버린다. 만약 그렇지 않았다면 메인 이벤트로 자신의 신시사이저 연주를 뽐내야 했던 해리 스톤(가브리엘 지라드)이 자신의 정체를 들킬 수 있었을 것이다.
