            - generic [ref=f1225e1313]:
              - text: 4장은 줄거리 요약 대신 I.D.O.L의 작동 기호 및 기억 이전이 이루어진 대상에 대한 추리로 구성되어 있다.피험자 37(데클란 아스터)은 전날의 1일치 기억이 추출되어 데이터 디스크에 주입되었으며, 그 결과 전날 익혔던 모라그 새장의 안전 수칙 및 조류 관리 요령, 마시 팔머와의 약속 등을 모두 잊어버리게 된다. 그 결과 실험 표시인 야광 팔찌를 차고 들어갔다가 밝은 색에 자극받은 졸린눈 꽃찌름이에게 팔찌를 빼앗겼고, 부화기에서 제때 새끼 새를 꺼내주지 못했으며, 가면뇌조의 둥지 위치를 몰라서
              - link "[20]" [ref=f1225e1314] [cursor=pointer]:
                - /url: "#fn-20"
              - text: 실수로 알을 밟아버린 후 분노한 가면뇌조에게 공격당해 사망한다.피험자 35(아타르브 레디)는 연구원들이 쓸모없는 정보라고 판단한 1개월치의 스페일 춤에 대한 기억을 주입받았으며, 덕분에 SVH에서 즉흥적으로 스페일 춤을 출 수 있게 되었다.피험자 39(소니 소이어)는 피크닉에서 케네스 오졸라에게 위협당한 사건이 포함된 3일치의 기억이 추출되어 피험자 40(라보나 콜름즈)에게 주입된다. 위협당한 것을 잊은 소니 소이어는 평소에 그랬던 것처럼 주민들을 못살게 굴었고, 옷을 벗는 샤이엔 버드의 사진을 찍어서 공공 안내문에 걸어놓는 무례한 짓을 저지르자 끝내 폭발한
              - link "[21]" [ref=f1225e1315] [cursor=pointer]:
                - /url: "#fn-21"
              - text: 케네스 오졸라가 소니 소이어를 살해하고 자살로 위장한다.
              - link "[22]" [ref=f1225e1316] [cursor=pointer]:
                - /url: "#fn-22"
              - text: 라보나 콜름즈는 자신이 주입받은 위협받는 기억의 주인을 찾으려다 소니 소이어의 기억이라는 것을 알아내고 급히 소이어의 집으로 뛰어가지만 소이어는 이미 살해당한 후였다.피험자 41(사브리나 녹스)은 포도주를 숨겨둔 위치가 포함된 1일치의 기억이 추출되고, 그 기억은 사브리나의 딸인 피험자 42(제인 녹스)
              - link "[23]" [ref=f1225e1317] [cursor=pointer]:
                - /url: "#fn-23"
              - text: 에게 주입된다. 제인 녹스는 술을 숨겨둔 곳을 잊어버린 사브리나 녹스가 옥상에서 담배를 피우는 사이 술을 찾아내고, 친구 카이 나카나를 집으로 불러서 함께 마시려 한다.
