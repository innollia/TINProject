                      - generic [ref=f1225e339]: The professor Oriel Toussaint, killed Morg Brakka with a strap from a straitjacket in the Red Wood asylum.오리엘 투생 교수는 레드 우드 정신병원에서 모르그 브라카를 구속복의 끈으로 살해했다.
