            - generic [ref=f1225e2595]:
              - blockquote [ref=f1225e2596]:
                - generic [ref=f1225e2598]:
                  - text: 1797년, 월터 킨은 제비뽑기를 방해 공작
                  - link "[86]" [ref=f1225e2599] [cursor=pointer]:
                    - /url: "#fn-86"
                  - text: 했고, 짐포 젠킨스와 함께 동굴에 들어가는 임무를 맡았다. 그들은 동굴에 보물을 숨겼다.
                - generic [ref=f1225e2601]: 동굴 안에서 월터 킨은 짐포 젠킨스를 살해하였다. 그런다음 월터 킨은 위시블룸을 절도하였다.
                - generic [ref=f1225e2604]: 나가기 전, 월터 킨은 위시 블룸을 푸트디리움 덩굴로 위장했다. 그것으로 냄새를 은폐했다.
                - generic [ref=f1225e2608]:
                  - text: 자크 트라이튼이 재채기를 하는 바람에, 월터 킨은 발각되어 교수형
                  - link "[87]" [ref=f1225e2609] [cursor=pointer]:
                    - /url: "#fn-87"
                  - text: 을 선고받았다.
              - blockquote [ref=f1225e2610]:
                - generic [ref=f1225e2611]: 1927년, 엘리자 스완, 머틀 송, 재스퍼 와일스, 아이반 컨즈는 동굴에 들어가 보물을 발견했다.
                - generic [ref=f1225e2614]: 그것을 끌어올리는 동안 아이반 컨즈는 비콘을 작동시켰다.
                - generic [ref=f1225e2617]: 재스퍼 와일스가 동굴에서 올라오자 아이반 컨즈와 안셀 마시가 그를 제압했다.
                - generic [ref=f1225e2620]: 그리고 아이반 컨즈는 안셀 마시를 총격했는데, 무게 제한을 초과했기 때문이다.
                - generic [ref=f1225e2623]: 그러나 아이반 컨즈가 풍선을 부풀려 비행선이 추락했고, 아이반 컨즈는 익사하고 말았다.
              - blockquote [ref=f1225e2625]:
                - generic [ref=f1225e2626]: 한편, 동굴 안에서 머틀 송은 엘리자 스완에게 위시블룸을 발견하면 보물을 주겠다고 약속했다.
                - generic [ref=f1225e2629]: 이를 위해 엘리자 스완은 방독면을 제거하고 위시블룸의 냄새를 추적했다.
                - generic [ref=f1225e2632]: 그러나 월터 킨의 편지를 읽은 후, 엘리자 스완은 위시블룸의 냄새가 사람을 변이시킨다는 것을 머틀 송이 인지하고 있었다는 것을 깨달았고, 엘리자 스완은 머틀 송을 총격했다.
              - separator [ref=f1225e2634]
              - blockquote [ref=f1225e2635]:
                - generic [ref=f1225e2636]: 1797년 2월 27일, 어진 프투가 월터 킨에게 정보를 넘긴 후 자크 트라이튼과 선원들은 레무리아 함선을 약탈했다.
                - generic [ref=f1225e2639]: 보물을 손에 넣은 선원들은 위시블룸의 냄새에 감염되고 말았다. 유일한 예외는 엘르아살 가너였는데, 그는 코가 없었기 때문이다.
                - generic [ref=f1225e2642]: 한편, 세븐 시즈 기업이 보물을 수색하고 있었기 때문에 선원들은 그것을 은닉했다.
                - generic [ref=f1225e2645]: 그 과정에서 월터 킨은 위시 블룸을 절도했지만 발각되어 동굴에서 죽음을 선고받았다.
              - blockquote [ref=f1225e2647]:
                - generic [ref=f1225e2649]:
                  - text: 해적선으로 돌아가는 길에, 에이다 베이커는 에이다 베이커를 생환시켜 준 스테판 가너를 제외한 모든 사람을 중독시키는데 성공했다.
                  - link "[88]" [ref=f1225e2650] [cursor=pointer]:
                    - /url: "#fn-88"
                - generic [ref=f1225e2652]: 귀환하던 도중 남은 선원들은 서로를 죽였고, 엘르아살 가너와 스테판 가너만이 지도를 가지고 가까스로 탈출했다.
                - generic [ref=f1225e2655]: 아르만도 항구에 도착한 후, 스테판 가너는 변이되었고, 엘르아살 가너에게 치명상을 입혔지만 반격당해 스테판 가너는 사망한다.
                - generic [ref=f1225e2658]: 한편 섬에 남은 에이다 베이커와 월터 킨도 변이되었다.
            - heading [level=3] [ref=f1225e2665] [cursor=pointer]:
              - text: 
              - link "12.5." [ref=f1225e2666]:
                - /url: "#toc"
              - generic [ref=f1225e2667]:
                - text: 타임라인
                - link "[편집]" [ref=f1225e2669]:
                  - /url: /edit/%EB%8B%A4%EC%8B%9C%20%EA%B9%A8%EC%96%B4%EB%82%9C%20%ED%99%A9%EA%B8%88%20%EC%9A%B0%EC%83%81/%EC%8A%A4%ED%85%8C%EC%9D%B4%EC%A7%80?section=58
            - generic [ref=f1225e2676]:
              - text: (줄거리) 1797년
              - link "[89]" [ref=f1225e2677] [cursor=pointer]:
                - /url: "#fn-89"
              - text: 어진 프투는 월터 킨이 질서당의 폭정으로부터 자신을 구해준 것에 감사하며,
              - link "[90]" [ref=f1225e2678] [cursor=pointer]:
                - /url: "#fn-90"
              - text: 목숨에는 목숨(또는 그 수준의 정보)으로 갚는 레무리아의 풍습대로 월터를 위시블룸이라는 유물이 실려 있는 레무리아 함선의 정보를 준다. 월터 킨은 자크 트라이튼이 이끄는 해적단과 공모하여 해당 레무리아 함선을 약탈하였지만, 세븐 시즈 기업 대표 니콜라스 메이커
              - link "[91]" [ref=f1225e2679] [cursor=pointer]:
                - /url: "#fn-91"
              - text: 가 분노하여 주변 항구를 봉쇄 후 검문을 진행하였기 때문에 위시블룸을 비롯한 보물을 외딴 섬에 숨겨놓게 된다.(사건 4 - 1797년) 외딴 섬에 도착한 선장 일행은 자신이 가지고 있던 어머니의 초상화 뒷면에 보물지도를 작성하고 깊은 동굴 아래에 보물을 숨기기 위한 부하 2명을 제비뽑기로 선정한다. 월터 킨은 당첨 제비의 모양을 다르게 잘라 두는 방식으로 제비뽑기 결과를 조작했고, 자신과 함께 들어간 선원을 죽인 뒤 위시블룸을 몰래 빼돌리고는 식인 악어가 있어서 혼자 돌아왔다고 변명하였다. 위시블룸의 강하고 달콤한 향을 감추기 위해 끔찍한 냄새가 나는 덩굴로 포장하였지만 위시블룸의 냄새에 민감하게 반응하는 선장이 재채기를 하며 월터 킨이 위시블룸을 빼돌렸다는 것이 들통난다. 분노한 선장은 월터 킨을 동굴에 가둬버리는 형벌을 집행하게 된다.(사건 3 - 1797년) 애인 월터 킨을 잃게 된 에이다 베이커
              - link "[92]" [ref=f1225e2680] [cursor=pointer]:
                - /url: "#fn-92"
              - text: 는 그의 복수를 위해 사형에 가담한 일행을 전부 죽이려고 했다. 얼굴에 빨간 점을 찍고서 자신이 성홍열에 걸렸다고 거짓 증언을 하면서 예방약을 먹을 것을 권고했다. 이날 스테판 가너는 홀로 4시간이나 불침번을 수행하다가 결국 잠들어 버렸고 선장인 자크는 성홍열에 걸려죽어도 싸다며 스테판 가너를 제외한 선원에게만 예방약을 주는 방식으로 형벌을 집행했다. 그러나 에이다 베이커가 준비했던 예방약은 실은 독약이었고, 결국 스테판만이 독약을 먹지 않고 살아남는다. 이 사실을 알게 된 스테판은 에이다에게 총을 겨누고 추궁하지만, 결국 에이다를 쏘지 않는 대신 홀로 복귀한다.
              - link "[93]" [ref=f1225e2681] [cursor=pointer]:
                - /url: "#fn-93"
              - text: 에이다는 섬에 홀로 남겨지고(사건 2) 동굴로 돌아가 월터와 함께 살다 1805년에 죽는다. (사건 4)(사건 2 - 1797년) 선장을 비롯한 다수의 사망자가 발생한 만큼, 일등 항해사와 이등 항해사는 누가 선장을 맡을지 투표하게 되고, 일등 항해사가 투표에서 당선된다. 그러나 이에 불복한 이등 항해사 파벌이 선상 반란을 일으키고, 두 파벌의 전쟁통 속에 엘르아살 가너와 그 아들 스테판 가너만 보물 지도를 가지고 항구까지 도망치는 데 성공하고 나머지는 모두 사망한다.(사건 1 - 1797년) 코가 없어 나무 코를 달고 있던 엘르아살 가너는 위시블룸의 효과가 없었지만 위시블룸에 노출된 스테판 가너는 몸이 변해 괴물이 되어 있었고,
              - link "[94]" [ref=f1225e2682] [cursor=pointer]:
                - /url: "#fn-94"
              - text: 아버지에게 치명상을 입힌다. 엘르아살 가너는 아들에게 총으로 반격하였지만 미안해하며 숨을 거둔다. 총을 맞은 스테판 가너는 보물지도를 떨어뜨리고 뛰쳐나가지만 결국 사망하고 만다.
              - link "[95]" [ref=f1225e2683] [cursor=pointer]:
                - /url: "#fn-95"
              - text: 이때 보물지도는 엘르아살 가너를 치료하러 온 아바쿠스 졸리프가 줍게 되는데, 뒷면에 지도가 있단 사실은 모른 채 훗날 자신의 손자의 박물관에 늙은 여자의 그림
              - link "[96]" [ref=f1225e2684] [cursor=pointer]:
                - /url: "#fn-96"
              - text: 이라는 이름으로 전시된다.(에필로그) 1800년, 변이된 에이다가 과거를 바꿀 수 있기를 바란 적이 있냐고 묻자, 마찬가지로 변이된 월터는 난 이미 소원을 이뤘으며, 그보다 많은 것을 얻었다고 답한다.
              - link "[97]" [ref=f1225e2685] [cursor=pointer]:
                - /url: "#fn-97"
              - text: 약 130년 후, 가면의 형제단은 퀵아이라는 새 분파가 생긴 상태며, 퀵아이 마스터는 퀵아이 실행자인 머틀 송에게 위시블룸의 정보가 담긴 책을 전달하고 회수를 명령한다. 머틀 송은 퀵아이 입회인인 앙투안 스필스버리
              - link "[98]" [ref=f1225e2686] [cursor=pointer]:
                - /url: "#fn-98"
              - text: 와 탐사대를 맺기로 한다.(사건 1 - 1927년) 재스퍼 와일스는 졸리프 박물관의 그림이 자신이 찾고 있던 바로 그 지도라는 것을 알아챈다. 그래서 그 지도를 얻기 위해 박물관장 에드워드 졸리프에게 구매를 시도했지만 거절당했다. 재스퍼 와일스는 레그커터스 갱단의 로레타 보르디를 고용해서 지도를 훔쳐내도록 지시했다. 그러나 레그커터스 갱단 또한 트라이튼 선장의 잃어버린 보물에 관심이 많았고, 로레타 보르디는 지도를 들고 도망치려 했다. 하지만 이를 발견한 재스퍼 와일스가 그녀를 말로 짓밟아 죽여버리고 보물 지도를 되찾는 데 성공했고, 결국 그의 지도를 기반으로 탐사대가 결성된다.(사건 2 - 1927년) 난파선이 된 해적선의 갑판을 수색하던 중, 탐사팀의 선장 라디건 올리타가 격자창 너머로 반짝이는 보석을 발견한다. 라디건이 보물에 습득하기 위해 사다리를 내려가던 그 순간 월터 킨이 사다리를 넘어뜨려 선장이 대포알에 머리를 박아 죽게 만들고, 그 시체를 바다로 끌고 가버린다.(사건 3 - 1927년) 월터 킨은 라디건 올리타의 시체로 허수아비를 만들어 돌아가라고 경고한다, 스폰서인 앙투안 스필스버리는 살인자가 있음을 확신하여 탐사를 중지하고자 하였으나, 탐사가 중지되는 걸 원하지 않았던 아이반 컨즈는 앙투안의 위스키에 독약을 섞어놓고 살해, 환각버섯을 먹고 죽은 것으로 위장하여 탐사를 강행하게 된다.(사건 4 - 1927년) 위시블룸의 냄새의 위험성을 알고 있던 머틀 송은 무해한 풀의 설명문을 찢어, 마치 독성 포자가 있는 것처럼 위장하여 모두에게 방독면을 찰 명분을 만들어둔다. 그리곤 동굴로 내려간 탐사대는 보물을 발견하는 데 성공하고 견인차로 끌어올리게 된다.한편 아이반은 레그커터스의 안셀 마시를 미리 고용, 자신의 신호기 신호를 따라 비행선을 타고 오도록 하였다. 그리고 자신을 제외한 탐사 대원들을 총으로 위협하여 보물을 독식, 탈출할 계획을 세우고 있었다. 하지만 단위 변환을 잘못한
              - link "[99]" [ref=f1225e2687] [cursor=pointer]:
                - /url: "#fn-99"
              - text: 안셀 때문에 비행선 중량이 초과되어 움직일 수가 없자 아이반은 안셀도 총으로 쏴서 무게를 줄인다. 하지만 아이번은 비행선의 조작 방법을 잘 몰랐고, 레버를 반대로 조작하는 바람에 그대로 바다로 빠져 비행선과 침몰당한다.
              - link "[100]" [ref=f1225e2688] [cursor=pointer]:
                - /url: "#fn-100"
              - text: 한편 위시블룸을 찾으면 자신의 보물을 양도하겠다는 머틀 송의 말에 속아, 엘리자 스완은 방독면을 벗고 위시블룸의 달콤한 향을 따라 위시블룸을 찾아낸다. 하지만, 월터 킨의 편지에는 위시블룸이 몸을 변이시킨다는 진실이 담겨있었고 머틀이 자신을 속였다는 것을 깨달은 엘리자는 머틀을 사살한다. 자신이 곧 인간이 아니게 된다는 것을 깨닫고 체념한 엘리자는 거북이 연상되는 모습으로 변이되어 130년 이상 살아왔던 월터에게 삶을 즐기고 있냐고 묻고, 월터는 이제껏 살아온 시간이 인생 최고의 시간이었다고 답한다.1932년, 재스퍼가 섬에 찾아와 엘리자가 좋아하던 담배와 책, 모자를 두고 떠난다. 주기적으로 엘리자를 위한 물품을 공급해 주는 것으로 보인다. 섬 위에서 날아가는 사람의 머리와 하반신를 가진을 한 새가 변이된 엘리자로 추정된다. 그녀는 과거 파일럿이었고, 탐험 도중에도 비행기 잡지를 볼 정도로 비행을 좋아했다. 이 또한 꿈을 이룬 셈.전체적으로 다시 깨어난 황금 우상보다는 전작인
              - link "황금 우상 사건" [ref=f1225e2689] [cursor=pointer]:
                - /url: /w/%ED%99%A9%EA%B8%88%20%EC%9A%B0%EC%83%81%20%EC%82%AC%EA%B1%B4
              - text: 과 더 연결성이 짙은 DLC이다.
