                - text: 사건 10
                - link "[편집]" [ref=f1225e1018]:
                  - /url: /edit/%EB%8B%A4%EC%8B%9C%20%EA%B9%A8%EC%96%B4%EB%82%9C%20%ED%99%A9%EA%B8%88%20%EC%9A%B0%EC%83%81/%EC%8A%A4%ED%85%8C%EC%9D%B4%EC%A7%80?section=17
            - generic [ref=f1225e1024]:
              - table [ref=f1225e1026]:
                - rowgroup [ref=f1225e1027]:
                  - row [ref=f1225e1028]:
                    - cell [ref=f1225e1029]:
                      - strong [ref=f1225e1031]: "사건 10: The Procedure(절차)"
                  - row [ref=f1225e1032]:
                    - cell [ref=f1225e1033]:
                      - table [ref=f1225e1037]:
                        - rowgroup [ref=f1225e1038]:
                          - row [ref=f1225e1039]:
                            - cell [ref=f1225e1040]:
                              - generic [ref=f1225e1041]: 
                            - cell [ref=f1225e1045]:
                              - generic [ref=f1225e1046]: 
              - blockquote [ref=f1225e1050]:
                - generic [ref=f1225e1051]: 테사 네바리 및 그녀의 일부 헌신자는 절차를 위해 하모니 재단에 있었다.그 목적은 증오를 제거한 다음 공감을 다시 채움으로써 계몽을 이루는 것이다.그러나, 이들은 하모니 재단의 모든 것을 차지하려는 사람들에게 방해받는다.밑의 큰 방에서는, 브루스 마이슨이 샘 로빈슨을 붙잡았다.이에 대응하여, 알렉스 레밍턴은 브루스 마이슨을 크리스탈로 찔렀다.이로 인해, 빌리 그리어가 알렉스 레밍턴을 테이저건으로 쏘았다.
              - generic [ref=f1225e1053]:
                - text: 1975년 4월 13일에 일어난 사건. 알렉스 레밍턴이 샘 로빈슨을 지키기 위해 크리스탈로 브루스 마이슨을 공격했는데 이 이유를 추리하는 부분이 골 때린다. 처음 봤을 때에는 알렉스 레밍턴이 샘 로빈슨을 공격하려다 경비들이 저지하자 경비를 공격한 건가 싶은 수준이다. 경비들이 알렉스가 샘을 좋아하기라도 했나 이야기하는 부분이나 사진을 보고 추론해 보면 서로 사촌간이고 가족을 보호하기 위해 공격한 것이다. 하지만 사진을 봐도 사진속 인물들이 동일인물같지 않다는 게 문제. 따라서 테사의 멘토 사진 속 혜성이 샘의 삼촌 사진의 혜성과 같다는 점을 통해 샘의 삼촌의 생년월일을 파악하고, 이를 알렉스의 아버지의 생년월일과 대조함으로써 둘이 동일인물임을 파악해야 한다.한편 테사 네바리는 문양의 뜻을 완전히 잘못 파악하고 있다.
                - link "[15]" [ref=f1225e1054] [cursor=pointer]:
                  - /url: "#fn-15"
                - text: 주입/추출도 반대로 알고 있고, 공감이라고 추측한 문양도 실은 다른 뜻이었다.
                - link "[16]" [ref=f1225e1055] [cursor=pointer]:
                  - /url: "#fn-16"
                - text: 증오라고 추측한 문양은 그나마 실제 의미와 약간은 연관이 있다. 전작을 해본 사람은 기억할지도 모르지만 이 문양의 뜻은 '열'인데, 오리엘 투생 교수는 레무리안 고서에 감정적인 의미로 사용될 때는 불타오르는 감정, 즉 증오의 뜻으로 쓰였다고 서술하고 있다. 어차피 테사 네바리가 재조립한 우상은 내부 회로가 이어져 있지 않아 아예 작동되지 않는 물건이므로 의미는 없지만, 문제는 테사 네바리와 협업했던 이들도 문양의 뜻을 완전히 잘못 알고 있다는 점이다.클리어 후 유진 마모트가 승진했고, 테사 네바리에게 전화하여 조언자 위치로 불러들이는 장면을 확인할 수 있다.
