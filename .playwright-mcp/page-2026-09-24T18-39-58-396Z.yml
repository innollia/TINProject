              - blockquote [ref=f1225e1611]:
                - generic [ref=f1225e1612]: OPIG 기업의 '만족한 고객' 프로젝트 목적은 O-렌지 매출을 제고하는 것이었다. 이를 달성하기 위해 프로젝트의 관계자는 수백만 명의 관중이 페일 결승전을 시청하는 동안 I.D.O.L을 사용해 마약 유포리아가 든 O-렌지를 마시는 기억을 주입하려 했다.프로젝트는 유진 마모트가 제안하고 주도하였다.
              - blockquote [ref=f1225e1614]:
                - generic [ref=f1225e1615]: 테사 네바리의 공격이 있은 후, 보안 프로토콜이 바뀌었다. 그 결과, 헌터 울프는 루크 브라운의 도움을 받아 OPIG연구실에서 브루스 마이슨을 습격하였다.그 후, 헌터 울프는 I.D.O.L을 사용하여 루크 브라운의 모든 기억을 추출한 다음, 브루스 마이슨에게 모든 기억을 주입했다.
              - blockquote [ref=f1225e1617]:
                - generic [ref=f1225e1618]: 팀 스펜더는 옥상에 유진 마모트를 구금했다.유진 마모트는 관중이 O-렌지의 나쁜 기억을 받지 않도록, 무모한 행동을 벌여 방송을 중단시켰다. 그 결과, 잭 노왁만이 사각 디스크의 모든 기억을 받았다.그 직후, 테사 네바리는 공모자와 함께 TV 방송국에 침입하여 I.D.O.L을 창문 밖으로 투척해 버렸다.
              - blockquote [ref=f1225e1620]:
                - generic [ref=f1225e1621]: 잭 노왁은 헌터 울프인 척 행세하면서 I.D.O.L로 비밀리에 실험을 벌이며 인류를 교육할 최선의 방법을 강구했다.그러나, 환멸을 느끼게 된 잭 노왁은 모두를 천재로 변신시키는 수밖에 없다고 결론을 내린다.잭 노왁은 이 계획을 실행하려고 만족한 고객 프로젝트를 이용하여 수백만의 관중을 아이작 노왁으로 변신시키려 했다.그러나, TV방송국에서 발생한 사건으로 인해 잭 노왁만이 아이작 노왁으로 변신한 유일한 사람이 되고 말았다.
              - table [ref=f1225e1624]:
                - rowgroup [ref=f1225e1625]:
                  - row [ref=f1225e1626]:
                    - cell [ref=f1225e1627]:
                      - generic [ref=f1225e1628]: 
              - generic [ref=f1225e1632]: 1977년 10월 3일, OPIG 회의에서 유진 마모트가 입안한 O-렌지를 마시는 기억을 I.D.O.L로 추출해 수백만 명의 관중들이 시청하는 페일 결승전에 광고로 송출시켜 O-렌지의 매출을 제고하는 '만족한 고객' 프로젝트가 통과된다. I.D.O.L을 상업적으로 활용하려는 것에 분노한 테사 네바리는 유진 마모트에게 음료수를 끼얹지만 곧 경비원들에게 끌려나가고, 공감의 전사들이 찾아갈 거라며 협박한다. 한편, 팀 스펜더와 마리 웨스트레이크는 멍청한 데다가 미신적인 경향까지 있는 유진 마모트와 계속 함께 일하는 것에 대해 위기감을 공유하고 남몰래 그를 실각시킬 계획을 세우게 된다.한편 자신의 계획이 계속 실패한 것에 대해 회의감을 느끼던 헌터 울프는 좀 더 광범위한 변화가 필요하다는 것을 깨닫게 된다.
              - table [ref=f1225e1634]:
                - rowgroup [ref=f1225e1635]:
                  - row [ref=f1225e1636]:
                    - cell [ref=f1225e1637]:
                      - generic [ref=f1225e1638]: 
              - generic [ref=f1225e1642]: 11월 8일, 헌터 울프와 루크 브라운(엘라이자 싱클레어)은 OPIG 연구실에서 경비원 브루스 마이슨을 습격하여 제압한다. 헌터 울프는 I.D.O.L을 사용하여 루크 브라운의 모든 기억을 추출한 후 브루스 마이슨에게 주입해 OPIG 연구실에 내부자를 심는 데 성공한다.
              - table [ref=f1225e1644]:
                - rowgroup [ref=f1225e1645]:
                  - row [ref=f1225e1646]:
                    - cell [ref=f1225e1647]:
                      - generic [ref=f1225e1648]: 
              - generic [ref=f1225e1652]:
                - text: 12월 4일, 헌터 울프와 루크 브라운(브루스 마이슨)은 모든 기억이 추출되어 사망한 아이작 노왁의 시체를 다리에서 떨어트린다.
                - link "[34]" [ref=f1225e1653] [cursor=pointer]:
                  - /url: "#fn-34"
                - link "[35]" [ref=f1225e1654] [cursor=pointer]:
                  - /url: "#fn-35"
                - text: 12월 16일 오후 1시 45분, 마리 웨스트레이크가 가짜 증거품으로 I.D.O.L을 감시하고 있던 보안 팀장 빌리 그리어를 유인해내자, 팀 스펜더는 '만족한 고객' 프로젝트를 망칠 심산으로 썩은 O-렌지를 마시고 구역질하는 1분 간의 기억을 I.D.O.L에 주입한 후 위스키로 입가심을 한다.오후 2시 30분, 보안 밴에 I.D.O.L을 태우고 OPTV를 향해 이동하던 중, 루크 브라운(브루스 마이슨)은 잭 노왁에게 전달받은 PIN 코드를 사용해 I.D.O.L 안에 담긴 썩은 O-렌지를 마시는 1분 간의 기억을 빼내고 숨겨둔 기억 디스크를 사용해 아이작 노왁의 모든 기억을 I.D.O.L에 주입한다. 이 과정에서 썩은 O-렌지를 마시는 짧은 기억에 노출되어 구역질을 한다. 이때 아이작 노왁의 기억을 저장하기 위해 네모 기억 디스크가 사용되었으며, 해당 디스크는 4챕터의 시점에서는 완전히 비어 있었던 것을 확인할 수 있다.오후 3시, 아이작 노왁의 모든 기억이 담긴 I.D.O.L이 OPTV 스튜디오에 들어가게 된다.오후 5시 15분, 팀 스펜더와 마리 웨스트레이크는 광고 모델로 OPIC 스튜디오에 와 있었던 여배우 서머 나이틀리의 가짜 메시지를 준비, 유진 마모트를 옥상으로 유인하여 가둬버린다. 옥상에 썩은 음료수와 함께 적힌 메시지를 보게 된 유진 마모트는 I.D.O.L에 담긴 기억의 정체를 간파하고, 광고가 송출되기 직전에 송신탑을 타고 올라가 영상 송출 코드를 뽑아버리는 데에 성공하지만, 곧 전선에 매달리는 신세가 된다.유진 마모트가 방송 송출을 중단시키면서 I.D.O.L이 영향을 미친 것은 현장에 있던 잭 노왁 한 사람에 그쳤고, 아이작 노왁(잭 노왁)은 자신이 왜 이카루스
                - link "[36]" [ref=f1225e1655] [cursor=pointer]:
                  - /url: "#fn-36"
                - text: 의 얼굴을 하고 있냐며 당황한다.한편, 해고된 것에 앙심을 품은 테사 네바리는 잭 노왁이 보낸 편지를 받고
                - link "[37]" [ref=f1225e1656] [cursor=pointer]:
                  - /url: "#fn-37"
                - text: 자신이 이끌던 단체 공감의 전사들과 함께 스튜디오에 침입, I.D.O.L을 창문 밖으로 집어던져 버린다. I.D.O.L 내부의 렌즈는 모조리 파손되어 더 이상 사용할 수 없게 되어 버린다.모든 사건이 끝난 후 검거되어 끌려가는 테사 네바리, 떨어져서 중상을 입었지만 투기 투자 최고 책임자로 승진한 유진 마모트, 사보타주 혐의로 해고된 팀 스펜더와 마리 웨스트레이크, 정신병원에서 탈출한 에코 세쿤다(오리엘 투생), 잭 노왁이 자신의 행동을 해명하기 위해 남겨둔 영상을 보는 아이작 노왁(잭 노왁), 망가진 채 땅에 묻히는 I.D.O.L의 모습을 보여주며 게임이 끝난다.
              - blockquote [ref=f1225e1657]:
                - generic [ref=f1225e1659]:
                  - text: 그래서 저는 깨달았습니다. 의미 있는 변화를 이루려면, 인류에게는 수백만 명의 더 훌륭한 개인이 더 필요하다는 것을요.
                  - link "[38]" [ref=f1225e1660] [cursor=pointer]:
                    - /url: "#fn-38"
                  - text: 그리고 저도 그 중 하나가 되어야 했죠. 그렇잖아요?
                  - link "스스로 감수하려고 하지 않는 희생을 어떻게 다른 수백만 명에게 강요할 수 있겠어요?" [ref=f1225e1661] [cursor=pointer]:
                    - /url: /w/%ED%83%80%EB%85%B8%EC%8A%A4
                  - text: 남은 일은 제가 아는 가장 도덕적이고, 지적이며, 교육받은 사람을 찾는 거였죠. 그때 삼촌을 생각한 거예요...
              - generic [ref=f1225e1662]: 이것으로 사건은 대충 마무리된 듯 보였으나, I.D.O.L 안에 있는 렌즈가 망가졌을 뿐이지 기억을 저장하는 핵심 부품인 크리스탈이 손상되었다는 이야기는 없으며, 갑자기 현대에 떨어진 고대 레무리아인 에코 세쿤다는 정신병원에서 탈출하여 자유의 몸이 되는 등 여러 떡밥이 남아 있다. 이들에 대한 내용이 DLC에서 등장할 듯.
