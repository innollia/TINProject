                - generic [ref=f1225e1861]: 로이 샘슨은 마지막으로 자신의 총을 되찾아 혼돈 장치를 쏘았다.
              - generic [ref=f1225e1863]:
                - text: 11시, 로이는 총으로 수신기와 연결된 시장의 마이크를 쏘아서 바우어 갱단의 계획을 무력화시킨다.11시 15분, 힐데가르드 바우어와 부하들은 체포되고,
                - link "[47]" [ref=f1225e1864] [cursor=pointer]:
                  - /url: "#fn-47"
                - text: 로이는 빈 상점으로 도망친 세쿤다
                - link "[48]" [ref=f1225e1865] [cursor=pointer]:
                  - /url: "#fn-48"
                - text: 를 쫓다가 바닥에 놓인 혼돈 장치에 주의를 뺏겨 세쿤다에게 기습당한다. 이후 서로의 귀마개가 빠질 정도로 몸싸움 끝에 로이가 세쿤다에게 총을 빼앗긴다. 세쿤다가 로이를 쏘려는 순간, 로이는 바닥에 놓인 혼돈 장치를 작동시키고, 당황하는 세쿤다에게서 총을 빼앗아 혼돈 장치를 부숴 버린다.후일담으로 수감되어 테사 네바리를 만난 힐데가르드 바우어, 기억의 혼돈으로 구사하는 어휘가 이상해졌지만 여전히 뛰어난 추리력과 클리프의 도움
                - link "[49]" [ref=f1225e1866] [cursor=pointer]:
                  - /url: "#fn-49"
                - text: 으로 수사에 참여하는 로이 샘슨, 기억이 혼돈된 채 다시 정신병원에 갇혀 레무리아어와 알비온어로 된 소설을 쓰고 있다는 에코 세쿤다의 이야기와 함께 첫 번째 DLC가 막을 내린다.
                - link "[50]" [ref=f1225e1867] [cursor=pointer]:
                  - /url: "#fn-50"
                - link "[51]" [ref=f1225e1868] [cursor=pointer]:
                  - /url: "#fn-51"
                - text: 난이도가 상당히 높은 편인데 최초의 장면은 로이가 혼란 장치를 맞은 후에 당시의 기억을 회상하는 시점이기 때문에 현실이 추상적으로 보이기 때문이다. 그 추상적인 형태들을 비교 대입하면서 어떤 상황인지 대조를 해야 하는 상황이기에 생각보다 풀이가 어려운 편. 심지어 그 장면이 누구의 시점인지도 바로 알 수 없다. 사건 4에 입장하자마자 펼쳐지는 외계인과 뱀과 풍선과 광선총의 환상의 콜라보가 플레이어의 정신줄을 아득히 날려버린다.
            - heading [level=3] [ref=f1225e1874] [cursor=pointer]:
              - text: 
              - link "9.5." [ref=f1225e1875]:
                - /url: "#toc"
              - generic [ref=f1225e1876]:
                - text: 줄거리
                - link "[편집]" [ref=f1225e1878]:
                  - /url: /edit/%EB%8B%A4%EC%8B%9C%20%EA%B9%A8%EC%96%B4%EB%82%9C%20%ED%99%A9%EA%B8%88%20%EC%9A%B0%EC%83%81/%EC%8A%A4%ED%85%8C%EC%9D%B4%EC%A7%80?section=37
            - blockquote [ref=f1225e1885]:
              - generic [ref=f1225e1886]: 힐데가르드 바우어가 이끄는 바우어 갱단은 뉴 웰스의 2대 범죄 조직 중 하나였다. 힐데가르드 바우어는 문화 유산 프로젝트 작업을 통해 모이라 메레디스의 호의를 얻고 앤디어 갱단을 약화 시키라고 조언했다.
              - generic [ref=f1225e1889]: 그에 따른 복수로, 앤디어 갱단은 힐데가르드 바우어의 사무실에 녹음기를 심었다. 바우어 갱단이 마약을 판매하고 있다는 증거를 얻기 위해서였다. 그들은 이 증거를 모이라 메레디스에게 주었다.
              - generic [ref=f1225e1892]: 모이라 메레디스가 깜짝 기자회견을 발표했을 때, 힐데가르드 바우어는 소리를 사용해 사람들의 기억에 혼돈을 일으킬 수 있는 무기의 테스트를 가속하라고 지시했다.
            - heading [level=3] [ref=f1225e1899] [cursor=pointer]:
              - text: 
              - link "9.6." [ref=f1225e1900]:
                - /url: "#toc"
              - generic [ref=f1225e1901]:
                - text: 타임라인
                - link "[편집]" [ref=f1225e1903]:
                  - /url: /edit/%EB%8B%A4%EC%8B%9C%20%EA%B9%A8%EC%96%B4%EB%82%9C%20%ED%99%A9%EA%B8%88%20%EC%9A%B0%EC%83%81/%EC%8A%A4%ED%85%8C%EC%9D%B4%EC%A7%80?section=38
            - generic [ref=f1225e1910]:
              - text: 시점은 본편 에필로그 마지막 충돌 이후.에코 세쿤다는 정신병원에서 간호사 모르그 브라카를 죽이고 스쿠터를 타고 탈출한다. 하모니 재단에서 I.D.O.L을 옮기는 직원들을 보고 그들을 추적하다가 이후 방송국 바깥으로 추락한 I.D.O.L의 내부에 있는 핵심 부품을 탈취해 자신이 사용할 혼돈 장치로 만든다.이후, 배가 고파진 에코 세쿤다는 어느 패스트푸드점의 드라이브 스루에 있던 음식을 훔친다. 마약이 탈취되는 것을 원치 않던 바우어 갱단원들이 에코 세쿤다를 체포하여 갱단으로 끌고 간다.
              - link "[52]" [ref=f1225e1911] [cursor=pointer]:
                - /url: "#fn-52"
              - text: 하지만 에코 세쿤다는 자신의 혼돈 장치를 이용해 힐데가르드의 적을 없애주겠다고 제안하였고, 그의 무기의 위력을 알게 된 힐데가르드가 이를 받아들인다.
              - link "[53]" [ref=f1225e1912] [cursor=pointer]:
                - /url: "#fn-53"
              - text: 바우어 갱단은 메레디스 시장의 문화 유산 프로젝트를 지원하면서 몰래 이를 암암리에 마약을 제조 및 유통하는 수단으로 이용하고 있었으나,
              - link "[54]" [ref=f1225e1913] [cursor=pointer]:
                - /url: "#fn-54"
              - text: 앤디어 갱단이 힐데가르드 바우어의 회의 내용을 녹취해 메레디스에게 폭로하였고, 힐데가르드 바우어는 더 늦기 전에 메레디스를 멈출 수단으로 에코 세쿤다의 혼돈 장치를 사용해 메레디스의 기억을 혼란에 빠지게 만들어 자신의 뒤처리 흔적을 최소화하려 했다.기자 회견 직전, 일전에 있던 혼돈 장치의 존재가 음원 회사를 통해서 연설 장소에 송신기가 설치된 것을 알게 된 로이 샘슨이 메레디스를 찾아가 기자 회견을 멈추게 하려 했지만,
              - link "[55]" [ref=f1225e1914] [cursor=pointer]:
                - /url: "#fn-55"
              - text: 메레디스는 이를 무시하고 기자 회견을 예정대로 진행한다. 하지만, 로이 샘슨이 회견장의 마이크를 쏘아 마이크를 통해 혼돈 장치가 메레디스를 공격하는 것을 멈추는 데 성공한다.이후 로이 샘슨 일행은 지역 경찰들과 함께 바우어 갱단을 모두 체포한다. 로이 샘슨은 에코 세쿤다를 추적하다가
              - link "[56]" [ref=f1225e1915] [cursor=pointer]:
                - /url: "#fn-56"
              - text: 에코 세쿤다에게 반격 당해 죽을 위기에 처하게 되나, 순간의 기지로 혼돈 장치를 작동시켜 로이 샘슨과 에코 세쿤다 모두를 혼란 상태에 빠지게 하면서 그를 무력화시켜 결과적으로 체포하는 데 성공한다. 혼돈 장치는 로이 샘슨의 마지막 순간에 발사한 총격으로 완전히 파괴되었다.
