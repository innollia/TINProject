                    - cell [ref=f1225e842]:
                      - generic [ref=f1225e843]: At the Seven Seas Auction, Tesa Nevari was outbid by Moumaati Dasilva for the statue from Lemuria, and so decided to steal it instead.테사 네바리는 세븐 시즈 경매에서 마우마티 다실바에게 레무리아의 동상 입찰에 졌다. 그래서 대신 그것을 도둑질하기로 결심한다.Tesa Nevari distracted Erwin Bogart while Robbie Froberg stole their keys.테사 네바리가 어윈 보가트의 주의를 딴 데로 돌리는 동안 로비 프로버그는 열쇠를 훔쳤다.Nils Wilmington discovered Robbie Froberg stealing the statue upstairs, and a fight ensued.닐스 윌밍턴은 로비 프로버그가 위층에서 동상을 훔치는 것을 발견했고 싸움이 벌어졌다.Robbie Froberg pushed Nils Wilmington into a circuit box with a cane, causing instant death.로비 프로버그는 지팡이를 사용해 닐스 윌밍턴을 배전함으로 밀쳤다. 이는 즉시 사망이라는 결과로 이어졌다.
