                - text: 사건 2
                - link "[편집]" [ref=f1225e2010]:
                  - /url: /edit/%EB%8B%A4%EC%8B%9C%20%EA%B9%A8%EC%96%B4%EB%82%9C%20%ED%99%A9%EA%B8%88%20%EC%9A%B0%EC%83%81/%EC%8A%A4%ED%85%8C%EC%9D%B4%EC%A7%80?section=41
            - generic [ref=f1225e2016]:
              - blockquote [ref=f1225e2017]:
                - generic [ref=f1225e2018]: 염소가 죽은 이유는 누군가 막자사발과 막자를 이용해 문드리프트를 간 반죽으로 만든 다음 염소의 배에 넣었기 때문이다.
              - blockquote [ref=f1225e2020]:
                - generic [ref=f1225e2021]: 프라비 나가사이는 문드리프트 중독으로 사망했다. 누군가 보습제에 문드리프트 반죽을 넣었기 때문이다.
              - blockquote [ref=f1225e2023]:
                - generic [ref=f1225e2024]: 토요일, 프라비 나가사이는 자신이 영원한 삶을 누릴 것이라고 발표했다.
                - generic [ref=f1225e2027]: 그 후, 야간 보초 임무 중, 코이 나가사이는 테스트를 위해 염소를 데리고 연못으로 갔다.
                - generic [ref=f1225e2030]: 이를 끝낸 후, 코이 나가사이는 연못에 막자사발과 막자를 세척했지만, 알코올을 이용하지는 않았다.
                - generic [ref=f1225e2033]: 이로 인해 일요일 저녁 식사를 준비할 때 해당 막자사발과 막자를 사용하는 바람에 사람들은 탈이 나게 되었다.
                - generic [ref=f1225e2036]: 그날 밤, 프라비 나가사이는 보습제를 사용했고, 그 결과 죽음을 맞이했다.
              - generic [ref=f1225e2038]:
                - text: 시점은 사건 1보다 과거의 시점으로 전환된다.최초 파수꾼인 프라비 나가사이는 폭포의 시련
                - link "[59]" [ref=f1225e2039] [cursor=pointer]:
                  - /url: "#fn-59"
                - text: 을 받았던 마지막 최초 파수꾼이었다. 그는 레무리아의 수도원에서 새로운 메세지를 공표했는데, 바로 자신은 앞으로 영원한 최초의 파수꾼이라는 선언이었다. 이는 25세의 자신의 아들들의 생일 다음날에 발표되었는데, 자신의 아들들은 자신과 콴자를 비롯한 다른 수련자들이 보기에도 파수꾼의 책임을 맡기기엔 영 못 미더웠기 때문이었다.그러나 코이는 이 발표에 불만을 품었는데, 이는 서구 문물을 좋아하고 쾌락과 재물을 즐기는 스타일이었던 코이는 프라비가 영원한 파수꾼의 선언을 한다면 자신은 평생 이런 검소하고 누추한 삶을 살아야 했기 때문이었다. 그랬기에 그는 몇 주 전부터 자신만의 장소에서 재물이나 서구 문물을 숨겨놓고 그 부근에서 문드리프트를 키우고 있었으며, 그걸 사람들을 상대로 실험까지 하는 행위를 저질렀다. 그러던 도중 프라비의 발표에 그는 음모를 실행한다.일전에 프라비 나가사이는 폭포의 시련을 통해서 얼굴의 일부를 제외한 전신에 엄청난 화상을 입은 상태였다.
                - link "[60]" [ref=f1225e2040] [cursor=pointer]:
                  - /url: "#fn-60"
                - text: 그래서 프라비는 레무리아의 전통 의사와 서양 의학을 배운 의사 두 명에게 케어를 받고 있었는데,
                - link "[61]" [ref=f1225e2041] [cursor=pointer]:
                  - /url: "#fn-61"
                - text: 특히 몇 주 전에 발생한 원인 불명의 구토 증세를 보이는 바이러스로 인해서 전통 의사와 최신 의사는 각자가 구토의 대한 처방전과 화상에 대한 처방전들을 함께 내려준 상태였다. 코이는 프라비가 화상에 대해서는 레무리아 전통 진단보다는 서양 치료 방식을 선호했기에 잠들기 전에는 보습제를 피부에 바르는 것을 알고 있었다.그래서 코이는 다시 한 번 막자사발로 간 문드리프트 반죽을 우선 염소에게 실험했고, 염소는 수차례 구토를 하다가 사망하는 것으로 문드리프트는 먹는 것뿐만 아니라 바르는 것으로도 해할 수 있다는 것을 확인하게 된다. 이에 코이는 밤에 피부 보습제에 섞어 넣었고 그걸 모르고 잠들기 전에 온몸에 바르고 잠든 나가사이는 몇 번이나 구토를 하다가 사망하고 만다. 나가사이의 사후 서양 의학 의사는 특정 인원에게 나가사이와 동일한 반응이 일어난 것에 대한 의심을 하며 부검을 요청했었지만 전통 의학 의사가 이에 경악하며 그녀를 저지했고 음모가 드러날 기회는 그대로 사라지고 만다.문드리프트는 실제로 존재하는 것이 아니라 세계관 내에 가상적으로 존재하는 식물이다. 따라서 관련 추리를 할 때 정황을 잘 살펴보아야 한다.코이가 연못가에 숨겨둔 가방 속에는 여러 가지 서양식 물건들과 더불어 마름모꼴의 루비가 박힌 반지가 있는데, 이는 전작에 등장했던 형제단의 상징이다. 잔당의 후손 중 하나가 레무리아로 이주해온 것으로 추정된다.
