            - generic [ref=f1225e2522]:
              - blockquote [ref=f1225e2523]:
                - generic [ref=f1225e2524]: 1797년, '마지막 사신'호의 일등 항해사는 요리사, 조타수, 갑판장, 항법사, 돛 조작수의 표를 받아 새로운 선장으로 당선되었다.
                - generic [ref=f1225e2527]: 이등 항해사는 선거에서 졌고 병기장, 선박 수리공, 돛 수리공, 포수의 표를 받았다.
                - generic [ref=f1225e2530]: 그날 밤, 이등 항해사와 그의 파벌은 일등 항해사의 파벌을 공격했고, 양측 모두 수많은 사람이 죽었다.
                - generic [ref=f1225e2534]:
                  - text: 격렬한 싸움 도중 갑판장과
                  - link "[84]" [ref=f1225e2535] [cursor=pointer]:
                    - /url: "#fn-84"
                  - text: 화약실 소년은 지도를 가지고 탈출했다.
              - blockquote [ref=f1225e2536]:
                - generic [ref=f1225e2537]: 1927년, 라디건 올리타는 쇠창살 사이로 보석을 발견하고 갑판 아래로 내려갔다.
                - generic [ref=f1225e2540]: 그러나 누군가 그물을 끌어당기고, 그로 인해 사다리가 넘어지는 바람에 라디건 올리타는 추락해 대포알에 부딪히고, 결국 바다로 끌어당기어지고 말았다.
              - generic [ref=f1225e2542]:
                - text: 선원 목록에서 에이다 베이커나 월터 킨과 같은 이름이 보이며
                - link "황금 우상 사건" [ref=f1225e2543] [cursor=pointer]:
                  - /url: /w/%ED%99%A9%EA%B8%88%20%EC%9A%B0%EC%83%81%20%EC%82%AC%EA%B1%B4
                - text: (전작)과의 연결고리를 보여준다. 마지막 시점이 1795년이었으므로, 그보다 2년 후의 미래를 보여주는 셈.해당 사건은 어떤 파벌에 누가 있었는지를 파악하는 것이 누가 누구를 죽였는지 추적할 때 큰 도움이 된다. 물론 당연하게도 대놓고 보여주지는 않기 때문에 각자의 대사와 소지품들을 확인해야 한다. 물론 소지품으로는 없지만 주변 화면과 상황을 따라 유추해야 될 부분들도 있기 때문에 한 가지 방법만으로 추리할 수는 없다.
