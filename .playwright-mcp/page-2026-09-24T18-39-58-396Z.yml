              - blockquote [ref=f1225e1452]:
                - generic [ref=f1225e1453]: 팀은 뉴 웰스의 OPIG 연구실에서 시연을 열어 I.D.O.L이 기억을 추출 및 주입할 수 있음을 보여주려고 했다.이들은 I.D.O.L을 사용하여 팀 스펜더의 기억 =1일치를 추출하고, 이를 유진 마모트에게 주입했다.
              - blockquote [ref=f1225e1455]:
                - generic [ref=f1225e1456]: 여기에는 팀 스펜더와 재스민 파텔의 러브 모텔에서의 기억도 포함되어 있었다.베이 헤이븐 본사에서 이사회는 라이브 방송을 통해 이 기억을 수신했다. 이로 인해 아네트 스펜더는 재스민 파텔을 공격하게 된다.
              - generic [ref=f1225e1458]:
                - text: 1976년 4월 26일, 팀 스펜더는 뉴 웰스에 위치한 OPIG 연구실에서 I.D.O.L을 시험가동하여 기억을 추출하고 주입할 수 있는 기능을 라이브 방송을 통해 베이 헤이븐에 있는 본사 이사회에게 보여주려 한다. 원래 계획은 팀 스펜더의 1분치 기억을 추출하여 유진 마모트에게 주입하는 것이었으나, 유진이 마지막 순간에 팀 스펜더의 약점을 잡을 계획으로 1일치 기억을 추출하는 것으로 바꿔 버린다.그런데 I.D.O.L이 기억을 주입할 때, 대상자인 유진 마모트뿐만 아니라 시연을 찍고 있었던 카메라를 통해 촬영 인턴과 라이브 방송으로 보고 있던 이사회 임원들까지 팀 스펜더의 기억을 모조리 수신해버리게 된다.
                - link "[25]" [ref=f1225e1459] [cursor=pointer]:
                  - /url: "#fn-25"
                - text: 팀 스펜더의 1일치 기억에는 이사회 일원인 재스민 파텔과 러브 모텔에서 불륜을 벌인 것이 포함되어 있었고, 남편의 불륜 기억을 주입 받은 아네트 스펜더는 분노하여 재스민 파텔에게 물을 뿌리며 욕설을 퍼붓는다. 옆의 네이선 호일은 이렇게 다툴 때가 아니라, 이 대박인 기계를 어떻게 활용할지 먼저 생각해 보자고 말하고, 파텔 옆은 비서는 주입된 기억과 다툼에 당황해서 이런 것도 기록해야 하냐고 어쩔 줄 몰라한다.사견 해결 후, 네이선 호일이 I.D.O.L의 대규모 송신 특성을 활용할 수 있는 아이디어를 제안받는다. 순서대로 테사, 마리, 잭으로 보인다. 하지만 건의된 아이디어는 모두 반려되었다.
