                    - cell [ref=f1225e663]:
                      - generic [ref=f1225e664]: The events that took place at the Harmony Foundation on August 17, 1974 resulted in someone's death.1974년 8월 17일에 하모니 재단에서 벌어진 사건은 누군가의 죽음으로 이어졌다.
                  - row [ref=f1225e665]:
                    - cell [ref=f1225e666]:
                      - strong [ref=f1225e668]: 사건
                    - cell [ref=f1225e669]:
                      - generic [ref=f1225e670]: "'Colleague' visited 'Historian' to exchange an artifact for money.'동료'는 유물을 돈과 교환하기 위해 '역사가'를 찾아갔다.During the meeting, 'Colleague' suddenly tried to rob 'Historian'.만나던 중, '동료'는 갑자기 '역사가'에게 강도질을 시도했다.In response, 'Historian' sprayed 'Colleague' with hair spray and then pulled a rug.이에 맞서, '역사가'는 '동료'에게 헤어 스프레이를 분사했다. 그런 다음, 러그를 잡아 당겼다.As a result, 'Colleague' fell and hit a rock.그 결과, '동료'가 넘어졌다. 그 뒤 바위에 부딪혔다."
              - generic [ref=f1225e671]:
                - text: 1974년 8월 17일, '동료'는 유물을 돈과 교환하기 위해
                - link "[5]" [ref=f1225e672] [cursor=pointer]:
                  - /url: "#fn-5"
                - text: 하모니 재단에 방문한다. 접선 도중 '동료'는 갑자기 '역사가'의 금고를 털려고 하며, 이에 맞서 '역사가'는 '동료'의 얼굴에 헤어 스프레이를 분사한 후 '동료'가 밟고 있던 러그를 잡아당겼다. 넘어진 '동료'는 난간을 부수고 2층 창 밖으로 떨어졌고, 정원에 있던 바위에 부딪혀 사망한다. '역사가'는 '동료'의 시체를 정원에 암매장한 후 여권을 불태워 사건을 은폐한다.사건 해결 후 해금되는 자료는 신비 백과사전. 전작의 라자루스 허스트와 황금 우상에 대한 내용이다. 백과사전에 누군가가 직접 단 각주를 확인할 수 있다.
