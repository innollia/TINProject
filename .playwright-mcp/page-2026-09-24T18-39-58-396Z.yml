                        - text: 테사 네바리
                        - link "[12]" [ref=f1225e874] [cursor=pointer]:
                          - /url: "#fn-12"
                        - text: 는 아서 블라이스의 탈옥을 계획했다. 그가 부품의 위치를 알았기 때문이다.테사 네바리 및 아서 블라이스는 힘을 합쳐 8개 부품 모두를 재조립
                        - link "[13]" [ref=f1225e875] [cursor=pointer]:
                          - /url: "#fn-13"
                        - text: 하려고 했다.아서 블라이스
                        - link "[14]" [ref=f1225e876] [cursor=pointer]:
                          - /url: "#fn-14"
                        - text: 는 경매에서 마지막 목표물을 위해 살인을 감행했다.결국, 아서 블라이스는 테사 네바리에게서 부품을 도둑질하려고 했으며, 이로 인해 아서 블라이스가 사망하게 된다.
              - generic [ref=f1225e877]: 라자루스의 이야기를 읽은 테사 네바리는 황금 우상을 분해해서 전 세계로 판매한 아서 블라이스를 탈옥시켜 동료로 삼고 부품들을 모아 황금 우상을 재조립할 계획을 세운다.클리어 후 추가 장면에서 오기 타민은 아서 블라이스가 먹는 약 이름임이 보여지고, 또 아서 플라이스가 로비 프로버그에게 전화하여 일할 필요가 없다고 고지하는 컷도 나온다.
