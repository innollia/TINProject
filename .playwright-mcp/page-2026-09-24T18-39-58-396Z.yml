                    - cell [ref=f1225e470]:
                      - generic [ref=f1225e471]: Monty Totsky used the demolisher on the sewage pipe. This resulted in the death of Joel Gregson.몬티 토츠키는 하수도 파이프에 철거기를 사용했다. 이는 조엘 그렉슨의 사망으로 이어졌다.Following this, the body of Luke Brown was found unexpectedly.곧이어 예기치 않게 루크 브라운의 시체가 발견되었다.
                  - row [ref=f1225e472]:
                    - cell [ref=f1225e473]:
                      - strong [ref=f1225e475]: 이름
                    - cell [ref=f1225e476]:
                      - generic [ref=f1225e477]: Joel Gregson(조엘 그렉슨)・Ted Werter(테드 월터)・Monty Totsky(몬티 토츠키)・Bill Jenkins(빌 젠킨스)Roy Samson(로이 샘슨)・Ian Worth(이안 워스)・Miranda Meadows(미란다 매도우즈)・Luke Brown(루크 브라운)
              - blockquote [ref=f1225e478]:
                - generic [ref=f1225e479]: 현장 감독 조엘은 하수도 파이프를 제거해야 했는데, 절단기가 고장났습니다. 페일 경기를 놓치고 싶지 않았던 조엘은 몬티에게 대신 철거기를 사용하라고 했습니다. 이로 인해 조엘은 파이프에 깔려 사망합니다. 경찰이 도착하여 수사하는 도중, 하수관에서 죽은 지 얼마 안된 다른 시체를 발견했습니다.
              - generic [ref=f1225e481]: 1977년 7월 11일, 풋볼 경기를 보기 위해 정시 퇴근하고 싶었던 현장 감독 조엘 그렉슨은 하수도 파이프에 고장 난 절단기 대신 철거기를 사용하라고 지시한다. 철거기 기사 몬티 토츠키는 하수도 파이프에 철거기를 사용했으며, 철거기의 철구에 맞은 하수도 파이프가 부서져 날아가서 조엘 그렉슨을 깔아뭉개 즉사시킨다. 뉴 웰스 경찰서에서 파견된 로이 샘슨 조사관과 이안 워스 조사관은 부서진 하수도 파이프 속에서 죽은 지 얼마 안 되었으며 이상하게도 안구가 붉은 루크 브라운의 시체를 발견한다. 루크 브라운의 수중에는 헌터 울프라는 인물을 찾아가라는 쪽지가 있었다.사건 해결 후 해금되는 자료는 헌터 울프가 보낸 (끝에 활을 쏘고 있는 늑대가 그려짐) 누군가에게 보낸 협박 편지로, 전 세계에 영감을 준 사람이 마약 중독자였다는 사실이 알려지면 얼마나 안타까운 일이겠냐며 청장과 이야기해 보라고 제안한다.
