            - generic [ref=f1225e1991]:
              - blockquote [ref=f1225e1992]:
                - generic [ref=f1225e1994]:
                  - text: 루트리 만제크가 연설을 녹음하는 동안 최초 파수꾼
                  - link "[57]" [ref=f1225e1995] [cursor=pointer]:
                    - /url: "#fn-57"
                  - text: 이 조각상에 있던 단검으로 그를 살해했다. 그 후, 살인자는 시체를 옮겼다.
                - generic [ref=f1225e1997]: 최초 파수꾼은 탈출하기 위해 테이프를 편집한 후 재생해서 베카 샤바크가 살인자를 바깥으로 안내하게 만들었다.
              - generic [ref=f1225e1999]:
                - text: 시작은 현대의 레무리아의 시점에 루트리 만제크 왕의 연설 시간 동안에 벌어진다. 여러 사람들이 오고 가는 와중에 최초의 파수꾼이 와서 왕과의 대화 도중에 왕이 연설을 녹화하는 도중에 그를 조각상과 함께 들어온 청동 칼을 이용해서 그를 살해하고 어째선지 커튼을 두르고 자리를 떠난다.하지만 왕실 자제들과 신료들은 외부에서 대기하고 있었기 때문에 왕의 살해에 아무도 눈치채지 못했고 오히려 왕녀는 자신의 연설을 허접하게 만들어 연설을 했다고 뒷담을 하면서
                - link "[58]" [ref=f1225e2000] [cursor=pointer]:
                  - /url: "#fn-58"
                - text: 그 상황을 전혀 눈치채지 못했다는 것을 보여준다.왕실 살인사건이 나오는 첫 번째 스테이지지만 본 편을 시작으로 문장과 그림들 하나하나를 관찰하는 세밀함과 주변 사물과 연관시켜 이해하는 상관관계를 요구하기 시작한다. 단순하게 문장과 대화만을 하이라이트를 띄워놓고 그냥 다 모아놓고 추리를 하려는 그런 부분이 아닌 말 그대로 하나씩 천천히 풀어나간다는 관점을 조금씩 요구하기 시작하기에 난이도가 조금 있는 편이다.
            - heading [level=3] [ref=f1225e2006] [cursor=pointer]:
              - text: 
