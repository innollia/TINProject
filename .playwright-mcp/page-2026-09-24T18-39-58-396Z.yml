              - blockquote [ref=f1225e433]:
                - generic [ref=f1225e434]: 데브라와 시릴은 집으로 운전해서 가던 중, 예상치 못하게 다리 위에서 떨어져 죽어 있는 아이작 노왁의 시체를 발견합니다.
              - generic [ref=f1225e436]: 1977년 12월 4일, 집으로 운전해서 가던 시릴 백맨과 데브라 백맨은 다리 위에서 떨어져 사망한 아이작 노왁의 시신을 발견한다.사건 해결 후 해금되는 자료는 희소 인재 펀드에서 보낸 편지로, 펀드에서 백맨 부부의 아들인 브랜든 백맨의 학비를 지원해 주는 대가로 백맨 부부가 모종의 사건에 대하여 함구할 것을 요구한다.
