              - blockquote [ref=f1225e960]:
                - generic [ref=f1225e961]: 마리 웨스트레이크의 팀은 장치 재건 임무를 맡았다. 유진 마모트는 승인없이 테스트를 수행하다가 출입증이 취소되고 만다. 이사회 점검 당일, 네이선 호일 및 팀 스펜더가 출입 할 수 있게 연구실을 열어놓고 있었다. 덕분에 유진 마모트는 그들을 따라 들어갈 기회가 생겼다. 유진 마모트가 양손을 써서 장치의 제어판에 접촉 하자, 그것이 작동했고, 그는 화재를 일으키고 만다.
              - generic [ref=f1225e963]: 1975년 6월 18일 이사회 점검 당일, 네이선 호일 및 팀 스펜더가 출입할 수 있게 연구실을 열어놓고 있었다. 덕분에 유진 마모트는 그들을 따라들어갈 기회가 생겼다. 유진 마모트가 양손을 써서 장치의 제어판에 접촉하자, 그것이 작동했고, 그는 화재를 일으키고 만다.전화기 위 메모를 보면 연구실이 최근 이상하게 춥다는 메모가 적혀 있는데, 이는 유진 마모트가 승인 없이 테스트를 실행해 열을 빼앗았기 때문이다. 이때 장치에 저장된 열이 이사회 점검 당일 내뿜어져 유진 마모트의 의복을 태워버렸다.매우 난이도가 높은 사건. 연구실 인원이 1명 줄었다는 말이나 마모트가 연구실 출입 금지가 되었다는 말 때문에 청소를 맡게 된 유진과 동일인물이라고 연결하기가 어렵다.
