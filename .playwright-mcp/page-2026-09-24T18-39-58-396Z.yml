              - blockquote [ref=f1225e346]:
                - generic [ref=f1225e347]: 고대 레무리아 역사 교수인 오리엘 투생은 자기 구속복 끈을 씹어 뜯더니 갑자기 모르그 브라카 간호사를 목졸라 살해했습니다.
              - generic [ref=f1225e349]:
                - text: 간단한 게임 조작법을 익히기 위한 프롤로그이다. 1977년 6월, 레드우드 정신병원 202호실에 갇혀 있던 고대 레무리아 역사 교수 오리엘 투생은 씹어 뜯은 구속복의 끈으로 간호사 모르그 브라카의 목을 졸라 살해한다.오리엘 투생 교수가 외치는 대사 "PROM, NAPOL, PROM!"의 의미는 전작의 2번째 DLC 레무리아 뱀파이어를 통해 짐작할 수 있는데 PROM은 STOP(멈춰), 라는 뜻이고, NAPOL은 알 수 없지만 APOL이 MIND(마음)이라는 뜻이므로 연관된 단어라 추정해 볼 수 있다.
                - link "[1]" [ref=f1225e350] [cursor=pointer]:
