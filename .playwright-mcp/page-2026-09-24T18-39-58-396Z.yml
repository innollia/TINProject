                    - cell [ref=f1225e770]:
                      - strong [ref=f1225e772]: 사건
                    - cell [ref=f1225e773]:
                      - generic [ref=f1225e774]: Sarah Cunningham, owner of the Neptune cinema, had been using a red crystal to enhance the projector. A weird lady sent Augie Tamine to buy it, but he was banned from the cinema.사라 커닝엄은 넵튠 영화관의 주인으로, 빨간색 크리스탈을 이용하여 영사기를 개선했다. 한 이상한 여자가 그것을 구매하려고 오기 타민을 보냈지만, 그는 영화관 출입금지 목록에 올라 있었다.Augie Tamine arrived in costume and stole the crystal, disguising it as a tooth.오기 타민은 코스튬 복장으로 입장한 뒤 크리스탈을 이빨로 위장하여 훔쳤다.In order to win a bet, Jenny Chen pulled the head off Doug Baxter's costume. This started a fire, so patrons tried to escape.제니 첸은 내기에서 승리할 심산으로 더그 백스터의 코스튬에서 머리를 잡아당겼다. 이로 인해 화재가 발생하고, 손님들은 탈출하는 불상사가 일어나고 만다.Hearing the commotion, Sarah Cunningham looked out, saw the screen, and realized somebody must have taken the crystal. She then caused a car crash while attempting to block the exit.이 소란을 들은 사라 커닝엄은 주변을 살피다가 스크린을 보고, 분명 누군가가 크리스탈을 가져간 사실을 알게 된다. 그녀는 그 후 출구를 봉쇄하는 과정에서 차량 충돌을 일으킨다.
                  - row [ref=f1225e775]:
                    - cell [ref=f1225e776]:
                      - strong [ref=f1225e778]: 이름
                    - cell [ref=f1225e779]:
                      - generic [ref=f1225e780]: Andy Lemmons(앤디 르몬스)・Doug Baxter(더그 백스터)・Beck Mason(벡 매이슨)・Mike Lendl(마이크 렌들)Jenny Chen(제니 첸)・Champ Vincent(챔프 빈센트)・Augie Tamine(오기 타민)・Annie Kishimoto(애니 키시모토)Laura Parker(로라 파커)・Tom Powers(톰 파워스)・Sarah Cunningham(사라 커닝엄)
              - generic [ref=f1225e781]:
                - text: 1974년 5월 1일, 넵튠 영화관의 주인인 사라 커닝엄은 빨간색 크리스탈을 이용하여 스크린을 개선했다.
                - link "[7]" [ref=f1225e782] [cursor=pointer]:
                  - /url: "#fn-7"
                - text: 그런데 이상한 여자가 빨간색 크리스탈을 구매하려고 사라 커닝엄에게 오기 타민을 보낸다. 사라 커닝엄은 이를 거절했고, 오기 타민은 영화관에 출입이 금지된다. 이에 오기 타민은 코스튬 복장을 입어 얼굴을 감추고 입장한 뒤 크리스탈을 코스튬의 이빨로 위장하여 훔쳤다. 한편 제니 첸은 마이크 렌들러와의 내기
                - link "[8]" [ref=f1225e783] [cursor=pointer]:
                  - /url: "#fn-8"
                - text: 에서 승리할 심산으로 더그 백스터의 코스튬에서 머리 부분을 잡아당긴다. 그러나 더그 백스터의 코스튬 머리 부분에서 화재가 발생하고, 손님들이 영화관에서 급히 탈출하는 소동이 일어나게 된다. 이 소동을 본 사라는 주변을 살피다가 스크린을 보고 누군가가 크리스탈을 가져간 사실을 알게 된다. 그녀는 출구를 봉쇄하는 과정에서 톰 파워스의 차와 충돌하고 만다.
                - link "[9]" [ref=f1225e784] [cursor=pointer]:
                  - /url: "#fn-9"
                - text: 이 스테이지는 본작에서 이전작에 등장한 황금 우상의 크리스탈이 처음으로 재등장하는 부분이다. 그러나 전작에서 크리스탈은 완전히 쓸 수 없게 되었다. 나중에 나오는 사건에 크리스탈과 황금 우상이 여럿 있었음을 암시하는 내용이 나오므로, 이 크리스탈은 새로운 크리스탈인 것으로 보인다.
