            - generic [ref=f1225e1826]:
              - blockquote [ref=f1225e1827]:
                - generic [ref=f1225e1828]: 모이라 메레디스는 사임 발표를 계획했고, 힐데가르드 바우어는 문화 유산 프로젝트를 마약 제조로 위장하는 데 이용해 왔다.
                - generic [ref=f1225e1831]: 힐데가르드 바우어는 모이라 메레디스의 기억에 혼돈을 일으켜 그녀를 중단시키려 했다.
                - generic [ref=f1225e1834]: 로이 샘슨은 모이라 메레디스와 그녀의 보안 요원에게 소리가 위험 할 수 있다고 경고했다. 소닉 솔루션스의 그렉과 대화를 나눈 로이 샘슨은 마이크가 스피커가 될 수 있다고 걱정했다.
                - generic [ref=f1225e1837]: 기자회견장으로 돌아와 명단을 확인한 로이 샘슨은 바우어 갱 단원이 소리 기술자로 위장하여 수신기를 마이크에 연결했다는 것을 알아차렸고, 로이 샘슨은 마이크를 쏘았다.
              - blockquote [ref=f1225e1839]:
                - generic [ref=f1225e1840]: 정신병동을 탈출한 후, 세쿤다는 I.D.O.L.을 따라 TV 방송국으로 갔다. 그는 마지막으로 작업한 부품을 회수해서 혼돈 장치를 만들었다.
                - generic [ref=f1225e1843]: 그가 차르에게 억류되어 있는 동안 세쿤다가 혼돈 장치를 더욱 강력한 무기로 만들어서 힐데가르드에게 도움을 주겠다고 제안했다.
              - blockquote [ref=f1225e1845]:
                - generic [ref=f1225e1846]: 힐데가르드 바우어 체포 이후 로이 샘슨은 에코 세쿤다가 버려진 상점으로 탈출했다는 것을 알았다.
                - generic [ref=f1225e1849]: 로이 샘슨은 에코 세쿤다를 따라갔지만, 기습 당했다.
                - generic [ref=f1225e1852]: 전투 도중 로이 샘슨과 에코 세쿤다 모두 귀마개를 잃어버렸다.
                - generic [ref=f1225e1855]: 에코 세쿤다는 로이 샘슨의 총을 가져가 총격을 가할 준비를 했다.
