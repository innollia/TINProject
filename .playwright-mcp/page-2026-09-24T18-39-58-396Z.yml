                      - generic [ref=f1225e426]: Cyril Bagman and Debra Bagman discovered the body of Isaac Nowak, which was there because he fell from the bridge.시릴 백맨과 데브라 백맨은 아이작 노왁의 시체를 발견했다. 시체가 그곳에 있던 이유는 그가 다리에서 떨어졌기 때문이다.
