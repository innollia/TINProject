                    - cell [ref=f1225e533]:
                      - generic [ref=f1225e534]: New Wells Police scheduled a press conference to announce that Isaac Nowak had been a victim of the Red Curse.뉴 웰스 경찰서는 아이작 노왁이 붉은 저주의 피해자가 되었다고 발표하는 기자회견을 열었다.Before the conference, Elizabeth Nowak offered Sebastian Walsh a board position and a computer.기자회견 전 엘리자베스 노왁이 세바스찬 월시에게 이사회 자리 및 컴퓨터 한 대를 제안했다.As a result, during the conference, Sebastian Walsh declared that Isaac Nowak had been a victim of a tragic accident.그 결과, 기자회견 중 세바스찬 월시는 아이작 노왁이 비극적인 사고의 희생자가 되었다고 발표했다.
                  - row [ref=f1225e535]:
                    - cell [ref=f1225e536]:
                      - strong [ref=f1225e538]: 이름
                    - cell "Roy Samson(로이 샘슨)・Ian Worth(이안 워스)・Sebastian Walsh(세바스찬 월시)・Elizabeth Nowak(엘리자베스 노왁)・Jack Nowak(잭 노왁)" [ref=f1225e539]
              - blockquote [ref=f1225e541]:
                - generic [ref=f1225e542]: 기자회의를 공시한 날, 엘리자베스 노왁은 경찰청장 세바스찬 월시를 찾아가서 자기가 이끄는 재단 중 하나의 수익성 좋은 이사회 자리를 제안했습니다. 그 대가로 아버지의 죽음에 관한 사실을 숨겨달라고 했죠. 세바스찬은 그 제안을 받아들였습니다. 서둘러 로이 샘슨을 다른 직책으로 승진시킨 뒤 본인이 기자회견 발표를 맡은 거죠.
              - generic [ref=f1225e544]: 1977년 12월 7일에 로이 샘슨은 아이작 노왁이 붉은 저주의 피해자가 되었다고 발표하는 기자회견을 열려 한다. 기자회견 당일, 엘리자베스 노왁이 세바스찬 월시에게 이사회 자리 및 컴퓨터 한 대를 제안했다. 제안을 받아들인 세바스찬 월시는 로이 샘슨을 승진시켜 다른 구역으로 보낸 후, 자신이 대신 기자회견을 맡아서 아이작 노왁이 비극적인 사고의 희생자가 되었다고 발표했다.사건 해결 후 해금되는 자료는 로이 샘슨의 수첩과 혈액검사 결과. 헌터 울프에 대한 정보는 스틸사이드 창고에 작업장이 있다는 것 외에는 찾지 못했으며, 붉은 저주 희생자들에게서 마약 성분은 검출되지 않았다.
