              - blockquote [ref=f1225e1406]:
                - generic [ref=f1225e1407]: 유진 마모트는 O-렌지 광고 모델을 구해줄 산드라 하퍼를 고용했다.촬영 전, 산드라 하퍼는 모델을 행복하게 하려고 O-렌지에 몰래 유포리아를 넣었다.이 계략은 효과가 있었고, 잭 노왁은 모델에게 I.D.O.L을 조준하여 그들의 행복한 기억을 추출했다.그러나 에이미 우드가 알러지를 일으키며 응급상황이 발생해 주최측에서는 의무원을 불러야만 했다.
              - generic [ref=f1225e1409]:
                - text: 어느 여름날
                - link "[24]" [ref=f1225e1410] [cursor=pointer]:
                  - /url: "#fn-24"
                - text: ", 유진 마모트와 그의 팀원은 O-렌지 광고 촬영을 위해 모델 에이전시 담당자 산드라 하퍼를 고용한다. 해당 촬영의 정체는 OPIG에서 주도하는 I.D.O.L의 기능을 이용하는 대규모 프로젝트를 위한 사전 작업 중 하나였다. I.D.O.L을 통해 극도로 행복한 감정을 포착하고자 유진 마모트는 산드라 하퍼에게 접촉하여 모델들이 마시는 O-렌지에 몰래 엄청난 행복감을 느끼게 해주는 중독성 높은 '유포리아' 마약을 집어넣게 된다. 촬영은 성공적으로 마무리되었지만, '유포리아'에 포함된 암페타민 성분에 알러지를 가지고 있던 모델 한 명이 목숨을 잃을 뻔했다.모델들의 이름을 알아낼 때 카탈로그에서 비교를 해야 하는데, 눈동자 색과 키, 얼굴의 점, 흡연 유무 등이 단서가 되지만 헤어스타일은 아니다. 모델들의 현재 헤어스타일은 카탈로그와 다르다."
