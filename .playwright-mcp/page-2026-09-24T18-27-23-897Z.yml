            - paragraph [ref=f480e288]:
              - text: On July 11, 1977, four construction workers (
              - link "Joel Gregson" [ref=f480e289] [cursor=pointer]:
                - /url: /wiki/Joel_Gregson
              - text: ","
              - link "Ted Werter" [ref=f480e290] [cursor=pointer]:
                - /url: /wiki/Ted_Werter
              - text: ","
              - link "Monty Totsky" [ref=f480e291] [cursor=pointer]:
                - /url: /wiki/Monty_Totsky
              - text: and
              - link "Bill Jenkins" [ref=f480e292] [cursor=pointer]:
                - /url: /wiki/Bill_Jenkins
              - text: ) were permitted to end their shift early if they finished their work in a construction pit. Their job was to remove sewage pipes, but Bill's cutter was broken, so Monty crashed his demolisher into a pipe to remove it instead. The pipe dislodged and landed on Joel, killing him. When authorities arrived on the scene, detective
              - link "Ian Worth" [ref=f480e293] [cursor=pointer]:
                - /url: /wiki/Ian_Worth
              - text: discovered the fresh corpse of
              - link "Luke Brown" [ref=f480e294] [cursor=pointer]:
                - /url: /wiki/Luke_Brown
              - text: in the pipe, whose eyes were red due to his affliction with the Red Curse.
