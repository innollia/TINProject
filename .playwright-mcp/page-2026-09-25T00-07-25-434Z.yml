            - list [ref=f5206e615]:
              - listitem [ref=f5206e616]:
                - text: The final video on The Rise of the Golden Idol's Steam page consists of
                - link "Morse code" [ref=f5206e617] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Morse_code
                - text: that translates to "ESCAPE STERNWALL".
            - figure [ref=f5206e618]:
              - link [ref=f5206e619] [cursor=pointer]:
                - /url: https://static.wikia.nocookie.net/the-case-of-the-golden-idol/images/4/42/Rise_of_the_Golden_Idol_Book_HD.png/revision/latest?cb=20231219031101
                - img "The Book from The Rise of the Golden Idol's reveal trailer, containing location coordinates and a YouTube link." [ref=f5206e620]
                - generic "view image" [ref=f5206e623]
              - paragraph [ref=f5206e627]: The Book from The Rise of the Golden Idol's reveal trailer, containing location coordinates and a YouTube link.
            - list [ref=f5206e628]:
              - listitem [ref=f5206e629]:
                - text: The book present in the reveal trailer for The Rise of the Golden Idol contains multiple Easter eggs.
                - list [ref=f5206e630]:
                  - listitem [ref=f5206e631]:
                    - text: The coordinates on the left page correspond to
                    - link "Lemuria Land" [ref=f5206e632] [cursor=pointer]:
                      - /url: https://www.lemurialand.com/
                    - text: ", a zoo on the Nosy Be island of Madagascar."
                  - listitem [ref=f5206e633]:
                    - text: The code on the right page is part of the URL of an unlisted YouTube video uploaded by Playstack titled "
                    - link "Idol.vhs" [ref=f5206e634] [cursor=pointer]:
                      - /url: https://www.youtube.com/watch?v=CMybwLhKQ0o
                    - text: "\", containing the phrase \"TERRI APOL\" (\"destroy mind\" in Ancient Lemurian). The description says to \"bring the code to the home of the spider\". Appending \"/terriapol\" to the Golden Idol website leads to a"
                    - link "secret subfolder" [ref=f5206e635] [cursor=pointer]:
                      - /url: https://www.thegoldenidol.com/terriapol
                    - text: with portraits of some characters.
                    - list [ref=f5206e636]:
                      - listitem [ref=f5206e637]:
                        - text: The phrase "destroy mind" relates to one of the major mechanics of the
                        - link "Golden Idol" [ref=f5206e638] [cursor=pointer]:
                          - /url: /wiki/Golden_Idol
                        - text: in this game, which is overwriting someone's mind by giving them all the memories of another person.
              - listitem [ref=f5206e639]:
                - text: The cassette tape at the beginning of the reveal trailer is a reversed audio clip, saying "Never trust a
                - link "Cloudsley" [ref=f5206e640] [cursor=pointer]:
                  - /url: /wiki/Edmund_Cloudsley
                - text: ."
