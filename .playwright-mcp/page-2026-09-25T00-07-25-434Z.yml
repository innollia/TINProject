            - blockquote [ref=f5206e238]:
              - table [ref=f5206e239]:
                - rowgroup [ref=f5206e240]:
                  - row [ref=f5206e241]:
                    - cell "\"The Award-winning detective saga returns. Uncover the truth behind 15 strange cases of crime, death and depravity in the 1970s. The world has changed dramatically - the sins of humanity have not.\"" [ref=f5206e242]
            - blockquote [ref=f5206e243]:
              - paragraph [ref=f5206e244]: —Steam description
            - paragraph [ref=f5206e245]:
              - generic [ref=f5206e246]: The Rise of the Golden Idol
              - text: is a point-and-click detective game and a sequel to
              - link "The Case of the Golden Idol" [ref=f5206e248] [cursor=pointer]:
                - /url: /wiki/The_Case_of_the_Golden_Idol
              - text: ", developed by Color Gray Games. It chronicles the efforts of a \"tenacious relic hunter\" to rediscover the"
              - link "Golden Idol" [ref=f5206e249] [cursor=pointer]:
                - /url: /wiki/Golden_Idol
              - text: ", three hundred years after"
              - link "its destruction" [ref=f5206e250] [cursor=pointer]:
                - /url: /wiki/The_Slight_Delay_in_the_Peaceful_March_to_the_King%27s_Castle
              - text: . It was released on PC, Xbox, and PlayStation on November 12, 2024, with the Switch version coming two days later.
            - paragraph [ref=f5206e251]:
              - text: The Steam demo for The Rise of the Golden Idol was released on June 9, 2024. It contains the
              - link "prologue" [ref=f5206e252] [cursor=pointer]:
                - /url: /wiki/Constriction
              - text: and
              - 'link "Chapter 1: The Curse" [ref=f5206e253] [cursor=pointer]':
                - /url: /wiki/Chapter_1:_The_Curse
              - text: . An expanded demo was released on October 10, 2024, with one new case to explore.
            - paragraph [ref=f5206e254]:
              - text: "There are four DLC packs for the game:"
              - link "The Sins of New Wells" [ref=f5206e256] [cursor=pointer]:
                - /url: /wiki/Golden_Idol_Investigations:_The_Sins_of_New_Wells
              - text: (released March 4, 2025),
              - link "The Lemurian Phoenix" [ref=f5206e258] [cursor=pointer]:
                - /url: /wiki/Golden_Idol_Investigations:_The_Lemurian_Phoenix
              - text: (released May 13, 2025),
              - link "The Age of Restraint" [ref=f5206e260] [cursor=pointer]:
                - /url: /wiki/Golden_Idol_Investigations:_The_Age_of_Restraint
              - text: (released July 15, 2025) and
              - link "The Curse of the Last Reaper" [ref=f5206e262] [cursor=pointer]:
                - /url: /wiki/Golden_Idol_Investigations:_The_Curse_of_the_Last_Reaper
              - text: (released September 23, 2025). They contain a total of seventeen new scenarios to solve, in addition to the twenty base game scenarios, for a total of thirty-seven.
