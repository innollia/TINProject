      - article [ref=f1224e106]:
        - generic [ref=f1224e107]:
          - paragraph [ref=f1224e108]: The Rise of the Golden Idol is a detective puzzle game by Color Gray Games and published by Playstack. You investigate strange connected cases by inspecting frozen scenes, collecting key terms, and using deduction panels to explain what happened, why it happened, and who was responsible.
          - paragraph [ref=f1224e109]: This is a spoiler-light guide. It explains observation habits, interface discipline, and deduction routines, but it does not give final identities, completed panels, answer tables, or route-by-route solutions.
          - paragraph [ref=f1224e110]: "Content note: this guide discusses a Teen-rated crime-scene puzzle game with blood, drug references, language, violence, and death in its content descriptors."
          - heading "Essential Tips" [level=2] [ref=f1224e111]
          - heading [level=3] [ref=f1224e112]:
            - text: "1."
            - strong [ref=f1224e113]: Inspect First, Solve Second
          - paragraph [ref=f1224e114]:
            - strong [ref=f1224e115]: Do not rush straight into the blanks.
          - paragraph [ref=f1224e116]: Each case is built around observation before confirmation. Open every obvious hotspot, read documents carefully, check possessions, inspect faces, and notice the scene layout before committing to a theory. If you start by dragging words into blanks, you can lock onto a tempting but weak explanation too early.
          - heading [level=3] [ref=f1224e117]:
            - text: "2."
            - strong [ref=f1224e118]: Treat Names as Clues, Not Labels
          - paragraph [ref=f1224e119]:
            - strong [ref=f1224e120]: Identity is often one of the puzzles.
          - paragraph [ref=f1224e121]: Some characters may be identified by direct documents or possessions, but others require context. A letter might refer to someone indirectly, a role may matter before a name does, and a personal object may only become useful after you understand who would own it. Build identity chains instead of assuming every name is handed to you cleanly.
          - heading [level=3] [ref=f1224e122]:
            - text: "3."
            - strong [ref=f1224e123]: Use the Interface as a Workbench
          - paragraph [ref=f1224e124]:
            - strong [ref=f1224e125]: The sequel’s pop-up panels are there for cross-checking.
          - paragraph [ref=f1224e126]: Keep deduction panels near the clues they refer to when you are comparing a statement against the scene. If the screen becomes cluttered, hide or move panels, then return to observation. The best rhythm is to alternate between looking, testing a small idea, and looking again.
          - heading [level=3] [ref=f1224e127]:
            - text: "4."
            - strong [ref=f1224e128]: Read Cause, Motive, and Sequence Together
          - paragraph [ref=f1224e129]:
            - strong [ref=f1224e130]: The answer is rarely just a name.
          - paragraph [ref=f1224e131]: The game asks you to understand how a scene happened. That means timing, relationships, props, injuries, documents, alibis, motives, and physical clues all matter. When a blank asks for an action, make sure the person had the means, the opportunity, and a reason that fits the rest of the scene.
          - heading [level=3] [ref=f1224e132]:
            - text: "5."
            - strong [ref=f1224e133]: Make a Clean Word Bank in Your Head
          - paragraph [ref=f1224e134]:
            - strong [ref=f1224e135]: Collected terms are clues, not guesses.
          - paragraph [ref=f1224e136]: "When new key terms appear, sort them by type: people, objects, places, actions, organizations, and abstract ideas. This makes the deduction panels less noisy because you can narrow each blank to a smaller category before testing."
          - heading [level=3] [ref=f1224e137]:
            - text: "6."
            - strong [ref=f1224e138]: Save Chapter Recaps for After Case Review
          - paragraph [ref=f1224e139]:
            - strong [ref=f1224e140]: The larger panels depend on earlier deductions.
          - paragraph [ref=f1224e141]: "Chapter-ending puzzles ask you to connect previous scenarios, not just solve one scene in isolation. Before working on a recap, revisit what each case established: who was present, what changed, what object or idea carried forward, and which mystery thread remained unresolved."
          - heading [level=3] [ref=f1224e142]:
            - text: "7."
            - strong [ref=f1224e143]: Keep Separate Notes for Unproven Theories
          - paragraph [ref=f1224e144]:
            - strong [ref=f1224e145]: A good hunch still needs support inside the scene.
          - paragraph [ref=f1224e146]: If you suspect a motive or identity but cannot point to a clue, mark it mentally as a theory. Then look for the missing support. The game rewards close reading, but it also uses misdirection, so a theory is only useful when the scene can explain it.
          - heading [level=3] [ref=f1224e147]:
            - text: "8."
            - strong [ref=f1224e148]: Use Hints in Small Steps
          - paragraph [ref=f1224e149]:
            - strong [ref=f1224e150]: Protect the deduction payoff.
          - paragraph [ref=f1224e151]: If you get stuck, look for a nudge before reading a full walkthrough. A gentle hint can tell you which object, person, or sentence deserves another pass without giving away the completed panel. Full answers should be a last resort because one revealed sentence can spoil several connected deductions.
          - heading "Observation Routine" [level=2] [ref=f1224e152]
          - paragraph [ref=f1224e153]: Start each case with a slow sweep.
          - list [ref=f1224e154]:
            - listitem [ref=f1224e155]:
              - strong [ref=f1224e156]: Scan the whole scene
              - text: "- Notice rooms, exits, bodies, witnesses, props, movement, and any repeating visual motif."
            - listitem [ref=f1224e157]:
              - strong [ref=f1224e158]: Open every hotspot
              - text: "- People, pockets, notes, devices, containers, signs, and background objects can all hold terms or context."
            - listitem [ref=f1224e159]:
              - strong [ref=f1224e160]: Read documents twice
              - text: "- First for names and terms, then again for tone, relationships, dates, permissions, threats, or contradictions."
            - listitem [ref=f1224e161]:
              - strong [ref=f1224e162]: Pair objects with owners
              - text: "- Ask who would carry the object, who could access it, and why it is in this exact place."
            - listitem [ref=f1224e163]:
              - strong [ref=f1224e164]: Track physical clues
              - text: "- Marks, stains, clothing details, injuries, tools, missing items, and spatial positions often carry the logic."
            - listitem [ref=f1224e165]:
              - strong [ref=f1224e166]: Separate fact from inference
              - text: "- “This person had a note” is a fact; “this person acted because of the note” needs more support."
            - listitem [ref=f1224e167]:
              - strong [ref=f1224e168]: Revisit after progress
              - text: "- A detail that meant nothing early may become obvious once a name, job, or relationship is solved."
          - paragraph [ref=f1224e169]: The key is to avoid treating the scene like a hidden-object checklist. You are not only collecting words. You are building a model of what must have happened.
          - heading "Deduction Panel Workflow" [level=2] [ref=f1224e170]
          - paragraph [ref=f1224e171]: The fill-in-the-blank statements are useful because they tell you what kind of logic the game expects. Use them as questions.
          - table [ref=f1224e172]:
            - rowgroup [ref=f1224e173]:
              - row [ref=f1224e174]:
                - columnheader "Panel Element" [ref=f1224e175]
                - columnheader "How to Read It" [ref=f1224e176]
            - rowgroup [ref=f1224e177]:
              - row [ref=f1224e178]:
                - cell "Character blanks" [ref=f1224e179]
                - cell "Identify roles, relationships, and possessions before names" [ref=f1224e180]
              - row [ref=f1224e181]:
                - cell "Object blanks" [ref=f1224e182]
                - cell "Check who had access and whether the object appears in multiple places" [ref=f1224e183]
              - row [ref=f1224e184]:
                - cell "Action blanks" [ref=f1224e185]
                - cell "Confirm that the action matches physical clues in the scene" [ref=f1224e186]
              - row [ref=f1224e187]:
                - cell "Motive blanks" [ref=f1224e188]
                - cell "Look for documents, dialogue, incentives, fear, pressure, or prior conflict" [ref=f1224e189]
              - row [ref=f1224e190]:
                - cell "Sequence blanks" [ref=f1224e191]
                - cell "Compare before/after states, routes, and who could have moved when" [ref=f1224e192]
              - row [ref=f1224e193]:
                - cell "Chapter recap blanks" [ref=f1224e194]
                - cell "Connect solved cases and unresolved threads rather than brute-forcing words" [ref=f1224e195]
          - paragraph [ref=f1224e196]: When a panel feels impossible, stop filling it and turn it into a checklist. What person does this blank need? What clue would prove that? Which hotspot has not been re-read since you learned the newest fact? That approach is slower than guessing, but it prevents you from accidentally memorizing wrong combinations.
          - heading "Chapter Structure Habits" [level=2] [ref=f1224e197]
          - paragraph [ref=f1224e198]: The Rise of the Golden Idol is built around cases inside chapters, with broader recap puzzles tying those cases together. That structure changes how you should play.
          - paragraph [ref=f1224e199]: For individual scenarios, focus on the immediate scene. Solve identities, actions, and local cause-and-effect. Do not overreach into grand theories until the panel itself asks for them.
          - paragraph [ref=f1224e200]: For chapter recaps, zoom out. Ask what each scenario added to the shared mystery. A person, artifact, organization, method, rumor, or piece of technology may matter more than the dramatic moment of the individual scene.
          - paragraph [ref=f1224e201]: For the final stretch, preserve your earlier reasoning. If you solved previous panels only by trial and error, later connections will be harder to reconstruct. Short notes such as “who gained,” “who lost,” “what changed hands,” and “what remains unexplained” are more useful than copying completed answers.
          - heading "Common Mistakes to Avoid" [level=2] [ref=f1224e202]
          - list [ref=f1224e203]:
            - listitem [ref=f1224e204]:
              - paragraph [ref=f1224e205]:
                - strong [ref=f1224e206]: Do not fill blanks before reading every document
                - text: "- Missing one note can make the whole statement look ambiguous."
            - listitem [ref=f1224e207]:
              - paragraph [ref=f1224e208]:
                - strong [ref=f1224e209]: Do not assume the loudest character is responsible
                - text: "- The game often hides important logic in quiet possessions, background details, and indirect references."
            - listitem [ref=f1224e210]:
              - paragraph [ref=f1224e211]:
                - strong [ref=f1224e212]: Do not treat collected words as equally likely
                - text: "- Sort them by category before testing them in a blank."
            - listitem [ref=f1224e213]:
              - paragraph [ref=f1224e214]:
                - strong [ref=f1224e215]: Do not ignore physical placement
                - text: "- Where a person, object, or trace appears can matter as much as what it is."
            - listitem [ref=f1224e216]:
              - paragraph [ref=f1224e217]:
                - strong [ref=f1224e218]: Do not solve identities in isolation
                - text: "- Names, jobs, relationships, and motives usually reinforce each other."
            - listitem [ref=f1224e219]:
              - paragraph [ref=f1224e220]:
                - strong [ref=f1224e221]: Do not brute-force chapter panels
                - text: "- Recap puzzles are easier when you review previous cases and identify the connecting thread."
            - listitem [ref=f1224e222]:
              - paragraph [ref=f1224e223]:
                - strong [ref=f1224e224]: Do not read a full answer page for one small block
                - text: "- Use the lightest hint that gets you moving so later deductions stay intact."
            - listitem [ref=f1224e225]:
              - paragraph [ref=f1224e226]:
                - strong [ref=f1224e227]: Do not merge this game with the previous Golden Idol game
                - text: "- This is The Rise of the Golden Idol, with its own interface, setting, cases, and chapter structure."
