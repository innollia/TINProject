            - paragraph [ref=f666e350]: Immediately afterwards, Echo Secunda grabbed a vaporon , which alerted Rowan Doyle .
            - paragraph [ref=f666e351]: When the vaporon failed to work , Echo Secunda threw a spear at Rowan Doyle , and then fled .
