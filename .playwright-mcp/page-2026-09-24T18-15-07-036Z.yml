            - heading "“Once it clicks, you have sweet epiphany.”" [level=2] [ref=f335e121]
            - paragraph [ref=f335e122]: In the dingy dark hallway of an asylum or prison, two men are struggling in a battle of life or death. One man is writhing on the ground while the other has something wrapped around his throat. The art is captivating and gothic, verging on grotesque, and they’re animated in an unsettling way. The movement suggests a moment caught in time. We, as investigators, are tasked with uncovering the sequence of events behind this story.
            - figure [ref=f335e123]:
              - img "image of two men with glasses on a smartphone, in front of an image with cartoon caracters." [ref=f335e124]
            - paragraph [ref=f335e125]:
              - emphasis [ref=f335e126]: The Rise of the Golden Idol
              - text: is a mystery-solving, narrative-driven game, and the gameplay truly makes the players feel like detectives investigating the scene of a crime. You hear from suspects, examine the evidence and search crime scenes for clues. The story itself is twisty and fantastical, and feels almost impossible to solve at first until you start pulling at threads. There is a deep satisfaction to solving the puzzles and creating order from the chaos.
            - paragraph [ref=f335e127]:
              - text: Brothers Andrejs Klavins and Ernests Klavins of Color Gray Games join us all the way from Latvia to talk about creating this popular series of games. I really enjoyed hearing about the changes they made from
              - emphasis [ref=f335e128]: The Case of the Golden Idol
              - text: when developing the sequel, and how to fine-tune difficulty in these types of mystery games. I was also especially impressed to hear that these games are written in English, which is not their native language. If you love escape rooms, puzzle games, or solving investigative mysteries, I highly recommend you check out
              - emphasis [ref=f335e129]: The Case of the Golden Idol
              - text: and
              - emphasis [ref=f335e130]: The Rise of the Golden Idol
              - text: .
