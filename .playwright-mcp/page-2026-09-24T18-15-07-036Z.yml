            - heading "About Andrejs Klavins" [level=2] [ref=f335e225]
            - figure [ref=f335e226]:
              - img "man with blond hair and short blond beard with glasses in front of a river" [ref=f335e227]
            - paragraph [ref=f335e228]:
              - text: "X:"
              - link "@colorgray7" [ref=f335e229] [cursor=pointer]:
                - /url: https://x.com/ColorGray7
              - text: ", Bluesky:"
              - link "@andrejsklavins.bsky.social" [ref=f335e230] [cursor=pointer]:
                - /url: https://bsky.app/profile/andrejsklavins.bsky.social
            - paragraph [ref=f335e231]:
              - text: Andrejs is a game designer. In 2010, Andrejs co-founded and led video game studio Next Level which published over 10 social network and mobile games in Latvia. After 4 years in education at the technology start-up Edurio, Andrejs left the start-up scene and decided to team up with his brother Ernest to return to the game industry and try creating a successful indie game. Their first published game was
              - emphasis [ref=f335e232]: The Case of the Golden Idol
              - text: and last year they released its sequel
              - emphasis [ref=f335e233]: The Rise of the Golden Idol.
            - heading "About Ernests Klavins" [level=2] [ref=f335e234]
            - figure [ref=f335e235]:
              - img "man with buzzed hair, glasses and full dark blond beard in red button down shirt sitting at a desk with a minecraft style figurine" [ref=f335e236]
            - paragraph [ref=f335e237]: Ernests is a painter with numerous art exhibitions under his belt and many years’ experience working as a cartoonist in the leading news magazines in Latvia. However, his true passion is making games and exploring artistic ideas with this interactive medium. Ernests has participated in over 20 artistic and commercial game projects.
