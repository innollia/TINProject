              - link "Elizabeth Nowak" [ref=f1079e290] [cursor=pointer]:
                - /url: /wiki/Elizabeth_Nowak
              - text: "'s Rare Talent Fund to support the tuition of Brandon Bagman, under the condition that they do not disclose Isaac's condition, which Elizabeth believed to be the side effects of drug use."
