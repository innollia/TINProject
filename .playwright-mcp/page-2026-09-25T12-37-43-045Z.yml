                    - link "[95]" [ref=e1481] [cursor=pointer]:
                      - /url: "#fn-95"
                    - text: 이후 곧바로 북을 목표로 향하며 설원으로 향한다. 약육강식주의 답게 주인공이 설원에서 힘이 다해 쓰러져도 구해주진 않을 테니 알아서 잘 오라고 말하며 실제로 도와주지도 않는다.설원을 통과해 무풍의 골짜기의 보스인 동종의 바람을 물리치고 진행하면 다음 맵에서 바로 등장하며 외신을 쓰러뜨린 주인공을 보곤 대단하다고 솔직하게 칭찬해 준다. 이후 피부가 차가우니 따뜻하게 해주겠다며 선택지가 뜨는데 받아들이면 CG와 함께 꼭 껴안는다. 의외로 상냥하게 끌어안고 자신은 강함이 좋고 강자가 좋다며 주인공의 힘을 좀 더 보고 싶다고 말한다. 그래서 천길 낭떠러지에 떨어뜨리는 심정으로 엄격하게 대했다며 미안하다고 사과한다. 직후 자기 사제들이 이미 성에 침략을 시작했고 자신들도 늦을순 없다며 먼저 진행한다. 이후 성문에서 유니스와 만나고 한번 패배했던 유니스가 다시 앞에 선 것에 바보 같은 녀석이라며 말을 하자 유니스는 이 나라를 지키기 위해 마지막까지 싸운다고 대답한다. 이에 허튼 소리 하지 말라며 결국 관을 차지하고 싶은 게 아니냐고 라이덴이 비꼬고 유니스는 여왕은 자신의 의견을 이해해 주지 않았다면서 그렇다면 자신이 관을 손에 넣어 새로운 질서를 만들면 된다고 말하고 라이덴만 죽으면 자신은 왕국에서 영웅시 될 테니 나라를 위해 죽어달라고 부탁하자 잡초 따위가 허세부린다면서 너 같은 약자가 자길 죽일 수 있냐며 라이덴이 받아치고 유니스가 유니콘들에게 맡기며 안으로 들어가자 앞을 가로막는 유니콘들을 쳐죽이고 쫓아간다.결투장에서 유니스와 대면하면 라이덴의 목적을 아냐며 라이덴의 목적을 말하는데 라이덴의 목적은 바로
                    - strong [ref=e1482]: 나라의 멸망.
                    - text: 그러니 너무 늦기 전에 라이덴을 죽이라고 하지만 주인공이 침묵하자 당신도 성욕에 삼켜졌냐면서 저런 복장의 라이덴에게 유혹된 거냐며 매도한 후 전투에 들어간다. 전투 후 주인공을 매도하는 유니스의 앞에 나타나 너의 패배라며 선고를 내린다. 이에 유니스가 부하에게 결투를 떠넘기다니 비겁자라며 매도하자 이미 자신에게 패배하고 사제인 주인공에게도 패배한 유니스에게 이게 뭘 의미하는지 알겠냐며 묻자 유니스는 지금까지의 태도를 버리고 비굴하게 빌기 시작하나 라이덴은 이를 거절, 유니스의 이상 따윈 관심도 없고 힘도 부족한 주제에 자신의 주장에 깃발을 내걸며 외친 게 거슬린다고 말한 후, 유니스의 주장에 자신의 대답을 말하는데 자신들은 모두 동물이며, 움직이는 혈육에 지나지 않는다는 대답과 성별 따윈 사소한 문제일 뿐이라고 답한다. 유니스가 마지막까지 비굴하게 굴자 더 이상 유니스의 비참한 모습은 보고 싶지 않다며 스스로의 손으로 완전히 유니스를 끝장낸다. 직후 주인공에게 유니스의 과거 지위를 말한 후, 선택지가 뜨는데 칭찬해 주길 원한다는 선택하면 앞서 나왔던 CG와 함께 껴안아서 칭찬하는 장면이 나온다.유니스에게 들은 이 나라를 멸망시킨다는 선택지를 고르면 숨기고 있어서 미안하다며 맞다고 대답한다. 무엇에도 속박되지 않고 힘이야말로 법인 자유로운 세계를 만드는 게 목적이며 동물들은 본래 자유로운 존재들이라는 게 그녀의 주장. 하얀 여왕은 단 한 명의 수컷을 사랑해서 이 나라를 버렸고 그 결과 유니스 같은 옥좌를 노리는 녀석들뿐만 남아버렸다고 한다. 자신은 왕관을 쓸 생각은 없고 옥좌에 앉은 지배자는 영락할 뿐이라며 그렇기에 왕관을 파괴하고 강자만의 세계를 만들어 가족과 함께 살고 싶을 뿐이라고 한다. 여기서 선택지가 3가지가 뜨는데,
                  - list [ref=e1483]:
                    - listitem [ref=e1484]:
                      - generic [ref=e1485]:
                        - strong [ref=e1486]: 침묵
                        - text: 을 선택주인공의 침묵에 동의하며 자신도 결국 자기 마음대로 할 뿐인 걸 밝힌다. 그렇지만 이미 자신은 지쳤다고 말하며 과거를 이야기한다. 이전에는 여왕만이 전부 였고 그렇기에 어떤 더러운 일도 마다하지 않았다. 그러나 여왕은 왕국을 떠나버리면서 져버렸고 라이덴은 이를 배신당했다고 여기며 마음에 커다란 구멍이 뚫렸고 얼마나 오랜 시간이 지나도 구멍은 메꾸어지지 않았다. 왕국이 있다는 건 왕이 모든 책임을 짊어지는 것. 그러나 그 어느 것도 결국 오만을 부각시킬 뿐이고 지킬 만한 가치도 없었다며 말한 후, 그럴 바엔 왕국 따윈 없는 게 낫다고 대답한다.
                    - listitem [ref=e1487]:
                      - generic [ref=e1488]:
                        - strong [ref=e1489]: 무리다
                        - text: 를 선택자신은 생각을 바꿀 생각이 없다며 만약 자신을 반대할 거면 주인공과 싸울 수밖에 없다고 대답한다. 이후 힘을 가지고 힘으로 지배하는 일이 얼마나 올바른지 이해해달라고 부탁한다.
                    - listitem [ref=e1490]:
                      - generic [ref=e1491]:
                        - strong [ref=e1492]: 함께 살고 싶다
                        - text: 를 선택라이덴 자신도 주인공과 함께 살고 싶다고 동의를 표한다. 강자인 주인공이 좋다며 적대하고 싶지 않다고 대답한 후, 자신에게 싸움이란 어디까지나 살아가는 수단이란 것을 이해해 달라고 부탁한다.
                  - generic [ref=e1493]:
                    - text: 대화가 모두 끝나면 남은 건 관의 탈취뿐이며 사제들이 먼저 가있을 테니 얼른 가자고 하며 이동한다. 이를 따라 나아가면 하늘에서 피의 비가 내리고 이에 뭐냐며 사제들은 어디간 거냐고 의문을 표하는 라이덴의 앞에 기둥 위에서 웃고 있는 메이벨이 나타난다. 사제들을 어떻게 했냐는 질문에 메이벨은 부하들은
                    - strong [ref=e1494]: 전부 하늘에 있다며
                    - text: 머리에 피가 올라 있어서 좀 더 내리는 게 아닐까라며 대답한다. 그러면서 말하길 원래는 도살할 생각이 없었지만 길을 비켜주지 않길래 조건반사로 죽여버렸다며 미안하다고 하자 라이덴이 제대로 화가 났는지 메이벨에게 매우 적대적인 반응을 보이고 메이벨이 다가온다. 그러면서 자신과 라이덴은 그저 배우에 지나지 않지만 여기서 라이덴의 연극은 끝났고 사자와 일각수는 관을 손에 넣지 못하고 죽는 운명이라고 말한다. 이에 라이덴이 뒷걸음질 치고 이때 선택지로 지켜보기만 하면 사자를 얕보지 말란 말과 함께 달려들어 공격하나 메이벨에겐 치명상 하나 주지 못하고 왜 죽지 않냐며 정체를 묻자 메이벨이 '이러니까 구 지배자는' 이라며 자신의 정체조차 간파하지 못한다며 반격으로 라이덴을 살해한다. 한 벌밖에 없는 옷이 부서졌다며 불평하지만 언제든지 고칠 수 있다며 상관없단 반응을 보이곤 라이덴은 어느 의미론 맞는 말을 했다며 강자였기 때문에 여기까지 좋을 대로 살아남은 게 가능했다고 말하지만 힘이란 건 제어가 되지 않는 부정의한 것이라며 일축한다.라이덴을 지키는 선택지를 선택하면 주인공이 라이덴을 감싸며 나서고 이에 메이벨은 순순히 물러난다. 그러나 자신을 감쌋단 것에서 라이덴이 왜 감쌋냐며 주인공에게 화를 낸다. 자신은 절대강자이며 보호받는 자는 약자. 이 세상은 약육강식이며 싸우지 않는 자는 살 가치가 없고 힘 없는 자는 죽음 뿐, 그렇지 않냐며 주인공에게 화를 내나 주인공은 틀리다며 이 세상은 적자생존이라고 대답한다. 이에 라이덴은 이해하고 싶진 않지만 이해했다며 주인공과 자신은 사고가 다르다면서 서로 이해할 수 없다고 대답한다. 그렇지만 주인공과 싸울 마음이 생기지 않는다며 관은 좋을 대로 하라며 이번 생의 이별이란 말과 함께 사라진다.생존시킨 이후 사자의 성채로 가면 라이덴 혼자 남아있는 걸 볼 수 있는데 자신은 패배했다며 아탐단은 해산했고 관도 포기했으며 이제 나라를 멸망시킬 생각도 없다고 말한다. 그러곤 이빨 꺾인 사자만큼 심한 건 없다며 그때 그냥 죽는 편이 나았다고 주인공에게 불평한다. 아니면 지금이야말로 창을 거둘 시기일지도 모른다며 짝을 찾고 아이를 낳아 어머니라도 될까 라며 주인공이라면 자신의 짝으로 어울릴 것이라며 말하지만 직후 농담이라며 자신이 그런 숫처녀 같은 행복을 가질 리가 없다며 쓸쓸한 말은 한다. 이후부터 말을 걸면 선택지에 껴안는 선택지가 뜨는데 이때 반응과 대사가 달라지며 봉사하기가 선택이 가능해진다. 이때도 살해나 범하는 게 가능한데 스스로가 패배했단 걸 인지해서 그런지 별다른 저항 없이 받아들인다.여담으로 살해나 범하는 선택지를 어느 시기에 선택하느냐에 따라 반응이 달라지는 캐릭터인데 처음 만났을 때는 힘을 시험해 보는 느낌으로 싸우며 HP를 반 정도 깎으면 이벤트 대사와 함께 선택지로 전투를 그만두거나 더 싸워서 죽이거나 범하는 게 가능하다. 반대로 모든 이벤트가 끝나고 난 이후 사자의 성채에서 다시 만나 살해하는 선택지를 선택하면 주인공이 죽여주는 거냐면서 각오는 돼 있으니 죽이라고 하며 주인공이 찌르자 자신의 소울을 받으라며 주인공은 더 강해질 것이라는 말과 함께 사망한다. 범하는 쪽은 블랙 소울 2에선 매우 희귀한 역으로 범하는 시츄로 진행하며 주인공조차 생명의 위협(...)을 느끼는 장면이 나온다. 감금되어도 약육강식적인 사고라 주인공의 하렘이 들어가게 된 걸 크게 신경 쓰지 않으며 감금되어서 살해당할 때도 그저 이제 자신은 불필요하게 된 건가라며 받아들인다.여러모로 유니스와 반대되는 캐릭터인데 정중하면서도 속이 검으며 마지막에 본색을 드러내는 유니스와는 정반대로 라이덴은 속이나 겉이나 똑같은 면모를 보인다. 주인공에 대한 반응도 정반대인데 처음엔 받아들이면서 나중에 본색을 드러내고 통수를 치며 수컷의 말 따윈 들리지 않는다며 무시하는 유니스와는 반대로 라이덴 루트에선 주인공이 강자이긴 하지만 열심히 노력하는 주인공에게 칭찬도 해주며 마지막까지 주인공을 적대하지 않으며 이해할 수 없으면서도 싸우고 싶진 안다며 사라지는 등, 끝까지 주인공을 위해준다.여러 가지 경로로 라이덴의 소울을 입수하면 소울 연성으로 라이덴의 쌍도끼를 만들 수 있는데 스턴률 +30%, HP +30%를 부여에 현재 HP 의존 무기라는 새로운 특성을 가지고 나온다. 무기 스킬로 최대 HP 의존의 뇌속성 단일 필중에 방어력을 감소시키는 굉천폭뢰 스킬을 가지고 있으며 풀강화시 스턴률과 HP 증가율이 40%로 상승하고 쌍도끼 사자선풍이란 스킬이 추가된다. 굉천폭뢰처럼 최대 HP 의존 이며 적 전체에게 HP 흡수 물리 공격을 3회, 50% 확률로 재발동이란 부과효과를 가지고 있다. 아쉽게도 고난이도에선 쓰기 힘든 무기인데 일단 적들의 체력이 미친 듯이 폭증하는 고 난이도에서 HP 의존 특성은 별로 좋은 효과가 되지 못하고
