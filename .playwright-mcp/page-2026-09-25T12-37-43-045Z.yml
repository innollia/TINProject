            - generic [ref=e2532]:
              - generic [ref=e2534]:
                - generic [ref=e2535]:
                  - text: 이 문서에
                  - link "스포일러" [ref=e2536] [cursor=pointer]:
                    - /url: /w/%EC%8A%A4%ED%8F%AC%EC%9D%BC%EB%9F%AC
                  - text: 가 포함되어 있습니다.
                - text: 이 문서가 설명하는 작품이나 인물 등에 대한 줄거리, 결말, 반전 요소 등을 직·간접적으로 포함하고 있습니다.
              - generic [ref=e2537]:
                - text: ※
                - link "일본 위키" [ref=e2538] [cursor=pointer]:
                  - /url: https://www65.atwiki.jp/iniminimanimo/pages/38.html#id_565032e6
                - text: 를 참조했음을 밝힘플레이어가 보스를 잡거나 특정한 행동을 할 경우 진행도가 상승하며, 이에 따라 도서실의 흰곰이 새로운 물건을 팔고 NPC들에게 영향을 주는 등 다양한 이벤트가 발생한다. 다만 진행도가 너무 높아져 후반에 다다랐을 때까지 접접이 살아 있다면 거의 모든 히로인과 몇몇 NPC가 사망하고 만다. 때문에 1회차에서 꼼꼼하게 진행하며 모든 보스를 잡아 온 유저들은 접접을 만나지도 못한 상황에서 갑자기 서약이 없어지고 멘붕할 가능성이 높으며, 특히 모자 장수 3인방의 경우 접접 바로 앞 맵에 있어 이미 죽은 상태로 만나게 될 것이다(...).
              - list [ref=e2539]:
                - listitem [ref=e2540]:
                  - generic [ref=e2541]: 진행도가 상승하는 경우
                  - list [ref=e2542]:
                    - listitem [ref=e2543]:
                      - generic [ref=e2544]:
                        - text: 안개로 막힌 대부분의 보스를 쓰러트린다.
                        - link "[164]" [ref=e2545] [cursor=pointer]:
                          - /url: "#fn-164"
                    - listitem [ref=e2546]:
                      - generic [ref=e2547]: 하트의 정원 문지기를 돌파(방법은 상관없다)
                    - listitem [ref=e2548]:
                      - generic [ref=e2549]: 라드위지 상층에 도달한다.
                    - listitem [ref=e2550]:
