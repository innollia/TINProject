                        - text: 이때 옆에 앉거나 거절할 수 있으며 앉는다를 선택할 경우 H씬이 하나 나온다. 어느쪽이건 선택하면 눈보라가 그쳤다면서 성으로 진행한다. 이쪽 루트에선 아버지가 사냥을 하던 중에 죽어 혼자 남았지만 카이 덕분에 지금까지 살아왔다고 하며 『세상에 악의가 가득하다면 그만큼의 선의로 채우면 되지 않을까?』 라고 답한다.
                    - listitem [ref=e1543]:
                      - generic [ref=e1544]: 유니스의 편을 선택할 경우 광기산맥 출구에서 시요에게 현혹된 상태가 되어 있다. 이때 말을 걸고 빰을 때리는 선택지를 선택하지 않을 경우 나중에 시요쪽으로 갔다가 살해당한다. 반대로 말을 걸고 빰을 때리면 현혹에서 풀려 성으로 진행한다. 여기선 카이가 어째서 사라졌는가에 대해 상당히 오락가락한 반응을 보이며 바깥은 위험하니 카이를 데리고 집으로 데려가야 한다, 라고 하는데 이는 설원에서 엽총과 아버지에 대한 이야기와 더불어 나중의 복선이 된다.
                  - generic [ref=e1545]:
                    - text: 이렇게 성으로 진행하면 드디어 친구인 카이를 만나게 된다. 카이는 게르다와 함께 바깥의 다양한 풍경을 보고 싶다며 설득하나 게르다는 바깥은 위험하고 카이와 단둘이 집에만 있으면 된다고 말다툼을 벌이게 된다. 게르다가 원래 있던 세계는 그저 새하얄뿐인 세계였고 카이는 그곳에 돌아가기 싫다며 대화하면 서로 알 거라며 끝까지 설득하지만 게르다는 이를 거부하고 결국 카이를 엽총으로 쏴버리고 만다. 이에 총을 사람에게 향하면 안 된다는 아버지의 말을 떠올리며 충격받고 발광하다가 나만의 카이를 만들면 되는 거라며, 만들어서 사랑하고 이야기하고 놀고 죽이고 범하고 카이와 놀고 싶다며 마수화 되어 버린다.마수화를 피하고 싶다면 라이덴이나 유니스 어느 쪽 분기건 위의 분기점 상황 때 말을 걸지 말고
                    - link "[101]" [ref=e1546] [cursor=pointer]:
                      - /url: "#fn-101"
                    - text: 먼저 성으로 가서 카이와 만나면 카이는 단순한 눈사람이었단 걸 알게 된다. 자기는 단순한 위작이라며 진짜 카이는 이미 죽었다고 주인공에게 말한다. 진짜 카이가 죽어 마음이 부서진 게르다는 자신만의 세계에 틀어박혀 현실에서 눈을 돌리다가 눈사람인 가짜 카이를 만들게 되었다고 한다. 하지만 가짜라도 게르다가 소중한 건 똑같아서 가짜인 자신에게 호의를 보내는 게르다가 너무 가엽고 이대로 게르다가 자신을 만나면 자신은 그저 그녀의 이상적인 카이가 될 뿐이라며 자신을 죽여달라고 부탁한다. 죽는 건 무섭지만 게르다의 행복을 위해서하면 죽음도 각오했다며 부탁하고 이를 들어주어 죽이면 감사하단 말과 함께 사망한다.이후 다시 설원이나 광기 산맥으로 돌아가 게르다 이벤트를 진행시켜 성으로 향하게 하면 카이가 없다며 당황해 하는 모습을 볼 수 있다. 이때 선택지로 살해한다는 선택지만 4개가 뜨고 이를 선택하면 아버지를 부르며 사망한다.
                    - link "[102]" [ref=e1547] [cursor=pointer]:
                      - /url: "#fn-102"
                    - text: 하지만 끝까지 내려 같이 찾자는 선택지를 할 경우 더 이상 지쳐서 움직일 수 없다며 주저앉지만 게르다를 격려하는 목소리가 들려오고 이에 힘을 얻은 게르다는 카이를 찾아내겠다며 다시 일어서고, 폐를 끼쳐서 죄송하다는 말과 함께 사라진다. 이후 동화 『눈의 소녀』를 얻게 되고 최종전에서 몽령으로 소환이 가능해진다. 서포터 스타일 몽령이며 게르다의 응원 1, 2와 아이스 브레이크, 레이즈 2를 사용한다. 아군을 회복시키거나 능력치 상승을 주로 하니 플로렌스와는 다른 의미로 아군이 편해진다. 물론 DLC 3 동료인 만큼 딜링 능력도 괜찮은 편이지만 나머지 몽령 둘의 딜링 능력이 차원이 다르다 보니 떨어져 보이는 편.특이하게도 다른 동화 시리즈 인물들과는 달리 동화가 미완성인데 만나자마자 죽이면 얻는 동화책엔 제목을 포함해 아무 것도 안 적혀 있고, 마수화 루트로 가면 이름이 『눈의 여왕』이 되며 반대로 구원 루트로 가면 『눈의 소녀』가 된다. 한마디로 처음부터 왜곡된 다른 동화 히로인들이나 몽령, 광령들과는 달리 개변도 제대로 되지 않은 미완성 상태여서 윈터벨에 있었던 것. 또한 게르다의 주변엔 이상하리만치 죽이라는 도움말이 자주 나오는데 구원 루트에선 아예 죽인다 라는 선택지만 4번이나 등장한다. 주인공 안의 안데르센이 이런 상태가 된 게르다를 매우 싫어해서 이렇게 된 건지는 알 수 없지만 이상할 정도로 취급이 박한 셈.
