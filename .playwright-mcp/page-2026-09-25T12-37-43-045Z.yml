            - generic [ref=e3314]:
              - text: 전작인
              - link "BLACK SOULS" [ref=e3315] [cursor=pointer]:
                - /url: /w/BLACK%20SOULS
              - text: 로부터 몇 년 후의 세계를 그려낸 속편인 만큼, 여러 부분에 걸쳐서 많은 연관성을 보인다.일단 전편과 본편의 주인공이 동일인물이며, 빨간 두건이나 도로시, 엘리자베스 등의 대화나 기록을 보면 세계관도 전편인
              - link "BLACK SOULS" [ref=e3316] [cursor=pointer]:
                - /url: /w/BLACK%20SOULS
              - text: 와 동일한 것으로 추정된다.
              - link "[218]" [ref=e3317] [cursor=pointer]:
                - /url: "#fn-218"
              - text: 하지만 전작에서 시간이 어느 정도 흐른 후인지, 도로시는 사망해 있는 상태이며 잔 다르크나 에르마 등은 유품이나 동화로만 발견된다.
              - link "[219]" [ref=e3318] [cursor=pointer]:
                - /url: "#fn-219"
              - text: 하지만 메아리스가 개변한 빨간 두건의 20년으로 제한된 수명을 생각해 보면 전작인 블랙 소울 1으로부터 고작 몇 년밖에 흐르지 않았을 가능성도 있다. 전작에서 빨간 두건의 추정 나이는 10대 중반이었는데, 본편에서의 빨간 두건의 나이는 19세로 나오기 때문. 이는 기어오는 자가 메아리스로부터 개변 능력을 빼앗은 것이 영향을 미쳤을 가능성도 있다.전투에 관해서는 전작에서 적으로 등장해 주인공의 앞을 막아섰던 동화 보스들이 본편에서는 조력자 포지션의 몽령으로 등장하며 본편의 보스들과 전투 시 도움을 준다.또한 본편에 그대로 등장하는 전작의 인물이 많이 있다. 메아리스, 빨간 두건, 기어오는 자, 도로시, 엘리자베스 및 대부분의 몽령들이 여기의 사례에 속한다.다시 말해, 전작인
              - link "BLACK SOULS" [ref=e3319] [cursor=pointer]:
                - /url: /w/BLACK%20SOULS
              - text: 와 동일한 세계관이지만, 전작의 세계를 메아리스가 마음대로 개변했듯이, 본작에서는 기어오는 자가 전작의 세계관을 마음대로 개변했다고 볼 수 있다.DLC 1에서 추가된 지역인 여객선 아틀란티카에 있는 숨겨진 문에 sen치가 100 이상이면 히로인들에 관한 이벤트가 하나 있다. 야마네 감금 이벤트 이상으로
              - link "동방이형향" [ref=e3320] [cursor=pointer]:
                - /url: /w/%EB%8F%99%EB%B0%A9%EC%9D%B4%ED%98%95%ED%96%A5
              - text: 이 떠오르게 하는 호러 이벤트이니 주의.
              - link "[220]" [ref=e3321] [cursor=pointer]:
                - /url: "#fn-220"
              - text: 진엔딩 루트를 탈 경우, 즉 화톳불마다 빨간 망토를 만나며 진행했을 경우 이벤트가 끝나고 빨간 망토가 패닉에 빠진 그림을 부축해 주는데, 이때 빨간 망토가 그림이 전작의 히로인들을 죽이지 않았으며 이벤트에서 그림을 원망하던 히로인들은 환상일 뿐이라고 말해준다. 뒤이어 현실로 돌아가면 원본이 되는 동화책을 모아서 히로인들을 살려내자고 말하는데, 이를 보면 현실도 로스트 엠파이어나 꿈의 세계 못지않게 초자연적인 것이 판치는 세계인 듯. 당장 노데가 빨간 망토를 현실에서 온 사자라 부르는 것을 보면 적어도 러브크래프트 이야기의 세계만큼 맛이 가있을 듯하다. 앨리스의 기억에서 볼 수 있듯이 현실에 있던 루이스 캐럴에게 메어리스가 관심을 가진 게 모든 일의 발단이 되었으니 현실에도 외신들이 있는 헬게이트급 세계관이다. 이벤트 직후, 빨간 망토의 대화에서 알 수 있듯이 전작의 포세이돈 호텔에 1번도 오지 않은 걸로 되어 있다. 정황상 주인공이 히로인들을 살해한 적은 있지만 도로 없던 걸로 만들어 버린 듯. 도로시의 행적도 모순처럼 꼬여있어서 히로인들의 결말도 진실인지는 제작자만이 알 듯하다.
              - link "[221]" [ref=e3322] [cursor=pointer]:
                - /url: "#fn-221"
              - text: 2020년 10월 15일 인터뷰에서 밝혀지길 빨간 두건의 숲도 이쪽 세계관에 포함되는 이야기라고 한다. 리프가 직접 만들었던 모형정원이라고 하며 원래라면 배드엔딩으로 끝났어야 하지만 빨간 두건이 끝까지 포기하지 않아서 아예 결말 자체가 변해버렸다고 한다. 리프는 빨간 두건을 "최대의 오점이자 실패작"이라고 평했다.
