                      - /url: "#fn-231"
                    - text: 현재는 어디까지나 생각 중이라고 한다. 그리고 2022년 2월 24일자로 트위터 및 서클 블로그에 빨간 망토가 주인공인 신작
                    - strong [ref=e3420]: DEAD RED HOOD
                    - text: 가 발표되었다. RPG가 아닌 암살 계열 게임이라고 한다.
