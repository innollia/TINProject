            - generic [ref=e3256]:
              - text: 본작의 F, G 엔딩 루트 메아리스의 언동으로 미루어보아 전작
              - link "BLACK SOULS" [ref=e3257] [cursor=pointer]:
                - /url: /w/BLACK%20SOULS
              - text: 의 D 엔딩에서 이어지는 세계관으로 추정된다. 전작의 세계관은 메아리스가 창조신의 자리에 있고 그녀의 새아버지 격인 니알라토텝은 앨리스의 모습으로 숨어지내고 있었으나, 주인공 그림에게 흥미를 가진 니알라토텝이 전작 D 엔딩에서 바포메트가 주인공과 메아리스에게 죽고 없어지자, 판에 개입, 메아리스에게서 현실 개변 능력을 빼앗고 본작의 세계를 만들어 정착한 것으로 보인다.
              - link "[203]" [ref=e3258] [cursor=pointer]:
                - /url: "#fn-203"
              - text: DLC 2에서 추가된 혼돈 던전에서 볼 수 있는 책에 메어리스가 힘을 잃고 메리 앤으로 전락하게 된 내용이 간략하게 나오는데, 붉은 여왕과 하얀 여왕이 메어리스의 신격을 끌어내린 뒤 그 힘을 빼앗고, 서로 간에 문제가 발생할 가능성을 막기 위해 개변능력 그 자체를 지배자로 만들었다고 한다. 이름은 암흑무대장치 그랑기뇰. 지금은 존재하지 않고 먼 과거에 있다고 한다.
              - link "[204]" [ref=e3259] [cursor=pointer]:
                - /url: "#fn-204"
              - text: 창조주인 니알라토텝이 루이스 캐롤과 앨리스 리들 사이의 관계에 큰 관심을 갖고 있었기 때문인지 전체적인 NPC나 주요 지역명 등이
              - link "이상한 나라의 앨리스" [ref=e3260] [cursor=pointer]:
                - /url: /w/%EC%9D%B4%EC%83%81%ED%95%9C%20%EB%82%98%EB%9D%BC%EC%9D%98%20%EC%95%A8%EB%A6%AC%EC%8A%A4
              - text: 와
              - link "거울 나라의 앨리스" [ref=e3261] [cursor=pointer]:
                - /url: /w/%EA%B1%B0%EC%9A%B8%20%EB%82%98%EB%9D%BC%EC%9D%98%20%EC%95%A8%EB%A6%AC%EC%8A%A4
              - text: 를 오마주한 형태로 되어 있다. 니알라토텝의 목적은
              - strong [ref=e3262]: 영원토록 사랑하는 앨리스를 찾아 헤매는 주인공의 모습을 관찰하는 것
              - text: 으로 A 엔딩에서 앨리스를 만났음에도 주인공이 다시 앨리스를 찾아 다음 회차로 건너가는 이유가 이것 때문이다. 애초에 니알라토텝의 설계 하에서 주인공은 같은 루프를 무한히 돌게 되어 있었고, 회차 막판에 주어지는 3종류의 가짜 앨리스는 그저 주인공의 의욕 고취를 위해 준비된 잠깐의 포상에 불과했던 것. 그마저도 E 엔딩에서 앨리스를 살해할 때 딸과 어머니쪽은 집착수준으로 죽이려 들고 여동생쪽은 대놓고 주인공을 욕하는 걸 보면
              - link "[205]" [ref=e3263] [cursor=pointer]:
                - /url: "#fn-205"
              - text: 이 앨리스들도 겉으로만 주인공에게 잘 대해주는 것일 가능성이 높다. 무엇보다 sen치가 -인 상태가 되어서 전투가 벌어지면 이 셋의 원래 이름이 나타난다. 전부 우주적 존재들이 앨리스 행세를 하고 있던 것. 이미지 파일명을 뜯어보면 각각
              - link "이브 트스틸" [ref=e3264] [cursor=pointer]:
                - /url: /w/%EC%9D%B4%EB%B8%8C%20%ED%8A%B8%EC%8A%A4%ED%8B%B8
              - text: ", 미노그라,"
              - link "이호운데" [ref=e3265] [cursor=pointer]:
                - /url: /w/%EC%9D%B4%ED%98%B8%EC%9A%B4%EB%8D%B0
              - text: 로 모두
              - link "니알라토텝" [ref=e3266] [cursor=pointer]:
                - /url: /w/%EB%8B%88%EC%95%8C%EB%9D%BC%ED%86%A0%ED%85%9D
              - text: 과 혈연인 외신들이다.이와는 별개로, 메아리스가 단독으로 관리하다시피 했던 전작의 세계와는 달리 본작의 세계는 앨리스의 모습을 한 니알라토텝 이외에도 다른 강력한 지배자들이 제각각 한자리씩 차지하고 눌러앉아있는 세계이다. 본편에서는 하얀 여왕 노데와 붉은 여왕 프리켓이 여기에 속한다. 노데의 경우엔 니알라토텝과 계약을 맺어 주인공을 종마로 제공받아온 케이스이고, 프리켓의 경우 멋대로 노데의 영지를 점거하고 있는 상태이다. 둘 다 니알라토텝과 엇비슷한 격을 갖고 있기 때문인지 주인공의 sen치에 관계없이 정상적인 대화가 가능하고, 이 둘이 위치한 도서실의 꿈과 퀸 랜드 또한 마찬가지로 주인공의 sen치에 관계없이 일정한 모습을 유지하고 있다.
              - link "[206]" [ref=e3267] [cursor=pointer]:
                - /url: "#fn-206"
              - text: 또한 옥스퍼드 학원에서 망원경이 있는 곳에서 sen치가 -인 상태에서 망원경을 들여다볼 때 알 수 없는 커다란 무언가를 볼수 있는데 게임 데이터 안에 있는 Graphics 폴더를 뜯어보면 알 수 있는 달에 있는
              - link "그 무언가의 정체는 바로..." [ref=e3268] [cursor=pointer]:
                - /url: /w/%EC%95%84%EC%9E%90%ED%86%A0%EC%8A%A4
              - text: DLC 1의 내용을 보면 노데가 다른 초월적 존재들에게 초대장을 보내서 불러온다는 사실을 알 수 있다. 하지만 크툴루는 꿈의 세계에 오길 거부하고 크툴루에게 보내진 초대장을 딸인 건방진 굴이 빼돌리고 여동생인 크티와 함께 대신 와버리는 바람에 크툴루 본인은 나오지 않는다. 여담이지만 크툴루도 '그녀'라고 지칭되는 걸 보면 여성체인 듯.
              - deletion [ref=e3269]: 후속작 히로인 각이다
              - text: 이러한 복선은 노데와 프리켓을 살해하려 들 때에도 확인할 수 있는데, 노데는 몇 번을 죽여도 부활하고 프리켓은 쓰러트려도 죽지 않고 사라져 버리는 등 은연중에 다른 등장인물들과는 차원이 다른 존재임을 암시한다.
              - link "[207]" [ref=e3270] [cursor=pointer]:
                - /url: "#fn-207"
              - text: 물론 진엔딩 루트로 진입한 후반부의 주인공
              - link "[208]" [ref=e3271] [cursor=pointer]:
                - /url: "#fn-208"
              - text: 에겐 그런 거 없는지 플레이어의 선택에 따라 노데는 전작의 바포메트 잡듯이 잡아버릴 수도 있다.DLC 2에서 추가된 메이벨은 어떤 곳이든 열 수 있는 만능열쇠의 원본을 보유하고 있었으며 과거, 현재, 미래 모든 세계선에서 살고 있다는 점에서 정체는
              - strong [ref=e3272]: 요그 소토스
              - text: 로 여겨지고 있다.
              - link "[209]" [ref=e3273] [cursor=pointer]:
                - /url: "#fn-209"
              - text: 그녀의 말에 따르면 다른 지배자들이 서로의 모형정원으로 치고박은 끝에
              - link "백치" [ref=e3274] [cursor=pointer]:
                - /url: /w/%EC%95%84%EC%9E%90%ED%86%A0%EC%8A%A4
              - text: 가 깨어나서 우주를 멸망시키는데, 이를 막기 위해 그녀가 간섭하면 백치가 바로 깨어나 버려서 간섭할 수가 없다고 한다. 즉 간섭만으로도 백치를 깨울 정도로 다른 지배들과는 차원이 다른 강함을 갖고 있다는 것이다. 그럼에도 자신의 모형정원인 혼돈 던전 외에선 볼 수 없는데, 히로인 쟁탈전에 참여하는 게 어처구니없다는 이유 때문이다. 주인공이 고왕을 쓰러뜨리면 메이벨은 주인공이 자신의 반려인
              - link "흑산양" [ref=e3275] [cursor=pointer]:
                - /url: /w/%EC%8A%88%EB%B8%8C%20%EB%8B%88%EA%B5%AC%EB%9D%BC%EC%8A%A4
              - text: 을 죽였었고 자신의 피를 먹인 고왕까지 죽였음에도 주인공이 마음에 들 것 같다며, 여기라면 기어오는 자의 눈이 닿지 않으니 같이 떠나자고 제안한다. 하지만 앨리스에 환장한 주인공은 단칼에 거절한다. 그러자 자신이 본 아자토스가 깨어나서 우주가 멸망하는 미래를 이야기해 준다. 그리곤 주인공의 육체가 검은 영혼의 부하를 견디지 못하고 머지않아 폭발해서 부서질 텐데 그때 육체 밖으로 빠져나온 영혼들을 원래의 주인에게 되돌린 후 육체를 다시 복구해 주겠다고 한다. 기어오는 자가 슬슬 눈치챌 것 같으니 이야기는 여기서 끝내지만 여기까지 온 당신이라면 꿈에서 깨어나는 건 쉬울 거라면서 대화를 끝마친다.메이벨과 처음 만난 뒤 노데에게 말을 걸면 관여하지 말라고 했는데 아무렇지도 않게 어겼다면서 그녀는 최고(最古)되는 자이지만 우주에서 추방당하고 게으름과 무위에 빠져 부정(不貞)불륜을 반복한다며 까내리고 그녀만큼은 인간의 마음을 결코 이해하지 못해 창조가 치명적으로 졸렬하다고 비난한다. 반면 메이벨과 대화하다 보면 노데는 추악한 욕망을 과거로 묻어둔 채 주인공에게 숨기고 있다면서 현혹되지 말라고 까내린다. 실제로 노데는 작중 극에서 거의 참여하지 않는 방관자의 입장을 고수하면서 사랑하는 주인공을 영원히 자기 곁에 떨어지지 못하게 그랑기뇰을 방치하고 있었으니 정확하게 맞는 셈. 여담으로 그녀와 이야기하다 보면 지배자는 생식을 위해 성별을 자유롭게 정할 수 있다는 걸 알 수 있다.한편으로 전작의 세계는 본작과 별개로 유지되고 있는 듯하다. 빨간 망토의 경우 흰토끼의 인도를 받아 본작의 세계로 넘어왔음을 암시하는 묘사가 있으며, 그 전까지는 흑의 재판 멤버인 린다메아
              - link "[210]" [ref=e3276] [cursor=pointer]:
                - /url: "#fn-210"
              - text: 에게 쫓기고 있었다고 작중에서 언급된다. 그러나 빨간 망토를 제외한 전작 등장인물들의 행방은 중구난방이다. 엘리자베트는 전작과 동일인물이지만 sen치가 높으면 이를 알아챌 수 없고, 반대로 빅토리아는 sen치의 영향을 받지 않지만 전작 빅토리아와의 연관성이 불분명하다. 도로시는 sen치가 높을 때에 숨겨진 맵에서 잠시 만날 수 있지만 정작 도로시 본인은 이미 사망한 상태로 보이고,
              - link "[211]" [ref=e3277] [cursor=pointer]:
                - /url: "#fn-211"
              - text: 잔 다르크는 아예 동화로만 발견된다. 에르마는 sen치가 -일 때 불타는 집에서 동화만 발견된다. 카타리나는 동상과 몽령으로 나오는 것과 동화의 내용을 보면 정황상 사망한 듯. 구스는 같은 새인 새끼 새가 동화를 주는 것외에는 불명.
              - link "[212]" [ref=e3278] [cursor=pointer]:
                - /url: "#fn-212"
              - text: 미란다는 무기만 나오다 DLC 2에서 메리필리아라는 이름으로 등장했는데, 같이 가지 않겠냐는 요청에 또 지워질지도 모른다고 하는 걸 보면 이미 니알라토텝에게 한 번 당한 모양이다. 그런데 흰토끼가 인도해 준 덕에 아무 문제 없이 넘어온 빨간 망토와 달리 조력자의 도움을 받지 못한 탓인지 빨간 망토와 달리 미란다 본인이 아닐 수도 있다는 떡밥을 수없이 뿌리고 있다. 메리필리아와 만난 뒤 로리나와 대화하면 식시귀는
              - strong [ref=e3279]: 먹은 인간의 기억을 읽어내 먹은 인간으로 변신할 수 있는 능력
              - text: 을 가지고 있으니 속지 말라고 하는 장면이 나온다. 로리나에게 식시귀에 대한 정보를 듣고
              - link "메리필리아에게 미란다가 맞냐고 따질 경우" [ref=e3280] [cursor=pointer]:
                - /url: https://gall.dcinside.com/mgallery/board/view/?id=wre&no=1683
              - text: 자신도 위화감이 있다며, 예전보다 시체고기를 좋아하게 되었고 상처를 입어도 곧바로 재생하는 등 기억은 자기 건데 몸은 자기 몸 같지 않다고 한다. 죽은 게 확실하다는 기억이 있다고 하면, 그럼 어떻게 자신이 여기 있는 거냐고 되묻다가 어떻게 여기 왔는지조차 기억이 나지 않는다고 한다. 그렇게 자신의 끊긴 기억을 더듬다가 해변에서 걷고 있던 중 자기 자신의 얼굴을 한 시체를 발견하고 그 시체를 먹었다는 기억을 떠올리고 마는데 그 기억에 자신은 미란다지 메리필리아 따위가 아니라며 더 이상은 생각하고 싶지 않다고 말한다. 즉 진짜 미란다는 이미 죽었지만 메리필리아는 본인을 미란다로 여기고 있고, 작중에서도 미란다 그 자체인 것처럼 움직이고 있어서 미란다가 식시귀로서 부활했다고 봐도 무방하다. 다만 차장 하인의 사례처럼 식시귀가 미란다 시체를 먹고 미란다로 변한 게 아니라 미란다가 세계 개변으로 인해 미란다가 식시귀로 바로 변조되었을 가능성도 있다. 여담으로 G 엔딩 루트에서 메리필리아에게 3악몽을 맡기고 떠나면 접접이 식시귀 따위가 허세부린다며 까는 걸 볼 수 있다.
