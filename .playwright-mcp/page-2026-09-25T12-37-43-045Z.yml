              - text: 사실 동화 작가들에 대해 어느 정도 지식이 있는 사람이라면 2편을 진행하면서 부자연스러움을 느꼈을 것이다. 주인공의 이름이 '그림'이라는 건 1편을 진행하면서 누누이 접해온 사실이지만, 정작 그 '그림'이 애타게 쫓는 인물은
              - link "그림 동화" [ref=e3292] [cursor=pointer]:
                - /url: /w/%EA%B7%B8%EB%A6%BC%20%EB%8F%99%ED%99%94
              - text: 의 대표적 히로인인 빨간 망토도, 신데렐라나 백설공주 같은 공주님도 아닌 루이스 캐럴이 창작한 캐릭터 '앨리스'기 때문. 그리고 이를 설명하는 진실은 본편의 진엔딩인 G 엔딩에서 찾아볼 수 있다.주인공 Grimm은 메아리스가 온갖 동화 작가들
              - link "[213]" [ref=e3293] [cursor=pointer]:
                - /url: "#fn-213"
              - text: 을 섞어서 만든 존재로, 전작의 주인공과 동일인물이다. 전작과 마찬가지로 불사자에 소울을 흡수해서 밑도 끝도 없이 강해지는 것이 특징. 차이점이라면 본작에서는 한번 죽으면 망자 상태가 되는 것 정도인데, 망자화 해제 방법이 앨리스 리들의 것으로 추정되는 '소녀의 향기'를 마시는 것이다. 이는 기어오는 자가 개변한 내용으로 보인다.스토리상 행적을 보자면 전작의 경우에는 메아리스의 장난감 신세, 이번에는 앨리스의 장난감 신세인 기구한 인물이다. 전작 종료 시점부터 본작이 시작하기 전까지 이미 여러 차례 루프했던 것으로 보이며, 그동안 꾸준히 히로인들과 서약을 맺거나 범하거나 하면서 뿌린 씨앗들이 본작의 세계를 유지하고 있었다고 한다. 주인공이 여러모로 우수한
              - link "종마" [ref=e3294] [cursor=pointer]:
                - /url: /w/%EC%A2%85%EB%A7%88
              - text: 였는지 노데는 이미 상당히 많은 자식들을 권세에 넣은 데다가 외계의 신격으로 추정되는 프리켓마저도 주인공과의 H에 거리낌이 없다. 즉 표면상으로는 훌륭한
              - link "하렘물" [ref=e3295] [cursor=pointer]:
                - /url: /w/%ED%95%98%EB%A0%98%EB%AC%BC
              - text: .강함과는 별개로, 세상을 마음대로 창조하거나 개변시키는 권능이나 신적 능력은 없는 것으로 추정된다. 그리고 강함이나 전적
              - link "[214]" [ref=e3296] [cursor=pointer]:
                - /url: "#fn-214"
              - text: 에 비해서 무력하게 당하는 장면이 등장하는데
              - link "[215]" [ref=e3297] [cursor=pointer]:
                - /url: "#fn-215"
              - text: ", 스토리 흐름을 위한 일종의 연출이라 보는 것이 그럴 듯하다. 이미 전작인"
              - link "BLACK SOULS" [ref=e3298] [cursor=pointer]:
                - /url: /w/BLACK%20SOULS
              - text: 에서부터 본편까지, 창조주나 그와 맞먹는 신들을 살해하는 전과를 상당히 쌓아올렸기 때문. 전투 도중에 사라져 버리는 붉은 여왕 프리켓을 제외하고 전작과 본편을 통틀어
              - strong [ref=e3299]: 주인공이 죽일 수 없는 신적 존재는 거의 존재하지 않는다.
              - link "[216]" [ref=e3300] [cursor=pointer]:
                - /url: "#fn-216"
              - text: 다만 주인공은 메아리스가 온갖 동화 작가의 인격을 섞어버리고 추가로 불사자 속성까지 끼얹어서 만들어 낸 일종의 이상형라는 것이 언급되는데, 이를 생각하면 평범한 인간이라 보기는 힘들다. DLC 1에서 크티가 진심을 드러내고 꿈의 세계를 통째로 물에 잠기게 하려다 추방당한 것을 보면 신들도 꿈의 세계 안에서는 어느 정도 힘이 제한되는 듯하다. 외신들이랑 맞다이를 깔 수준이지만 앨리스 3인방의 다굴에는 저항도 못하고 살해당하고 크티도 노데가 나서서 추방시킬 수준의 힘을 남겨두고 있던 터라 파워 밸런스는 제작자만이 알 듯. 니알라토텝부터가 보스전에서 소울마법 몇 방에 털리는 것처럼 본인 전투력은 매우 약해빠졌지만 주인공을 수십번이상 물먹였고 전투 직전 목을 졸라 죽이려 하는데 저항조차 못한 것만 봐도 순수 힘은 주인공이 강하지만 마냥 최강이라고 보긴 어렵다.G 엔딩 마지막을 보면 흰 공간을 걷던 주인공 그림에게서 루이스 캐럴의 영혼이 빠져나와 앨리스 리델과 함께 사라지는데, 이를 봐서 2편 종료 시점에서는 그림의 몸 속에 있던 여러 영혼 중 적어도
              - strong [ref=e3301]: 루이스 캐럴의 영혼만큼은 그림의 몸 속에서 빠져나갔다.
              - text: 오랜 세월이 지나 이미 늙어버린 현실의 '앨리스 리델'에게 좌절하던 캐럴의 영혼은, 세월이 흘러도 영원히 아름다운 채로 남아있을 '이상한 나라의 앨리스'의 등장인물 '앨리스'와 함께 성불했기 때문이다. 즉 BLACK SOULS 1편과 2편을 관통하던 '앨리스 이야기'는 2편의 무료 DLC 3편이 모두 나왔으니 사실상 끝났다고 봐도 무방하다.캐럴의 영혼이 빠져나간 후 덩그러니 남아 있던 그림은 꿈에서 깨어나게 되고, 적막한 현실세계를 걷던 그림의 앞에 나타난 건 빨간 망토. 두 편에 걸쳐 다른 사람의 히로인이나 쫓고 있었던 그림도 결국에는 자신만의 히로인을 만나게 된 셈이다.
              - link "[217]" [ref=e3302] [cursor=pointer]:
                - /url: "#fn-217"
              - text: DLC 3에서 추가된 H 루트에서 주인공이 개변능력 그 자체인 그랑기뇰에게 혼을 바칠 경우의 미래가 나오는데, 무대장치였던 그랑기뇰과 주인공의 영혼이 합일하여
              - strong [ref=e3303]: 창조주
              - text: 가 된다. 그 힘은 기어오는 자 같은 신들조차도 간단하게 처리할 수 있고 이대로 시간이 흘러 세계의 끝까지 간다면 백치나 허무를 외경할 필요가 없을 거라고 한다(...).엔딩 자체는 상당히 깔끔하게 낸 편으로, DLC 발매 이후 이 세계관을 그대로 잇는 후속작이 나와도 말이 되고 그대로 모든 스토리를 끝내도 말이 된다. '이미 죽은 동화 속 인물들도 원전이 되는 동화책을 찾으면 살릴 방법이 있을지도 모른다'는 빨간 망토의 말도 있었고, 아직 그림의 몸에 남아 있을 안데르센 같은 인물의 영혼도 새로운 이야기의 소재가 될 만하다. 제작자는 동방이형향 제작과 현실에서의 삶 때문에 바빠 보이지만, 본작의 다운로드 수가 4만건을 넘은 데다 제작자 본인이 후속작을 제작한다고 언급까지 했는지라 게임 제작을 계속할 동력이 되기에는 충분할 것이다.
