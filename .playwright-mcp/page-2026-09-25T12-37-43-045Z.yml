                  - blockquote [ref=e1570]:
                    - generic [ref=e1571]: "\"테켈리・리,테켈리・리..\"독특한 울음소리가 특징인 칠흑의 부정형 존재.강렬한 산성력을 가지고 있어 전신에서 떨어지는 액체에 한번 닿으면 조각도 남기지 않고 녹여서 소멸시킨다.소녀와 같은 마음으로 질투가 많아, 잘 꾸며입은 여자를 보면 가슴에 파묻어 썩은 고기의 악취를 풍긴다."
                  - generic [ref=e1573]:
                    - text: DLC 3에서 새로 추가된 히로인. 울음소리 테켈리-리를 봤을 때
                    - link "쇼거스" [ref=e1574] [cursor=pointer]:
                      - /url: /w/%EC%87%BC%EA%B1%B0%EC%8A%A4
                    - text: 로 추정된다. 대화를 할 때 말을 굉장히 길게 늘어뜨리는 버릇을 가지고 있다.광기산맥 출구 갈림길에서 왼쪽으로 들어가면 산 웅덩이와 함께 중앙에 있는데 말을 걸면 주인공을 알아보며 이제야 자기한테 차례가 돌아왔다며 기쁘다고 말하곤 번식하자 한다. 좀 녹을지도 모르지만 상냥하게 해준다는 듯.이후 다시 말을 걸면 서약이 가능해진다. 서약 효과는 비율 데미지 감소 및 회복효과 경감. DLC 3에 들어와서 비율 데미지를 주는 적들이 무지하게 늘어난 터라 상당히 쓸만한 서약 효과다. 회복은 어차피 턴소비가 없는 아이템으로 하니 크게 걱정될 건 없는 편. 서약을 하다 보면 스스로를 임금님이라고 말하며 명령받는 게 싫다고 한다. 그래서 그런지 서약 레벨이 낮으면 봉사하기를 선택해도 명령하냐면서 위협하지만 서약 레벨이 높으면 부탁인 걸 알고는 들어준다. 대화를 하다 보면 원래 역할을 맞는 지배자중 하나였던 걸로 보이는데 적응을 못하고 녹여버려 아예 역할 자체를 안주고 쫓아낸걸로 보인다. 본인은 이런 모습이라도 딱히 불편한 게 없어서 역할을 별 신경 안 쓴 것으로 보이지만...만약 유니스 루트를 선택해 게르다를 정신차리게 하지 않으면 게르다를 살해한다. 이끌려왔던 게르다가 복슬복슬한 옷을 입고 있고 있어서 얘기 좀 하자고 말했더니 울면서 무서워하길래 짜증나서 녹여버렸다고 한다. 본인 말로는 총을 가지고 있어도 안 쏘길래 친구가 될까 생각했더니 그런 태도로 나오니 짜증났다는 듯. 그러면서 실패 히로인은 전부 폐기라고 말하는데 아마 이전에도 이런 식의 실패한 히로인을 폐기했던 것으로 추정된다.참고로 봉사하기나 번식하는 걸 선택하면 아무래도 몸이 산 덩어리다 보니 목이 녹아간다는 묘사가 나오고 실제로 하고 난 이후 HP가 1로 줄어든다! 번식하는 걸 선택하면 끝나고 난 이후 자신 다른 녀석들처럼 구속 따윈 안 한다며 번식하고 싶으면 다시 오라고 말한다. 의외로 범하는 선택지를 고르거나 감금해도 별로 신경 쓰지 않는다. 단, 살해한다를 선택하면 감금되어 있어도 보스전에 들어가니 주의.
