                    - text: 에서 어느 정도 따온 것으로 보인다. DLC 2 때부터 블랙웰의 편지와 트위들 쌍둥이를 통해서 언급된 인물로 당시엔 쌍둥이가 마수화되었다란 말로 인해 행방을 알 수 없는 정도로만 언급되었는데 DLC 3에서 등장했다. 본래 이상한 나라의 정신병동과 크리미아 간호 병동을 세우고 이상한 나라의 의료를 담당하고 있었으며 그녀를 신봉하는 사람들도 있었으나 어떠한 소동으로 인해 사라졌다고 하며 DLC 3를 시작하는 문으로 들어가면 이벤트와 함께 DLC 3의 시작을 알리는 역할로 나온다. 문을 통과하고 관에 담겨 흘러들어온 주인공을 표류자라고 부르며 몸도 마음도 병에 걸려 괴로워하지만 자신이 있는 이상 반드시 살리겠다며 주인공을 안면실로 보낸다.크리미아 간호 묘지 4층에 그녀의 방이 있는데 여기서 동화 『나이팅게일』을 입수할 수 있다. 이외엔 소비 아이템만 있지만 sen치가 0 이하일 경우 그녀가 왜 모형정원에서 없어졌는지 알 수 있는 그녀의 수기를 발견할 수 있다. 내용을 보면 이상한 나라 초기 때부터 의료 상황이 굉장히 심각했던 것으로 보이는데 병을 치료해도 계속 새로운 병이 발견되어서 감염이 확대, 그 결과로 병원엔 매일같이 환자가 몰아닥치고 이 와중에 정신병자들도 발생해 정신병원도 환자가 꽉 찼다. 치료되는 사람들 이상으로 병자들이 늘어났고 기껏있는 의사나 간호사들도
