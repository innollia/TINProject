              - list [ref=e3368]:
                - listitem [ref=e3369]:
                  - generic [ref=e3370]: 주인공이 불사자이기에 끝없이 강해질 수 있다는 설정이 있다. 블랙소울2 위키에 의하면 공격력, 방어, 마력, 마법방어, 민첩, 운은 전작과 동일하게 최대 109998이며, HP는 1099998, MP는 199998이 상한선이다. 이 수치가 실질적인 한계로 보이지만 내부적으로는 이후에도 상승하여 장비의 마이너스 효과를 상쇄할 수 있다. 소지 소울의 최대는 99999999S. 상기한 한계치는 모두 DLC 2에서 높아진 수치이다.
              - list [ref=e3372]:
                - listitem [ref=e3373]:
                  - generic [ref=e3374]:
                    - text: 스테이터스 중 회심률, 물리 회피율, 명중률은 합산이며, 나머지 스테이터스(HP, MP, 공격력, 방어, 마력, 마법방어, 민첩, 행운)는 곱산이다. 이는 장비에 의한 보정만이 아닌 전투 중 버프에 의한 보정도 포함된다. 예컨대 죄악의 반지(모든 스탯 -30%)를 2개 착용한 경우 합산에 의한 100% - 60% = 40%가 아닌, 곱산에 의해
                    - strong [ref=e3375]: 0.7 * 0.7 = 49%
                    - text: 의 스탯 보정을 받게 된다.
              - list [ref=e3376]:
                - listitem [ref=e3377]:
                  - generic [ref=e3378]: DLC 3 진입 전까지는 상대하기 어려운 적이 있으면 민첩성 세팅을 맞추고, 요정의 날개를 두 개 걸고 회피를 눌러 뻥튀기 한 뒤 투척 나이프를 던지면 된다. 투척 나이프는 턴을 소비하지 않는 민첩성 의존 필중 공격이므로, 민첩성이 스탯창 기준 50000가량이 되면, 회피로 인한 민첩성 상승과 민첩성 2단계 상승 버프가 동반될 경우 난이도 9의 신의 이어나 2 페이즈 앨리스라도 투척 나이프 99개 이내로 1턴만에 쓰러뜨릴 수 있다. 민첩성 세팅은 캔디 15개로 구할 수 있는 위태천의 반지(민첩성 +50%) 4개와 카이저 너클(민첩성 +60%)로 완성되므로, 다른 세팅에 비해 완성시기가 이르고 난이도가 낮으며, 스탯 상승량도 높은 편이다.
                - listitem [ref=e3379]:
                  - generic [ref=e3380]: 소울이 차고 넘친다면, 저 방법에서 더 나아가 건브레이크와 토끼의 회중시계를 써먹어보자. DLC 2 이후로는 대포 이외의 총으로 건 브레이크 사용 시 턴이 넘어가지 않고 대신 쿨타임이 도는데, 이를 회중시계로 초기화함으로써 99번 공격이 가능하다.
              - list [ref=e3381]:
                - listitem [ref=e3382]:
                  - generic [ref=e3383]:
                    - text: 이를 이용해서 좀 더 색다른 플레이를 할 수도 있는데, 다회차나 혼돈 던전으로 트롤의 반지
                    - link "[224]" [ref=e3384] [cursor=pointer]:
                      - /url: "#fn-224"
                    - text: 를 얻어서 둘둘하고, 심해에서 얻을 수 있는 심해 기사의 닻+5
                    - link "[225]" [ref=e3385] [cursor=pointer]:
                      - /url: "#fn-225"
                    - text: 을 껴서 공격력을 극한으로 늘려놓은 다음, 반드시 필중하는 건브레이크를 이용해서 적을 순식간에 순살해 버릴 수도 있다.(...) 신의 이어든 심해의 기사든 최종보스든 간에 건브레이크 몇 방이면 끝. 다만 게임의 난이도가 재미없을 정도로 정말 대폭 하락해 버리니 즐길대로 즐긴 유저들에게 추천.
                    - link "[226]" [ref=e3386] [cursor=pointer]:
                      - /url: "#fn-226"
              - list [ref=e3387]:
                - listitem [ref=e3388]:
                  - generic [ref=e3389]:
                    - text: 검은 산양의 반지
                    - link "[227]" [ref=e3390] [cursor=pointer]:
                      - /url: "#fn-227"
                    - text: 리스크를 만상의 지팡이
                    - link "[228]" [ref=e3391] [cursor=pointer]:
                      - /url: "#fn-228"
                    - text: 로 씹어버릴 수 있다. 다만 검은 산양의 반지 자체가 캔디로만 얻을 수 있고, 캔디를 잔뜩 가지고 있게 될 때 즈음에는 이미 검은 산양의 반지가 필요가 없을 정도로 고여버렸을 때일 테니.(...)
              - list [ref=e3392]:
                - listitem [ref=e3393]:
                  - generic [ref=e3394]: 다회차 플레이 중인데 소울이 좀 부족하다면, 도서관의 꿈에서 나오는 탐욕의 은사 반지나 프리켓의 서약을 낀 채로, 토끼의 회중시계와 살인귀의 산탄총을 들고 한탄의 해변으로 향하자. 메리필리아와 싸워 이기면 상당량의 소울을 주기 때문에 처리할 능력이 되는 다회차 플레이에서는 이만큼 소울을 파밍하기 좋은 장소도 없다.
              - list [ref=e3395]:
                - listitem [ref=e3396]:
                  - generic [ref=e3397]:
                    - text: 레벨 업도 사냥 노가다도 귀찮다면 추락방에서 계속해서 주인공을 떨어트리자. 이 방법으로 스탯을 쌓는 걸 보통 추락작이라고 얘기하며 추락작을 할 생각이면 매크로까지 돌리는 걸 추천한다. 하얀 곰에게 창고가 생겼기 때문에 흑의 소울을 99개 모은다 → 하얀 곰에게 넘긴다는 방식으로 흑의 소울을 999개+99개까지 모을 수 있다.
                    - link "[229]" [ref=e3398] [cursor=pointer]:
                      - /url: "#fn-229"
                    - text: 엔딩을 보고 다음 회차로 넘길 경우, sen치가 초기화되기 때문에 1098개의 흑의 소울을 전부 써버리고 넘어가면 OK. 만약 1000 정도로 만족 못하고 더 올리고 싶다면 추락의 방말고 리펀대성당에서 하는 걸 추천한다 눈알의 방해도 없고 낙사구간이 화툿불과 가깝다. 다만 게임 중후반에 얻는 소울에 비하면 수고에 비해 상승치가 미미한 수준이므로 초반에 게임을 풀어나가기 힘든 경우에나 추천.
              - list [ref=e3399]:
                - listitem [ref=e3400]:
                  - generic [ref=e3401]: 프리켓 서약 3레벨(소울 획득량/아이템 획득량 2배)과 탐욕의 은사 반지/금사 반지 효과는 중복되지 않는다. 배수 효과가 필요하다면 둘 중 하나만 사용하자.
              - list [ref=e3402]:
                - listitem [ref=e3403]:
                  - generic [ref=e3404]: 소울 노가다를 별도로 하고 싶다면 상기한 소울 2배 효과를 받은 후 토끼굴에서 토끼 열쇠를 사용해 안의 토끼를 죄다 잡거나, sen수치가 0일 때 추락의 방 등에서 나오는 눈알 몬스터를 사냥하는 방법이 효과적이다. 이 방법으로 어느 정도 스펙에 자신이 생겼다면 탄식의 해변 숨겨진 길에서 나오는 식시귀 메리필리아를 반복 사냥하자. 도서관의 꿈 동상에서 난이도를 높일수록 획득 소울이 따라 늘어난다는 점을 참고하면 좋다.
              - list [ref=e3405]:
                - listitem [ref=e3406]:
                  - generic [ref=e3407]: 스테이터스를 올리는 방법은 우선 레벨 상한인 999레벨을 달성하는 것이 있으며, 이후로는 색이 있는 소울을 사용해 스탯을 끊임없이 올릴 수 있다. 다만 999레벨을 달성하는 시점에선 노데가 파는 스탯 소울로는 99개씩 산 후 쓰는 것만 반복하는 것도 한세월이 걸린다. 하노버 폐역의 차장이 검은 소울과 더럽혀진 검은 소울을 파는데 이를 이용하는 것이 훨씬 빠르고 효과적이다. 미친 듯이 깎여나가는 sen치가 부담스럽다면 상기한 회차 넘기기로 sen치를 초기화시키거나 광기의 톱니바퀴를 쓰면 된다.
              - list [ref=e3408]:
                - listitem [ref=e3409]:
                  - generic [ref=e3410]: 검은 소울은 HP 10, MP 5, 올스탯 1을 올려준다. 그리고 더럽혀진 검은 소울은 HP 30, MP 15, 올스탯 3을 올려주며, 외우주의 검은 소울은 HP 300, MP 150, 올스탯 30을 올려준다. 이는 sen치를 고려하지 않고 스탯 상승량만 본다면 상승량이 구매할 때의 가격에 정비례하니 돈이 썩어넘친다면 부담 없이 더 높은 등급의 소울을 구매하도록 하자.
              - list [ref=e3411]:
                - listitem [ref=e3412]:
                  - generic [ref=e3413]: G 엔딩을 보고 난 후 퀸 랜드에서 숨은 삐에로 상인에게서 캐릭터 외양을 변경할 수 있는 손거울을 살 수 있다. 팔고 있는 건 호박, 탐정, 흑토끼, 소녀(앨리스)의 손거울이다. 구입하면 회상방에 추가되어 플레이어 외양을 변경할 수 있다.
              - list [ref=e3414]:
                - listitem [ref=e3415]:
                  - generic [ref=e3416]:
                    - text: 2020년 10월 15일에 DLsite채널에서 제작자 寿司勇者トロ의
                    - link "인터뷰" [ref=e3417] [cursor=pointer]:
                      - /url: https://ch.dlsite.com/matome/91660
                    - text: 가 실렸는데 3명의 주역인 빨간 두건, 앨리스(+니알라), 리프에 대한 이야기와 이후 활동에 관한 이야기가 나왔다. 인터뷰이긴 한데 특이하게 トロ와 리프가 인터뷰 대상자로 나오며 주로 리프가 질문에 대답하는 편. 인터뷰 말미에 후속작들에 관한 이야기도 나왔는데 번외편 2개
