                  - text: 스토리상 진행도 1은 필수고, 노가다를 한다 해도 몬스터 하나에 기껏해야 몇백 소울이 전부인 루트위지 시가지에 짱박혀 있을 순 없으므로 지역을 어느 정도 개척해놔야 하는데, 이 과정에서 도지슨 교를 돌파하면 +1. 즉 진행도 2쯤은 기본으로 깔고 들어간 상태에서, 진행도는 2 정도밖에 여유가 없다. 그나마 가장 효율적인 루트는 로리나든 공작 부인이든 접접을 잡은 이후에 보기로 하고 어떻게든 도살장을 뚫은 뒤 캐롤 강까지 가서 버나이 이벤트를 보고, 접접과 전투할 때 버나이를 데리고 오는 것 정도다. 이러면 도살장과 캐롤 강에서 진행도가 각각 1씩 증가하므로 여유가 있는 편이다. 더구나 버나이는 접접을 포함한 3대 악몽과의 싸움에 모두 참전하면 동화책과 유니크 무기를 주므로 일거양득이다.
