              - blockquote [ref=e3198]:
                - generic [ref=e3199]: 이게 이렇게 될 수도 있구나.나의 꿈나라. 불만스런 의견따위는 없는 나라.사랑스러워 보이는 재앙의 원인.저 위에서 떨어졌더니 이런 곳이라니.더욱 더 불안해져 가는 거지?잘 가(사요나라).
              - generic [ref=e3201]:
                - link "[178]" [ref=e3202] [cursor=pointer]:
                  - /url: "#fn-178"
                - text: 만약 F, G 엔딩을 위한 조건을 다 채웠으면 3명의 앨리스 대신 취소버튼을 누르면
                - strong [ref=e3203]: 앨리스 리들
                - text: 이라는 특수 선택지가 나오는데 이를 선택할 시 매우 공포스러운 장면
                - link "[179]" [ref=e3204] [cursor=pointer]:
                  - /url: "#fn-179"
                - text: 과 함께 뒷면 세계인 '소녀의 악몽'이라는 특수한 맵으로 이동하게 되는데 거기서
                - strong [ref=e3205]: 모든 히로인들이 마수의 모습으로 기다리고 있다.
                - text: 완전히 적대화 상태이므로 보면 바로 덤벼오며 만약 sen치가 -인 상태로 게임을 진행했다면 거기서 봤던 마수들의 모습과 같다는 것을 알 수 있다. sen치가 -라서 대화가 깨져있던 원래 세계와는 달리 여기서는 정상적으로 이야기한다. 이후 가다 보면 멀쩡한 모습의 노데와 만날 수 있는데 노데와 대화하면 뒷면 세계가 이 세계의 진짜 모습이란 것을 알 수 있다. 즉, sen치의 영향을 받는 히로인들은 괴생명체의 모습들이 본래 모습이다.sen치는
                - link "SAN치" [ref=e3206] [cursor=pointer]:
                  - /url: /w/SAN%EC%B9%98
                - text: 와 같은 정신력이라고 생각하기 쉽지만 사실
                - strong [ref=e3207]:
                  - link "블러드본" [ref=e3208] [cursor=pointer]:
                    - /url: /w/%EB%B8%94%EB%9F%AC%EB%93%9C%EB%B3%B8
                  - text: 의 계몽 수치와 같은 수치
                - text: 로
                - link "[180]" [ref=e3209] [cursor=pointer]:
                  - /url: "#fn-180"
                - text: 이 수치가 높을수록 미쳐버려서 괴물들이 정상적인 모습으로 보였던 것. sen치가 낮을수록 세계의 원래 모습을 볼 수 있으며 sen치가 높으면 행복한 세계가 펼쳐진다.
                - link "[181]" [ref=e3210] [cursor=pointer]:
                  - /url: "#fn-181"
                - text: 전작부터 블러드본의 초월적인 존재가
                - link "우주로부터 온 촉수 존재" [ref=e3211] [cursor=pointer]:
                  - /url: /w/%EA%B7%B8%EB%A0%88%EC%9D%B4%ED%8A%B8%20%EC%98%AC%EB%93%9C%20%EC%9B%90
                - text: 라는 설정을 충실히 오마쥬하고 있다. 각각 최종보스를 상대할 때 BGM이 Carol of the Old Ones의 리믹스 버전으로 크툴루 캐롤송 중에서 가장 잘 어울리고 유명한 곡이다.
                - link "[182]" [ref=e3212] [cursor=pointer]:
                  - /url: "#fn-182"
                - iframe [ref=e3213]
                - text: 우주에서 온 초월적 존재가 인간에게 관심을 갖고 장난감처럼 가지고 놀고 그에 영향을 받은 인간은 괴이하게 뒤틀려 버린다는 블러드본의 설정을 동화와 섞어 잘 재현했다고 볼 수 있다.
                - link "기어오는 자" [ref=e3214] [cursor=pointer]:
                  - /url: /w/%EB%8B%88%EC%95%8C%EB%9D%BC%ED%86%A0%ED%85%9D
                - text: 가 간섭하여 메어리 스에게 개변능력을 빼앗고 자신만의 모형정원으로 바꿔버렸으며
                - link "[183]" [ref=e3215] [cursor=pointer]:
                  - /url: "#fn-183"
                - text: 세계를 지배하는 자들은 주인공과의 관계를 통해 끝없이 자식을 낳아가며 세계를 유지하였으며 B 엔딩의 알에서 히로인들이 탄생하는 모습들은 진실의 일부를 보여준 것이다.
                - link "[184]" [ref=e3216] [cursor=pointer]:
                  - /url: "#fn-184"
                - text: 앨리스가 메어리 스에게 빼앗은 세계를 모형정원으로 만들어 거기에 주인공을 집어넣고 본인은 계속 관찰하는 일을 반복해온 것. 하지만 노데 본인은 이 행위에 허무를 느끼고 있으며 주인공이 이 꿈에서 깨어나길 바라고 있다고 한다.
                - link "[185]" [ref=e3217] [cursor=pointer]:
                  - /url: "#fn-185"
                - text: 진실을 알려준 흰토끼 노데는 그 자리에서 죽일 수도 있는데
                - link "[186]" [ref=e3218] [cursor=pointer]:
                  - /url: "#fn-186"
                - text: 도서실에서 그냥 죽던 것과 달리 보스로서 싸우게 되며 최종보스와 맞먹을 정도로 강하며 어지간한 스펙으론 순살당하는 수준. 보스전은 1 페이즈와 2 페이즈로 나뉘어 있는데, 1 페이즈에서부터 꽤나 빡세다. 레벨 999를 찍어서 스탯을 올려주는 색깔 소울로밖에 스펙업이 안 되는 지경에 이르러도, 간헐적으로 던지는 하얀 충격이 HP 거의 전부를 까버린다.(...) 방어력도 이상할 정도로 높아서 최종보스보다도 대미지가 박히지 않는 느낌이 든다. 어떻게든 1 페이즈를 넘기면 2 페이즈가 시작되는데, 이때 나타나는 이름은
                - strong [ref=e3219]: 하얀 여왕 노데.
                - text: 아이돌로 등장한 붉은 여왕과 달리 전혀 등장이 없던 하얀 여왕은 계속 주인공 옆에 있던 것이었다. 니알라토텝이라는 초월적인 존재와 협력했다는 언급과, 격파 이후의 대사를 참조하면 노데 또한 크툴루 신화의 위대한 존재들 중 하나라는 것을 알 수 있으며, 서약 시 얻을 수 있는 노데의 고향이 바다라는 정보들, 퀸 랜드로 이동시켜 주는 몬스터가
                - link "나이트건트" [ref=e3220] [cursor=pointer]:
                  - /url: /w/%EB%82%98%EC%9D%B4%ED%8A%B8%EA%B1%B4%ED%8A%B8
                - text: 라는 점, 이로부터 추정할 수 있는 노데의
                - strong [ref=e3221]:
                  - link "진정한 정체는..." [ref=e3222] [cursor=pointer]:
                    - /url: /w/%EB%85%B8%EB%8D%B4%EC%8A%A4
                - link "[187]" [ref=e3223] [cursor=pointer]:
                  - /url: "#fn-187"
                - text: 전투에서 이기면 노데는 그림보고 강해졌다면서 지배자들은 태어날 때부터 힘이 완성되어 있어서 성장도 학습도 없고 '이 우주의 지배자는 나' 라는 오만에 취해 허무라는 옥좌에 영겹과도 같은 시간 동안 앉아있었다고 한다. 하지만 그렇기 때문에 노데는 주인공인 그림의 덧없음, 그리고 포기하지 않는 모습에 매료되어 사랑하게 되었다고 한다. 마지막으로 "(주인공)님. 지배라는 건··· 정말 무료하더군요···." 란 유언을 남기며 사망한다.여담으로, 붉은 여왕 프리켓의 콘서트를 보고 나면 본래 퀸 랜드는 하얀 여왕 노데의 영지였으나, 이를 붉은 여왕 프리켓이 탈취했음을 알 수 있다.
                - link "노데" [ref=e3224] [cursor=pointer]:
                  - /url: /w/%EB%85%B8%EB%8D%B4%EC%8A%A4
                - text: 와의 대립구도, 주사위가 6이 나왔을 때의 검은 얼굴로 미루어 알 수 있는 정체는 앨리스와는 다른
                - link "니알라토텝" [ref=e3225] [cursor=pointer]:
                  - /url: /w/%EB%8B%88%EC%95%8C%EB%9D%BC%ED%86%A0%ED%85%9D
                - text: 의 화신.
                - link "[188]" [ref=e3226] [cursor=pointer]:
                  - /url: "#fn-188"
                - text: 그래서 첫 데이트 후 그녀에게 말을 걸면 받을 수 있는 반지를 장착하면
                - strong [ref=e3227]: 앨리스 리들의 대사를 알아들을 수 있게 되며
                - text: ", 데이트 중일 때 미로를 돌아다니다 보면 진엔딩 루트에 진입하기 전까진 절대 볼 수 없었던 앨리스 리들을 만날 수 있다."
                - link "[189]" [ref=e3228] [cursor=pointer]:
                  - /url: "#fn-189"
                - text: 앨리스가 사라진 뒤 프리켓이 나타나는데, 이 사랑의 도피는 언제까지 계속되냐느니, 주역만 눈에 띄고 관객도 배우도 질리는 이런 방식은 꼴불견이라고 대놓고 본체를 디스하며 그럼에도 그녀들에게 질투하는 자신이 제일 보기 흉하다며 자조하는 등 평상시의 프리켓이라면 상상도 할 수 없는 말을 한다. 곧바로 아무렇지도 않다는 듯 화제를 돌리지만.DLC 2부턴 메리필리아, 즉 미란다와 공투 플래그를 세웠을 경우 여기서 3악몽과 싸우게 된다. 길을 가는 중 3악몽이 길을 막아서지만 메리필리아가 나타나 셋을 막으려 한다. 여기서 플레이어는 메리필리아에게 맡기고 갈 수 있지만 전작과는 달리 이번엔 함께 싸울 수도 있다. 같이 싸운다고 하면 그때의 빈틈을 놓치지 않은 재버워크가 메리필리아의 목을 따버리려는 순간
                - strong [ref=e3229]: 전작의 흑의 재판 멤버이자 현 차장인 하인
                - text: 이 나타나 막아준다. 그의 말에 따르면 그동안 쭉 관객석에 있었지만 미란다 때문에 기억이 돌아왔다면서 이젠 지긋지긋하니 딱 한 번만 공투하기로 한다. 현실로 돌아가면 이번에야말로 진정한 차장이 되겠다는(...) 말과 함께.3악몽과 전투 후 접접과 밴더스내치는 후퇴하려 한다. 접접은 그저 재미있어 보여 왔을 뿐 니들이 꿈에서 깨든 말든 알 바 아니라 변명하고 밴더스내치도 너희들의 각오를 보고 싶었을 뿐이었다며 이에 편승한다. 그런데 그때 재버워크가 주박의 각인이란 기술로 둘을 붙잡고는
                - strong [ref=e3230]: 살해한다.
                - text: 바닥을 보인 둘에게 실망했다는 이유로 죽인 것인데, 이에 충격받은 메르필리아가 재버워크의 위압감에 이 세상의 존재가 아니라며 바포메트를 떠올리자 하인은 그럴 만한 건 우주의 종족이자 극에 달할 만큼 더러운 영혼을 가진, 별을 멸하고 지배하는 힘을 가진 지배자뿐이라고 한다. 즉 재버워크 또한 강력한 힘을 가진 외신으로 여태까지 힘을 숨겨온 것이었다. 재버워크는 일행에게 독립하긴 아직 이르다며 멈추라고 하지만 거절당하고 재버워크는 혼자 셋을 막는다.
                - link "[190]" [ref=e3231] [cursor=pointer]:
                  - /url: "#fn-190"
                - text: 승리 시 재버워크는 더 이상 영혼을 유지할 수 없다며 죽어가고, 메리필리아는 재버워크에게 어째서 자신들을 완구로 밖에 보지 않느냐며 조금의 애정조차 줄 수 없는 거냐고 묻자 그러면 재미없다고 말하고 사라진다.3:1이었음에도 이 전투에서 하인은 치명상을 입고 말았고 어쩔 수 없이 메리필리아는 하인을 부축하며 후퇴한다.더 앞으로 진행하면 엔딩 분기가 갈리게 되는데 여기서 빨간 망토를 선택할지 메어리 앤
                - link "[191]" [ref=e3232] [cursor=pointer]:
                  - /url: "#fn-191"
                - text: 을 선택할지 고를 수 있다.메어리 앤을 선택할 시 빨간 망토는 배신감을 느끼며 적대하다 죽게 되며 메어리 앤에게 기어오는 자에 대해 들을 수 있다. 기어오는 자는 (전작 진 최종보스이자 메어리 앤의 어머니인 슈브 니구라스가 데려온) 메어리 앤(=메어리 스)의 새아버지였는데 이때 메어리 스는 기어오는 자가 자신처럼 비정상적인 욕구를 가지고 있단 것을 알아차렸고 메어리 스가
                - strong [ref=e3233]: 배드엔딩을 극도로 좋아하는 성격이며 그것에 개입하는 성격
                - text: 이라면, 기어오는 자는
                - strong [ref=e3234]:
                  - text: 자신만의 무대를 만들어놓고 관찰하기만 하는
                  - link "관음증" [ref=e3235] [cursor=pointer]:
                    - /url: /w/%EA%B4%80%EC%9D%8C%EC%A6%9D
                  - text: 에 가까운 일을 좋아한다고 한다.
                - text: 인간에게 관심을 가지면서 자신과 같은 신에게는 텅빈 구멍의 얼굴만 보여주면서 하는 짓이 방구석에서 어두침침하게 개미를 관찰하는 것과 같다며 젠가를 쌓아놓고 절대 부수지 않을 성격이라고 깐다.이후 최종보스로 나타난 앨리스와 전투를 하면 앨리스는 텅빈 구멍 같은 얼굴을 한 끔찍한 얼굴을 하고 있으며 그녀가 말하는 말은 죄다 문자가 깨져있는데 sen치가 -일 때 나타나는 문자들과 패턴이 같다는 것을 알 수 있다. 즉, 깨진 문자를 말하는 등장인물들은 모두 그녀가 개입한 인물이라고 할 수 있다. 그녀와의 전투에서 승리할 시 엔딩을 볼 수 있는데 메어리 스는 주인공이 어느새 자기보다 강해져 버려서 주인공을 무서워하게 되고 매일같이 성행위만 반복하는 나날만 보내게 되며 그들이 죽였던 앨리스는 사실 분신이며 세계 위에서 그들을 계속 관찰하고 있는 그녀를 볼 수 있다. 완전한 배드엔딩으로 F end(Fairy end)로 뜬다.선택 분기에서 빨간 망토를 선택할 시 메어리 앤은 분노하며 자신이 만든 존재들이 왜 자기 말을 안 듣냐 불평하자 빨간 망토는 자식은 부모를 선택할 기회가 없다며 응수한다. 거기에 열받은 메어리 스가 둘을 죽이려고 달려들며 보스전이 벌어지는데 2차 형태인 마수의 모습까지 꺼내들지만 결국 주인공에게 패배한다. 전투가 끝나고 메어리 앤은 빨간 망토의 수명은 20년 정도로 개변했고 무사히 돌아간다 할지라도 1년도 못살 거고 주인공인 그림은 주변의 히로인들이 처참하게 죽는 불행한 체질이니 영원히 불행해질 거라며 불쌍하고 비극적이라며 정신승리를 하듯 웃어대지만
                - link "[192]" [ref=e3236] [cursor=pointer]:
                  - /url: "#fn-192"
                - text: 그림에게 죽빵을 맞고 완전히 사망한다. 이후 그림은 빨간 망토를 위로하지만
                - link "[193]" [ref=e3237] [cursor=pointer]:
                  - /url: "#fn-193"
                - text: 빨간 망토는 독자적으로 조사하면서 이 사실들을 알고 있었다고 한다. 이미 둘 다 여기까지 오면서 선인악인 관계없이 죽여왔고 헤어졌고 너무나도 많은 사람들의 원망을 짊어지고 있다고 한다. 그렇지만 지금 맞잡은 당신의 손은 이렇게나 따뜻하고 날 태어나게 한 건 어머니도, 미친 여신도 아닌 바로 당신이라며 앞으로 나아가자고 한다.그렇게 진행하면 맨 처음 시작할 때의 그 장소에 도착하고 그곳엔 앨리스의 진짜 이름인 앨리스 리들이 기다리고 있으며 대화하면 앨리스는 사랑은 손안에 들어올 때 가치가 매우 낮아져 버리기 때문에 계속 사랑을 붙잡지 못하게 하면서 이를 반복해 왔다고 한다. 이후 앨리스와 H신이 무한 반복되지만 뒷면 세계에 들어올 때처럼 취소 버튼을 누르면 죽인다를 택할 수 있으며 이에 앨리스는 본색을 드러내며 목을 졸라 주인공을 죽이려 든다. 그렇게 그림이 죽기 직전, 빨간 망토가 이때를 기다리고 있었다며 앨리스의 목을 치면서 저지한다. 하지만 목을 친 정도로 앨리스, 정확히는 기어오는 자는 죽지 않았고 공격을 피한 빨간 망토는 늑대 폴로를 부르며 또다시 한방 먹인다. 이후 빨간 망토는 아직 녀석은 죽지 않았으니 이번에야말로 완전히 죽이자고 하고 그 순간, 무수히 많은 앨리스가 나타나며 보스전에 돌입한다.그렇게 빨간 망토, 그녀의 늑대 폴로와 함께 최종보스전에 돌입하며 이때 나오는 이름은
                - strong [ref=e3238]: 기어오는 소녀들.
                - text: 2 페이즈에 들어서면 이름과 기술 이름도 깨진다.
                - link "[194]" [ref=e3239] [cursor=pointer]:
                  - /url: "#fn-194"
                - text: 그렇게 기어오는 소녀들을 쓰러뜨리자 마치 약속이라도 한 듯 꿈의 세계가 붕괴하기 시작한다. 이대로 가다간 모두 휘말려 끝장날 거란 폴로의 말과 약속된 최악의 전개라면서 한숨을 내쉬는 빨간 망토와 함께 그림은 탈출하기 시작한다. 하지만 탈출하던 도중 무너진 낙반에 의해 길이 막혀 그림과 빨간 망토는 분단되어 버리고 폴로가 우회하자고 말을 꺼내자 빨간 망토도 그림에게 이를 말하려던 순간, 통로에서 그림을 돌려 달라며 딸, 동생, 어머니 앨리스가 나타난다. 빨간 망토는 그림보고 먼저 가라고 이야기하고 어느 선택지를 고르든 간에 그림은 먼저 떠나고 빨간 망토와 폴로는 앨리스들과 싸우기 시작한다. 그렇게 먼저 떠난 그림은 어느새 도착한 백색의 공간에서 울고 있는 앨리스 리들을 발견한다.울고 있던 리들은 그림을 보곤 자신은 그저 집에 있었는데 어느새 이곳에 있다며 아프고 무서웠단 말을 한다. 그리고 "캐럴 선생님, 구해줘" 라며 루이스 캐럴을 찾고 그림에게서 캐럴이 나타나 앨리스를 위로해 주며 자신들의 나라로 돌아가자고 말한다. 그렇게 둘은 사라지고 그림은 백색의 공간을 빠져나가며 자신의 집에서 깨어나게 된다.
                - link "[195]" [ref=e3240] [cursor=pointer]:
                  - /url: "#fn-195"
                - text: 이후 집을 나서자 인기척이 없는 거리에서 그림은 빨간 망토와 재회하고, 빨간 망토는 미소를 지으며
                - strong [ref=e3241]: "\"전부 끝났구나\""
                - text: 라는 말을 건네며 이야기는 끝을 맞이하게 된다. 이 루트의 마지막에 G end(
                - strong [ref=e3242]: G
                - text: ood end)라고 나오며 진엔딩과 함께 끝나게 된다. 덧붙여서 G 엔딩을 볼 시, 회상방에서 전체 CG의 개방이 가능하다. 그리고 주인공의 모습을 자유롭게 바꿀 수 있게 된다. 추가로 퀸 랜드에서 숨은 삐에로를 통해 앨리스와 호박기사, 토끼기사, 홈스의 외양을 살 수 있게 된다.
                - strong [ref=e3243]: 그러나...
                - group [ref=e3244]:
