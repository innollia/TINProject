            - generic [ref=e2445]:
              - text: 전작의 패링은 사라졌고 대신 브레이크라는 상대의 필살기를 캔슬하고 무방비 상태로 만드는 것으로 바뀌었다. 회피도 일정확률 회피이며 성능이 많이 내려간 편. 난이도는 전체적으로 어려워졌으며 회피의 성능이 내려간 것 때문에 체력이 약한 초반에는 대응 불가능한 적이 많으며 레벨 1 상태로 클리어해야 하는 최초의 보스 목사냥의 비스트에서 막히는 사람도 나오고 있다. 다른 보스들도 필살기를 브레이크로 캔슬하지 않으면 즉사급의 데미지가 들어오는 경우가 많으므로 긴장을 늦출 수가 없다.또한 다크 소울의 조언 시스템과 낙사도 구현해놨다. 바닥에 있는 붉은 흔적을 밟고 조사하면 조언이 출력되는데 보스 공략에 도움이 되는 팁부터 순진한 뉴비를 낚는 트롤링용 메세지까지 쓸데없이 디테일하게 구현해놨다.(...) 낙사하는 구간도 게임 곳곳에 있는데 발 한번 잘못 들여도 바로 추락해 사망한다.
              - link "[150]" [ref=e2446] [cursor=pointer]:
                - /url: "#fn-150"
              - text: 그리고 암령과 백령도 구현해놨다. 암령은 본작에서는 악몽령이라는 이름으로 등장한다. 플레이하는 도중 화면이 깜빡이고
              - strong [ref=e2447]: "\"악몽령 **가 나타났다!\""
              - text: 라는 메세지가 뜨면서 근처에 유령 같은 형체가 나타나면 싸울 수 있다. 당연하게도 일반 몹보다 훨씬 강하며, 개중에는 간간히 마법반사 같은 미친 기믹을 들고 오는 놈도 있으니 주의. 쓰러트릴 경우 장비나 스킬북, 검은 소울을 드랍한다.백령의 경우 플레이어가 망자상태가 아니라면
              - link "[151]" [ref=e2448] [cursor=pointer]:
                - /url: "#fn-151"
              - text: 보스방 근처에서 책 같은 것을 볼 수 있는데 이걸 조사할 시 몽령이라는 이름으로 등장해 도움을 준다. 전작에서 동화책을 드랍하는 보스들로 구성되어 있으며 한 개체를 제외하면
              - link "[152]" [ref=e2449] [cursor=pointer]:
                - /url: "#fn-152"
              - text: 같이 보스를 공략한 후에 동화책을 주고 사라진다.그리고 가장 중요한 게임 시스템이 있는데 적이 민첩이 높다 한들 적은 한턴밖에 못쓴다. 즉, 필살기를 쓰기 위한 예비 스킬을 쓴 후 바로 필살기를 쓰진 못한다는 것.
              - link "[153]" [ref=e2450] [cursor=pointer]:
                - /url: "#fn-153"
              - text: 다만 적의 행동횟수는 그대로라서 여러 번 공격하거나 버프 걸고 공격하기 같은 건 파훼할 수 없다. 거기다 민첩 차이가 너무 심할 경우 적이 예비 스킬을 쓰더라도 브레이크를 걸기 전에 적의 턴이 먼저 와서 그대로 비명횡사할 수도 있으므로 주의.만나는 인물 중 몇몇은 살해 외에 범한다는 선택지가 있으며, 이것을 선택하면 H씬 후 감옥에 감금한다. 만약 감옥을 다 채울시 매우 호러스러운 특수 이벤트가 있으므로 주의할 것.
              - link "[154]" [ref=e2451] [cursor=pointer]:
                - /url: "#fn-154"
              - text: 전작과는 달리 이번 작에는 동화를 전부 모아도 엔딩에 영향을 끼치진 않는다. 다만 전부 모을 경우 노데가 감사를 표하며 선택지에 따라 대량의 소울이나 여러 가지 아이템 혹은 흰토끼의 반지를 받거나 수영복 차림의 노데의 모습을 볼 수 있다. 흰토끼의 반지는 50%로 행동횟수+1, 전 스테이터스 20%증가라는 굉장한 성능의 반지이므로 얻어둬서 나쁠 건 없다.
