                    - text: 제정신이 아닌 녀석들뿐이고 이를 치료할 약조차도 부족, 스스로의 무력감을 느끼며 미칠 것 같았지만 플로렌스는 어떻게든 환자들을 구하려 애썼다. 그러나 휴식도 취하지 않고 계속해서 노력해도 상황은 악화일로를 걸어갔고, 아무 것도 할 수 없는 자신을 용서못할 지경이었으며, 급기야 그녀의 마수화까지 진행되기 시작했다. 마수화에 맞서 어떻게든 본인이 본인으로 있을 때 트위들 쌍둥이를 다른 병원 시설로 이송시키고, 한 사람이라도 구하려 노력했다. 결국 지킬 박사의 말대로 어떤 벌레를 통해 약을 만들어 환자의 불사화를 성공시키며 상황이 호전되는 듯했으나 문제는 이 약에
                    - strong [ref=e1454]: 부작용
                    - text: 이 있었던 것. 이를 보다 못한 한 환자가 나는 알 수 없는 괴물이 되는 것보단 인간으로 죽겠다면서 치료를 거부하기까지 했다. 이에 본인조차 얼굴빛이 창백해지며 역시 이런 치료는 도덕의 길을 벗어났다고 여겼다. 그러나 인간이 아니게 된 환자들이 자신에게 감사하며 신뢰를 보내는 모습을 보며 처음으로 사람을 구하는 게 가능했다면 더 이상 망설이지 않고 자신의 구제로 환자들을 구하겠다고 다짐했다. 인간이 아니게 되었단 것에서 알 수 있듯, 이 환자들은 전부 식시귀가 되었고 그 식시귀들로 인해서 이상한 나라 자체에 커다란 소동이 발생했던 것으로 보인다. 로리나가 그렇게 목을 베라 한 것도 식시귀들 때문일지도 모르는 일. 이렇게 사태가 심각해지자 결국 플로렌스는 크리미아 간호 병동째로 모형정원에서 추방당했다. 그러나 본인은 이를 해방되었다고 여기며 오늘도 사람들을 구하지 않으면 안 된다는 말로 수기가 끝난다.너스 콜을 물리치고 진행하면 드디어 플로렌스를 대면할 수 있는데 밤에 움직이는 건 위험하다며 해가 뜰 때까지 자신이 순찰을 도니 안심하고 잠들라며 주인공을 돌려보내려 한다. 이후 주인공을 보곤 신체가 좀먹히고 있다며 외신에 의해 자신처럼 신체가 개조되었다고 하곤 주인공의 병이 매우 심각하다고 말한다. 상상도 할 수 없는 수준의 주병이며 혼조차 이미 위험영역에 도달했고 나중엔 사람이고 세계고 간에 전부 휘말리게 해서 파멸시킬 거라고 한다. 플로렌스 본인도 고칠 수 있을 거라 장담은 못하지만 진행은 막을 수 있으니 이곳에서 치료받으라고 한다. 문제는
                    - strong [ref=e1455]: 완치가 불가능하니 영원히 입원해야 한다
                    - text: 고 하는 것. 이에 무리라고 말하면 안된다면서 고향을 그리워하는 건 알겠지만 바깥으로 보내줄 순 없다며 주인공을 막으려 한다. 이후 어느 쪽 선택지를 고르건 결국 주인공을 붙잡아 놓기 위해서 보스전에 들어간다.보스전을 끝내면 다가오지 말라며 소리친다. 아직도 구원을 바라는 사람들이 있다며 여기서 죽을 순 없다고 소리치며 저항한다. 여기서 살해하면 너무 긴 겉잠의 꿈이었다며 사망하며 범할 시 H씬에 들어가고 이후 자신은 부패해 버렸다며, 그들의 자기희생을 막지 못한 무력한 망자라며 울음을 터트린다. 이 상태로 그냥 진행할 시 란제리나를 처리하지 않았다면 란제리나에게 살해당한다. 그러나 이 직후 바로 너스 콜 보스장소로 가면 란제리나가 있으며 란제리나를 어떤 방식으로든 처리할 시 플로렌스를 살릴 수는 있지만 이 상태에서 더 이벤트를 진행할 순 없다.보스전 직후 다가오지 말라고 할 때 블랙웰의 편지를 가지고 있으면 이를 건네줄 수 있는데
                    - link "[93]" [ref=e1456] [cursor=pointer]:
                      - /url: "#fn-93"
                    - text: 블랙웰을 그리워하지만 이 크리미아 간호묘지가 자신의 집이며 묘지이기에 더 이상 자신은 돌아갈 수 없다고 독백한다. 이후 주인공에게 정식으로 플로렌스 나이팅게일이라고 자기 소개를 하고 주인공의 이름을 묻는다. 주인공이 이에 답하며 이름을 말하자 주인공을 보며 얼마나 절망하더라도 끝까지 싸워나가는 당신은 매우 대단한 사람이라며 그 신념을 소중히 해달라고 말한다. 그리고 당신이 향하는 길에 좋은 미래가 있길 빌며 진정한 행복을 되찾길 바란다고 이곳에서 기도하겠다고 한다. 이 말을 한 직후, 수명이 다 된 걸 인지한 건지 추위를 느끼며 그립다고 말하곤 조금만이라도 잠들게 해달라며 눈을 감고 사라진다. 이렇게 플로렌스를 구제할 경우 최종전에서 몽령 플로렌스를 소환할 수 있다.몽령으로서의 성능은 일기당천 수준으로 마력의존 회복기 천사의 빛과 민첩성과 회심률을 동시에 올려주며 회피 상태에 들어가게 해주는 혈탄 장전, % 필중 + 올커스 + 회피 해체인 흐려지는 늪, % 필중 + 열상 상태의 산의 비에 2회 필중 + 방어 해체 + 자동 건브레이크를 추가타로 날리는 십자절단과 무방비 상태의 적에게 5배의 추가 데미지를 주는 내장 공격 등 공방 조화가 굉장히 우수한 편이다. 같이 몽령으로 소환되는 카낫키가 극공격 스타일이고 게르다가 서포팅 스타일이라면 이쪽은 양쪽을 절충하면서 공격에 더 치중된 편.
