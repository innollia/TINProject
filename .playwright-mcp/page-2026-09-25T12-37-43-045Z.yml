                - listitem [ref=e3503]:
                  - generic [ref=e3504]:
                    - link "먹튀없는 코인거래소 구스비트" [ref=e3505] [cursor=pointer]:
                      - /url: https://arca.live/b/blacksouls/29166786
                    - text: "- 도서관에 NPC 하나를 추가해 주는데. 블랙 소울 1 때 소울 지키미를 담당했던 구스비트를 추가해 준다. 전작처럼 소울만 지켜주는 게 아닌, 코인을 소울로 판매하고 당연하겠지만 가격이 계속해서 변한다. 실제로 웹에서 데이터를 받아오기 때문에 인터넷 없이 하려고 하면 크래쉬가 발생하니 주의."
                - listitem [ref=e3506]:
                  - generic [ref=e3507]:
                    - link "다양한 조언 추가모드" [ref=e3508] [cursor=pointer]:
