              - list [ref=e3113]:
                - listitem [ref=e3114]:
                  - generic [ref=e3115]: 난이도에 비례하여 적들의 스펙이 뻥튀기되는 시스템.
                  - list [ref=e3116]:
                    - listitem [ref=e3117]:
                      - generic [ref=e3118]: 난이도가 증가하는 만큼 처치 시 얻는 소울의 량도 증가한다. 탐욕의 은사 반지 등과 조합하면 최대 10배의 소울을 얻을 수 있다.
                    - listitem [ref=e3119]:
                      - generic [ref=e3120]: 운은 4배 이상 증가하지 않는다. 난이도 6 이후부터는 언제나 4배로 고정된다.
                    - listitem [ref=e3121]:
                      - generic [ref=e3122]:
                        - text: 난이도에 비례하여 동료들의 스펙도 증가한다.
                        - link "[171]" [ref=e3123] [cursor=pointer]:
                          - /url: "#fn-171"
                    - listitem [ref=e3124]:
                      - generic [ref=e3125]: 난이도 10 이상은 혼돈 던전에서만 등장한다. 혼돈 던전 이외에선 볼 수 없는 난이도다.
                    - listitem [ref=e3126]:
                      - generic [ref=e3127]: 난이도는 도서관의 꿈 우측 상단의 하얀 석상을 통해 조작할 수 있다.
            - heading [level=2] [ref=e3130] [cursor=pointer]:
              - text: 
              - link "7." [ref=e3131]:
                - /url: "#toc"
              - generic [ref=e3132]:
                - text: 엔딩
                - link "[편집]" [ref=e3134]:
                  - /url: /edit/BLACK%20SOULS%202?section=26
            - generic [ref=e3137]:
              - generic [ref=e3138]: 엔딩은 A부터 H까지 총 8가지이며 조건이 복잡한 엔딩도 있으므로 개발자가 게임 폴더안에 엔딩 조건을 적어놨다. 특이사항으로 sen치가 -일 경우 이니셜의 뒷글자가 나타난다. 엔딩을 보는 조건은 기본적으로 일정 이상의 진행을 했을 경우 흰토끼가 도서실의 하얀 문 앞에 서있는 것으로 알 수 있다. 이때 하얀 문으로 들어가면 엔딩.
              - list [ref=e3139]:
                - listitem [ref=e3140]:
                  - generic [ref=e3141]:
                    - text: "A end: 통상 엔딩. 하얀 문 너머의 보스를 쓰러뜨리고 앨리스를 구해냈을 경우 볼 수 있는 엔딩이다. 하지만 이후에도 주인공은 앨리스를 찾는다."
                    - link "[172]" [ref=e3142] [cursor=pointer]:
                      - /url: "#fn-172"
                - listitem [ref=e3143]:
                  - generic [ref=e3144]:
                    - text: "B end: 조금 특수한 엔딩으로 조건은 3악몽을 제외한 나머지"
                    - strong [ref=e3145]: 모든 히로인들과 서약을 lv3까지 올리는 것.
                    - link "[173]" [ref=e3146] [cursor=pointer]:
                      - /url: "#fn-173"
                    - text: 즉, 접접을 제때 못 잡았거나 누가 죽었거나 해서 서약이 불가능하면 이 엔딩을 볼 수 없다. 다만 그리피 이벤트로 로리나가 죽는 건 상관이 없는 듯. 조건을 모두 채우고 노데와 사랑을 나누면 엔딩 선택분기가 나온다.
                    - link "[174]" [ref=e3147] [cursor=pointer]:
                      - /url: "#fn-174"
                    - text: DLC 1 발매와 함께 시부치와 서약하기 위해선 심해의 기사를 잡아야 하므로 H 엔딩 다음으로 보기 어려운 엔딩이 되었다. 보스도 보스지만 DLC 1에서 추가된 지역에서 나오는 잡몹들이 어지간한 보스보다 강한 탓에 여길 뚫으려면 투명화 상태로 수도 없이 죽으면서 뚫던가 G 엔딩을 클리어할 수준의 스펙이 되어야 한다.
                    - link:
                      - /url: "/w/(%EC%8A%A4%ED%8F%AC%EC%9D%BC%EB%9F%AC)B%20end%20:"
                    - group [ref=e3148]:
                      - generic "【스포일러】" [ref=e3149] [cursor=pointer]
                - listitem [ref=e3150]:
                  - generic [ref=e3151]:
                    - text: "C end: 1회차 때 가장 보기쉬운 엔딩. 하얀문 너머의 보스에게 패배하면 볼 수 있다."
                    - link "[175]" [ref=e3152] [cursor=pointer]:
                      - /url: "#fn-175"
                - listitem [ref=e3153]:
                  - generic [ref=e3154]:
                    - text: "D end: 하얀문 너머의 보스를 클리어하고 sen치가 +인 상태에서 앨리스를 죽일시 등장하는 엔딩."
                    - link "[176]" [ref=e3155] [cursor=pointer]:
                      - /url: "#fn-176"
                - listitem [ref=e3156]:
                  - generic [ref=e3157]:
                    - text: "E end : sen치가 -인 상태에서 앨리스를 죽인다를 선택할 경우 볼 수 있는 엔딩. 최종보스를 쓰러뜨려도 또 다른 보스전이 벌어지니 주의."
                    - link "[177]" [ref=e3158] [cursor=pointer]:
                      - /url: "#fn-177"
                - listitem [ref=e3159]:
                  - generic [ref=e3160]:
                    - text: F랑 G는 '이면 엔딩'으로, 해당 루트로 진행하기 위해선 특수한 조건이 필요하다.
                    - group [ref=e3161]:
                      - generic "【스포일러】" [ref=e3162] [cursor=pointer]
                - listitem [ref=e3163]:
                  - generic [ref=e3164]:
                    - text: "H end : DLC 3에서 공개된 진 엔딩으로 다른 엔딩들과는 달리 캐럴강에 새로 생긴 길에 있는 문을 통해 갈 수 있는 신지역을 끝까지 진행해야만 볼 수 있다. 문을 넘기 위한 조건은"
                    - strong [ref=e3165]: G end 클리어
                    - text: + 혼돈 던전의 문을 조사해 메이벨과 첫 대화 보기 + sen치 31 이상이다. 가장 마지막에 공개된 만큼 여타 루트와는 격이 다른 난이도를 자랑한다.
                    - group [ref=e3166]:
                      - generic "【스포일러】" [ref=e3167] [cursor=pointer]
