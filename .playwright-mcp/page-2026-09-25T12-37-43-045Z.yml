                    - cell [ref=e2512]:
                      - generic [ref=e2513]:
                        - text: 아이 방의 곰 인형이 더 변화한다.아이템 획득이나 포식할 수 있는 필드의 시체들이 사라진다.체셔 캣, 무한음식의 호박령, 캐럴강의 낚시꾼, 루트위지 시가지 주점의 손님, 정신병동 로비의 NPC들이 사라진다.트리니쿤이 치킨이 된다.토끼 굴 객실의 '나를 먹으렴'이 보스 '유리병의 짐승'으로 변한다.루트위지 시가지의 워울프가 존재하는 필드에서 '성냥팔이 옷'과 '동화 [성냥팔이 소녀]'를 획득할 수 있다.피눈물 웅덩이의 적 '별의 정령'이 잘 보이지 않게 된다.토끼 굴과 도살장의 숨겨진 문과 버섯마을의 숨겨진 길이 보이게 된다.리펀 대성당, 정신병동, 도살장에서 특수한 적이 생성되며, 그 외 일부 맵을 제외한 전 지역에서 적 '사랑'
                        - link "[162]" [ref=e2514] [cursor=pointer]:
                          - /url: "#fn-162"
                        - text: 이 생성된다.공작 부인의 저택의 털복숭이가
                        - link "점프 스케어" [ref=e2515] [cursor=pointer]:
                          - /url: /w/%EC%A0%90%ED%94%84%20%EC%8A%A4%EC%BC%80%EC%96%B4
                        - text: 이벤트로 변경되며, 막다른 길에 문이 생성되며 염소 고기를 획득할 수 있다.옥스워드 학원의 망원경을 일정 시간 이상 들여다 보면 달 표면으로 이동한다.퀸 랜드 서커스 오두막의 보물 상자에서 앨리스를 획득할 수 있으며, 봉제인형 폐기장의 거대한 곰을 조사하면 보스 '붉은 곰인형'이 출현한다.보스 '붉은 우상 프리켓'의 전투에서 주사위 숫자 6이 발생할 가능성이 생긴다.크리미아 간호묘지에서 일부 환자들의 대사가 변화하고, 적 '성충'이 사라진다. 또 4층의 플로렌스의 수기를 읽을 수 있다.쇠퇴한 눈길의 배경의 BGM이 사라지고 대신 톱니바퀴 소리가 재생된다.퀸 랜드의 일부 NPC가 사라지며, 대신 적 '붉은 폰/룩/비숍/나이트'가 생성된다.
                  - row [ref=e2516]:
                    - cell [ref=e2517]:
                      - generic [ref=e2518]:
                        - strong [ref=e2519]:
                          - text: 히로인
                          - link "빨간 망토" [ref=e2520] [cursor=pointer]:
                            - /url: /w/%EB%B9%A8%EA%B0%84%20%EB%A7%9D%ED%86%A0(BLACK%20SOULS%20%EC%8B%9C%EB%A6%AC%EC%A6%88)
                          - text: 가 출현한다.
                        - text: NPC 가짜 바다거북, 우조 도도, 도마뱀 빌, 쐐기벌레 시샤, 모자장수 해터, 3월 토끼 헤이어, 겨울잠쥐 야마네, 하트 여왕 로리나, 공작 부인 마르가레테 폰 티롤, 씩성난 밴더스내치, 사룡 재버워크, 광조 접접, 그리핀 기사 그리피, 트위들덤 & 트위들디, 험프티 덤프티, 명해의 포식자 시부치, 건방진 굴, 비밀의 공주 크티, 뱀신이 마수화하여 전투가 가능해진다.NPC 새끼 새의 H씬에 대사가 추가된다.붉은 우상 프리켓을 처음 조우할 시 순간적으로 앨리스의 모습이 스쳐 지나가며, 데이트 중 추가 대사가 출력된다.
              - generic [ref=e2521]:
                - text: 제작자의 말에 따르면 0 이상 0 이하가 다른 이유는 단순하게 사는 세계가 달라지기 때문으로 어디가 현실세계고 어디가 현실세계가 아니라고 나누는 것은 옳지 않다고 한다. 다만 주인공 한정으로는 주인공이 원래 살던 세계는 0 이하의 세계가 진실에 가깝다고 한다. 그리고 한 소녀
                - link "[163]" [ref=e2522] [cursor=pointer]:
                  - /url: "#fn-163"
                - text: 는 sen치가 낮지 않으면 절대 볼 수 없다.
            - heading [level=3] [ref=e2525] [cursor=pointer]:
              - text: 
              - link "6.2." [ref=e2526]:
                - /url: "#toc"
              - generic [ref=e2527]:
                - text: 진행도
                - link "[편집]" [ref=e2529]:
