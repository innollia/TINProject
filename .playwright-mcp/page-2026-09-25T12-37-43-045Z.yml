                    - strong [ref=e1434]: 인게임 난이도를 9로 올려버리는 저주다.
                    - text: DLC 3 초반 이상할 정도로 어려운 난이도의 주범. 심지어 난이도가 올라간 줄도 모르고 끝까지 가는 경우도 있다.이후 엘리베이터로 3층의 환자병동으로 들어가면 비의 폭포 위에 있는 란제리나를 다시 만나는데 구원이랍시고 환자 5명을 추락시켜 버린다. 누가 봐도 환자를 살해하는 장면임에도 그걸 자기가 구해줬다면서 기뻐하는 모습을 보이는 건 덤. 이후 말을 걸면 방금 전에 대화했음에도 인간은 무개성이라 누군지 모르겠다며 신경도 안 쓰는 모습을 보이며 자기가 왜 이런 일을 벌이는지 말하는데 그 말이 정말 가관. 세상은 올바르게 불평등하고 불쌍한 신의 아이들이 지상에 만연하는데 하느님이 자신에게 『불행에 고통스러워 하는 불쌍한 인간들을 구제해라.』 란 계시를 내렸으니 계시대로 자신이 불쌍한 인간들을 괴로움에서 해방시켜 주고 있다는 것.
                    - link "[89]" [ref=e1435] [cursor=pointer]:
                      - /url: "#fn-89"
                    - text: 이에 주인공이 얼굴을 찡그리자 그걸 천국에 가고 싶은 거냐고 취급하는 건 덤. 그러곤 자긴 바쁘다면서 맞이해 주진 못하니 대신해서 이걸 주겠다면서 머리 장비품 '가짜 천사의 화관'
                    - link "[90]" [ref=e1436] [cursor=pointer]:
                      - /url: "#fn-90"
                    - text: 을 준다. 이걸로 이제 당신을 못 알아보진 않을 테니 고맙게 받으라고 한다. 이후 말을 걸면 이 모형정원에는 천사를 사칭하는 불경한 자가 있다며 그런 가짜 천사에게 천벌을 내려야 한다며 찾으면 알려달라는 말을 한다. 이때까지는 란제리나가 손에 닿지 않는 곳에 있는 터라 살해하거나 범하는 선택지를 골라도 닿기는커녕 놀리는 대사가 나온다.플로렌스를 쓰러뜨린 후, 너스 콜이 있던 장소로 가면 란제리나가 있는 걸 볼 수 있다. 플로렌스를 죽였거나 구원했을 경우엔 어느샌가 가짜 천사가 사라졌다면서 인간 따위가, 올바른 구제도 못하는 녀석 따위가 모형정원의 지배자가 될 리 없다면서 기쁜 듯이 웃는다. 그러면서 모두를 구하는 천사의 역할은 자신밖에 할 수 없다며 말하는데 그 이유도 가관, 자기가 기분 좋아지지 않는다는 이유다. 소개문에 나온 대로의 이유인 셈. 반대로 플로렌스를 죽이지 않은 상태에서 란제리나를 놔두고 앞으로 진행하면 플로렌스를 살해한다. 털투성이에 날개도 고리도 없다면서 역시 가짜 천사인 데다가 다 죽어가길래 구제해 줬다며 자기가 얼마나 자비심이 깊은 존재냐고 자화자찬을 한다. 이때부터 살해나 범하는 선택이 가능해지며 양쪽 모두 전투에 들어간다.전투에서 승리하면 곧바로 주인공에게 살려달라고 빈다. 그러면서 자긴 나쁜 짓 안 했고 불쌍한 인간들을 구하는 착한 천사라는 헛소리는 덤. 당연히 이런 헛소리를 들은 주인공은 너 같은 극악비도가 천사일리 없다고 하자 자긴 천사라며, 이런 죄를 불러일으키는 행위를 하면 용서할 리 없다고 한다. 그러나 주인공의 천사는 앨리스뿐이고 너는 악마라고 하면 자기는 악마가 아니라며 천사라고 항변하다가 무엇이든 할 테니 살려달라고 빌기 시작한다. 자기 몸까지 마음대로 해도 좋다면서 계속 비는 건 덤. 이를 무시하고 살해하면 죽으면 더 이상 구제할 수 없다며 주인공을 악마라 부르며 울다가 살해당한다. 범하는 선택지를 선택하면 H씬에 들어가지만 도중에 주인공이 결국 자기나 란제리나나 다를 게 없다면서 죽이려고 하자 여기까지 했는데도 죽이려고 하냐며 당황하더니 남은 속옷마저 전부 벗고 경험이 별로 없으니 기분 좋을 거라며 살려달라고 빈다. 이에 응하지 않고 살해하면 여기까지 했는데도 자길 죽이냐면서 발광하다가 사망한다. 응하면 2번째 H씬으로 넘어가지만 그래도 주인공은 란제리나를 죽이려 한다. 그때 누군가 주인공의 뇌를 창으로 찔러서 움직일 수 없게 되는데, 란제리나의 언니인 꼬치공녀 크루티잔느가 주인공을 공격한 것. 사냥터에서 무슨 심한 꼴이 된 거냐며 묻자 란제리나는 울기 시작한다. 이에 뭘 우냐면서 자기가 구해줬으니 웃으라고 하곤 현실로 돌아가자면서 데려간다. 물론 불사자인 주인공이 죽진 않았고 크루티잔느도 알아채지만 란제리나는 더 이상 얽히기 싫은지 크루티잔느와 같이 사라진다. 주인공도 동료가 있을 줄이야 라면서 방심했다는 말을 끝으로 란제리나 이벤트는 끝. 결과적으론 바로 죽이는 게 아닌 이상 살아서 돌아간다.여담으로 란제리나에게 말을 건 후, 폐역의 빅토리아에게 말을 걸면 자신에게 감화된 의매들이 폭마가 되었고 이후에 점점 폭마들이 늘어났다고 한다. 그중 3명인 폭살천사 란제리나, 꼬치공녀 크루티잔느
