                    - text: 비참하게 강간당한 끝에 지하실에 감금당하는 것으로 끝난다. 지하실에서도 대화를 나눠 보면 비꼬는 말을 늘어놓는 것으로 보아 여전히 정신을 못 차린 모양. 그냥 보내주면 수컷 따위에게 동정받아서 최악이라며 수컷과 암컷, 죽음에게도 미움받는다며 나라를 떠나겠다고 한다. 이후 유니콘의 숲에 가보면 크리스마스 트리에 매달려 화형당한 모습을 볼 수 있고 그 앞에 유니스의 소울을 얻을 수 있다. 정황상 그녀의 부하들에게 살해당한 것으로 보인다. 라이덴과 비교하면 마지막까지 인복도 없었던 셈.여러모로 라이덴과 반대되는 캐릭터인데 속이나 겉이나 똑같은 면모를 보이는 라이덴과 정반대로 정중하면서도 속이 검으며 마지막에 본색을 드러내 배신을 한다. 주인공에 대한 반응도 정반대인데 주인공이 강자이긴 하지만 열심히 노력하는 주인공에게 칭찬도 해주며 마지막까지 주인공을 적대하지 않으며 이해할 수 없으면서도 싸우고 싶진 안다며 사라지는 등 끝까지 주인공을 위해주는 라이덴과 달리, 처음엔 받아들이면서 나중에 본색을 드러내고 통수를 치며 수컷의 말 따윈 들리지 않는다며 무시하고 결국에는 완전히 몰락해 버리는 비참한 인물. 그래서인지 팬덤에선 라이덴의 인기가 훨씬 높다.
