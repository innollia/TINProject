                    - text: 크리미아 간호묘지를 지나 설원에서 2번째로 만나는 NPC. 스스로를 유령사냥꾼이라 칭하며 기상천외한 수많은 불가사의, 괴기현상, 초상현상, 난항해를 모두 해결하고 마의 돼지까지 처리했다고 한다. 이번 윈터벨에 온 이유도 윈터벨에 있는 수많은 수수께끼를 풀기 위해서 왔다고 하지만
                    - link "[99]" [ref=e1524] [cursor=pointer]:
                      - /url: "#fn-99"
                    - text: 이번은 얼어붙은 성에 잠들어 있는 『관』을 노리고 왔다고 하며 관을 쓰면 어떠한 소원이라도 이룰 수 있단 소문을 들었다고 한다.어느 쪽 루트를 타건 필드를 돌파해 무풍의 골짜기에 다다르면 화톳불에서 다시 만나는데 수첩에 일대기를 쓰면서 말하길 골짜기에 초상적 존재가 있다며 보스전을 예고한다. 이후 말을 거는 주인공을 눈치채곤 그렇게 자신의 조수가 되고 싶냐면서 묻고는 그래도 자신만큼은 안된다며 자화자찬 하지만 이를 듣던 쳬셔 캣이 잘난척 하는 사람이라고 핀잔을 주자 저리 가버리라면서 성을 낸다. 그러고는 조수가 되고 싶으면 저기 쇠사슬 다리를 건너서 초상적 존재를 확인하고 오라면서 보내고 동종을 바람과의 보스전을 끝내면 진짜로 확인하러 가냐면서 쫓아온다. 스스로를 유령사냥꾼이라고 하는 게 폼은 아닌지 이곳에 초상적인 자가 있는 게 확실하다며 눈치채곤 자기가 늦게 왔으면 죽었을 거라며 말하는데 여기서 이미 타도했다고 말하면 대단하다고 하더니 이걸 준다면서 주는 게 다름 아닌 진정제. 착란하고 있으니 먹으라고 준다... 반대로 덕분에 살았다고 대답하면 조금이라도 늦었으면 죽었을 거라며 감사하라고 말한다. 이후 그 용기만큼은 칭찬한다며 나중에 모험담에 주인공을 위험을 신경 쓰지 않는 무모한 자라고 써주겠다며 말하곤 가버린다.성에 도착하고 린다메아 보스전으로 가는 통로의 숨겨진 창고방에서 다시 만날 수 있는데 건너편에 수많은 재화가 있는 걸 보곤 저기에 관을 있을 거라며 다리를 건너려고 한다. 이때 주인공의 의견에게 내가 저 철문을 열어야 할까라고 물어보며 선택지가 뜨는데 열어야 한다를 선택하면 사실 높은 곳은 질색이라고 말한다. 그렇지만 용기를 내야 한다며 건너갈려 하는데 만능키를 가지고 있으면 이를 건네줘서 건너게 할 수 있다. 그렇지만 다리 자체가 함정이라 떨어지며 사망해 버린다. 반대로 되돌아가라라고 선택하면 스스로도 싫은 예감이 든다면서 관이 이렇게 간단히 들어올 리가 없다고 말하며 방을 나간다. 이후 주인공을 자신의 책에 낼 때 유망한 조수로 하고 싶다며 말을 남긴다.이렇게 여정을 계속 도와줄 경우 마지막으로 윈터 벨의 옥좌에서 다시 만날 수 있다. 말을 걸면 어찌 된 영문인지 다 죽어가는 상태로 절망해 있는데 관 따윈 없었다며 이런 수준 낮은 장난 같은 연극에 휘말려든 어리석은 자는 자신이라고 말하곤 뭐 때문에 여기까지 왔냐며 후회한다. 이후 다시 말을 걸면 죽기 직전인지 시계가 하얗다면서 자신의 목소리조차 제대로 들리지 않는다고 말하곤 혼자서 죽는 건 쓸쓸하다고 말한다. 이때 아무 행동도 하지 않으면 아버지를 부르면서 죽는다. 그렇지만 어깨를 두드린다 라는 선택지를 선택하면 누군가가 옆에 있단걸 눈치채곤 이걸 받아달라며 『카낙키의 수첩』을 받게 된다. 고맙다고 말한 후, 유령사냥꾼 카낙키는 계속해서 살아간다며 사라진다.이렇게 수첩을 받게 되면 최종보스전에서 몽령으로 소환이 가능하다. 동료로서의 성능은 매우 뛰어난 전체 공격 어택커. 사용하는 스킬의 대다수가 전체공격이며 이 공격기들이 전부 필중기, 게다가 스턴을 걸거나 강화해체까지 달려있는 만능 공격수다. 단일 공격기도 스턴이 부과효과로 붙거나 브레이크 상태에 빠뜨리면서 공, 방다운이 붙어 있다. 체력이 떨어지면 스스로 허브병을 사용해 회복까지 하고 유령사냥꾼의 호령이란 버프 스킬도 가지고 있는데 최대 체력을 2배로 올리고 무방비 무효화 상태, 데미지 경감까지 주면서 HP까지 50% 회복을 시킨다. 그야말로 스킬들이 버릴 게 없다.모티브는
