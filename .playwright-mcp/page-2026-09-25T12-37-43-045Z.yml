                    - text: 를 쓸 수 있게 된다. 무기를 2개 낀다는 말. 방패칸을 무기칸으로 바꾸는 원리이다. 그러므로 이도류를 활성화하면 방패의 기능을 사용하지 못한다. 하지만 이걸 쓰면 방패가 필요 없어질 정도로 밸런스를 파괴하는 기능이 몇 개가 있으므로 주의.(...)
