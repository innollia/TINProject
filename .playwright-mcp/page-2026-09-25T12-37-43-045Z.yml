                  - /url: /w/DLC
                - text: 가 불규칙하게 무료로 배포되었다. 대부분의 DLC는 본편의 내용을 그대로 유지하되 추가 콘텐츠나 파고들기 요소를 추가하는 식으로 본편에 큰 영향을 끼치는 패치는 하지 않는 편이지만, BLACK SOULS 2의 경우 기존의 내용들 중 일부가 변형되거나 아예 다르게 바뀌기 때문에 DLC가 한 편씩 나올 때마다 체감될 정도로 게임의 상당 부분이 바뀐다. 가벼운 편의성 패치부터 시작해서 NPC와 보스, 여러 이벤트 추가 및 그에 따른 상호작용이나 밸런스 패치 등 단순히 새로운 콘텐츠를 만들어 배포하는 정도가 아니라 게임을 전체적으로 뜯어고친다는 느낌이 강하다.이처럼 일반적인 DLC와 다르게 게임의 전반적인 부분을 수정하고 거기에 내용을 추가하는 형태라 그런지 배포 주기가 2019년 2월부터 2021년 4월까지 상당히 긴 편이었다. 대충 따져봐도 DLC 한 편에 평균 1년이 소모됐다. 발매 주기가 상당히 길다는 사실을 제작자도 인지는 하고 있는지, 본인의 트위터에 "만약 여름까지 DLC를 내지 못하면 캐롤강에 다이빙 하겠다.", "올해(2020년)까지 DLC를 내지 못하면 산채로 태워져도 좋아." 라는
                - deletion [ref=e449]: 불가능한
                - text: 발언들을 내뱉다가, 결국 매번 지각해서 자신의 오너캐가 캐롤강에 다이빙하는 그림이나 산채로 태워지는 그림 등을 올리며 능글맞게 넘기는 식이다.여튼 세 번째 DLC인 'CROWN OF THE LION AND UNICORN'이 배포된 시점에서 초기에 기획된 3가지 DLC가 모두 완성되었고 상기한 퀄리티 때문에 출시가 늦더라도 후속작을 기대하는 목소리가 매우 크다.
