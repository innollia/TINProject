                    - text: 크리미아 간호묘지를 지나 설원 분기점에서 만나는 2명의 히로인 중 한 명. 유니스를 선택하면 설원을 돌파할 필요가 없어지는 대신 광기산맥을 돌파해가야 하고 성에서 정문이 파괴되어서 오른쪽의 숨겨진 문으로 들어가야 한다.쇠퇴해진 눈길을 지나 눈사태 숲 갈림길에서 아래로 내려가면 나오는 유니콘의 숲에서 만날 수 있다. 자신을 하얀 여왕 직속 순각의 기사단의 기사단장이라 소개하며, 이곳은 남성이 거의 살지 않고 자신은 모든 사물과 사람을 평등하게 대한다며 자신의 편으로 들어와 활약해 공을 세운다면 기사 작위를 수여하겠다고 제안한다. 그러면서도 시간이 없으니 빠르게 결정할 것을 촉구하며, 다음 대화 시 협력한다를 선택하면 존중받아 마땅한 결론이라며 받아들인다. 그리고 라이덴이 이끄는 아탐단이 성에 도달하기 전에 앞지르기 위해 산맥을 넘어야 한다며 광기산맥을 향한다.광기산맥과 무풍의 골짜기를 넘으면 다음 맵에서 부하들과 함께 등장하며, 자신의 각력을 쫓아온 주인공이 대단하다며 사실은 자신의 몸을 노리고 온 수컷이 아닌지 의심하고 있었다고 한다. 하지만 기우로 끝나서 다행이라고. 이후 성에 진입하면 먼저 도착한 라이덴이 입구를 파괴해 진입로를 막아버리며, 자신은 뛰어 넘어 들어가지만 주인공은 우측의 숨겨진 문으로 우회해 가야 한다. 이를 다시 뒤쫓아 결투장에서 라이덴과 대면하면 그녀는 주인공을 보고 유니스의 장기말이라 하고 당당한 용기를 칭찬하지만 짐승은 강자에게 고개를 숙인다며 그 추방자 밑에서 평생 부려먹히는 것에 만족하냐 묻는다. 그때 유니스가 나타나 이를 반박하고 폭도들은 모두 진압되었다 알리며 주인공의 손으로 끝내라는 말과 이어 전투에 들어간다. 전투가 끝나면 라이덴은 자신의 패배를 인정하고 유니스의 손에 담담하게 죽음을 맞이하며, 유니스는 주인공을 칭찬하고 주인공을 알현실로 이끄는데 이때 소울 또는 CG를 동반한 포상을 받을 수 있다. 그러나 알현실로 가는 도중 유니스는 주인공을 기습하며, 주인공과 남성에 대해 온갖 욕설과 악담을 퍼부으며 자신이 만들어갈 정신 나간 목표를 늘어놓고 부하들을 소환하지만 그때 숨어있던 메이벨이 나타나 한번에 제압해 버리고, 유니스는 이에 발광하지만 함께 제압당한다.그리고 구석에서 과거의 기억을 읊는 유니스를 깨우면 정신을 못 차린 채 온갖 욕설로 주인공을 비난하고 이때 죽일지 범할지 선택할 수 있는데, 죽이면 겁에 질린채 비굴하게 목숨을 구걸하다가 끔살당하고, 범하면 끝까지 변명하다가 뿔이 뽑혀나가고
                    - link "[97]" [ref=e1508] [cursor=pointer]:
