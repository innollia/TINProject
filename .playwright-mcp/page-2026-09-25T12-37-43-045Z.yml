                    - listitem [ref=e2552]:
                      - generic [ref=e2553]: 부식해에서 바다코끼리의 반지를 입수한다.
                    - listitem [ref=e2554]:
                      - generic [ref=e2555]:
                        - text: 포자의 숲 화톳불에 있는 앨리스에게 말을 건다.
                        - link "[165]" [ref=e2556] [cursor=pointer]:
                          - /url: "#fn-165"
              - table [ref=e2558]:
                - rowgroup [ref=e2559]:
                  - row [ref=e2560]:
                    - cell "진행도" [ref=e2561]
                    - cell "일어나는 상황" [ref=e2563]
                  - row [ref=e2565]:
                    - cell "1" [ref=e2566]
                    - cell "도서관의 꿈에 노데와 깜짝상자가 출현한다. 흰곰이 해독초, 출혈 방지, 귀환의 뼛가루, 만능열쇠를 판다." [ref=e2568]
                  - row [ref=e2570]:
                    - cell "2" [ref=e2571]
                    - cell [ref=e2573]:
                      - generic [ref=e2574]:
                        - text: 라드위지 시가에서 홈즈와 그리피, ???
                        - link "[166]" [ref=e2575] [cursor=pointer]:
                          - /url: "#fn-166"
                        - text: 를 만날 수 없게 된다. 라드위지 시가에서 의사 블랙웰과 얘기했을 경우 리폰 대성당의 화톳불로 이동한다.
                  - row [ref=e2576]:
                    - cell "3" [ref=e2577]
                    - cell [ref=e2579]:
                      - generic [ref=e2580]:
                        - text: 토끼굴에서 ???
                        - link "[167]" [ref=e2581] [cursor=pointer]:
                          - /url: "#fn-167"
                        - text: 과 만날 수 없게 된다. 흰곰이 보이지 않는 후추, 요정의 인분, 대변 경단을 판다.
                  - row [ref=e2582]:
                    - cell "4" [ref=e2583]
                    - cell "살인마 잭이 살아 있을 경우, 매춘부 마리가 사망한다." [ref=e2585]
                  - row [ref=e2587]:
                    - cell "5" [ref=e2588]
                    - cell "리폰 대성당의 블랙웰이 다시 약을 판다. 정신병동 로비의 NPC들이 없어진다. 흰곰이 강화석 조각을 판다. 찰스 주점의 점주를 제외한 NPC들이 사망한다. 도도와 서약을 맺었을 경우, 도도 근처에 푹신푹신한 생물이 나타난다. 매춘부 마리가 살아있을 경우 대사가 바뀐다. 노데가 주민들의 말을 그대로 믿지 말라고 충고한다." [ref=e2590]
                  - row [ref=e2592]:
                    - cell "6" [ref=e2593]
                    - cell "쐐기벌레 시샤와 서약 lv.3을 맺고 약을 5번 이상 피웠을 경우, 시샤의 수명이 다한다." [ref=e2595]
                  - row [ref=e2597]:
                    - cell "7" [ref=e2598]
                    - cell "흰곰이 마석, 송진 시리즈, 강화석 큰 파편을 판다." [ref=e2600]
                  - row [ref=e2602]:
                    - cell "8" [ref=e2603]
                    - cell "흰곰이 정력제, 녹다만 양초를 판다." [ref=e2605]
                  - row [ref=e2607]:
                    - cell "9" [ref=e2608]
                    - cell "흰곰이 강화석 덩어리를 판다." [ref=e2610]
                  - row [ref=e2612]:
                    - cell "10" [ref=e2613]
                    - cell [ref=e2615]:
                      - generic [ref=e2616]:
                        - text: 도서실의 꿈의 하얀 문이 열린다. 의사 블랙웰이 마수화하여 대성당 지하에서 등장한다. 접접이 살아 있을 경우 이하의 이벤트들이 발생한다.
                        - link "[168]" [ref=e2617] [cursor=pointer]:
                          - /url: "#fn-168"
                        - text: 단 지하실에 감금된 히로인은 해당사항 없음.가짜 거북, 도도, 빌, 시샤, 모자장수 3인방, 공작 부인, 그리핀, 트위들디, 시부치
                        - link "[169]" [ref=e2618] [cursor=pointer]:
                          - /url: "#fn-169"
                        - text: ", 험프티 덤프티"
                        - link "[170]" [ref=e2619] [cursor=pointer]:
                          - /url: "#fn-170"
                        - text: ", 펌프킨 오, 시체 먹는 토끼, 캐롤 강의 낚시꾼과 상점의 양이"
                        - strong [ref=e2620]: 사망
                        - text: 하며, 트위들덤이
                        - strong [ref=e2621]: 마수화
                        - text: 한다. 건방진 굴은 시부치가 건재할 경우에만
                        - strong [ref=e2622]: 마수화
                        - text: 하며 그 외엔 무사하다. 크티와 서약 lv3을 맺고 아이만들기까지 끝마쳤다면
                        - strong [ref=e2623]: 크티와의 서약이 끊어진다.
                  - row [ref=e2624]:
                    - cell "12" [ref=e2625]
                    - cell "흰곰이 여신의 피를 판다." [ref=e2627]
