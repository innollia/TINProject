                    - text: "About LudoNarraCon An initiative of Fellow Traveller, the narrative games publisher known for Citizen Sleeper 2: Starward Vector, 1000XRESIST, Beacon Pines, and Paradise Killer, LudoNarraCon celebrates seven years of showcasing indie narrative video games. It continues to pioneer the digital gaming festival space, offering an inclusive, community-led environment that engages fans and newcomers who share a love for storytelling through gaming. 🔥 49 exhibiting narrative-rich games from talented indie developers 🎤 15 hours of panels and fireside chats with industry veterans on various fascinating topics on the impact of narrative in video games 🎮 25+ new and updated demos will be available to download and play during the digital festival, many for the first time ever 💸 160+ games on sale during the event For more information, visit the festival’s website ("
