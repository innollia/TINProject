              - link "Sign in to edit" [ref=f5475e433] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fthe-case-of-the-golden-idol.fandom.com%2Fwiki%2FChapter_1%3A_The_Curse%3Fveaction%3Dedit%26section%3D4&uselang=en&metadata=article-registration-edit-article-section
            - paragraph [ref=f5475e436]: During a construction yard accident, the body of Luke Brown was found in a sewage pipe , afflicted with a strange condition that the police named the Red Curse .
            - paragraph [ref=f5475e437]: A few years later, the famous scientist Isaac Nowak was discovered dead by the Bagman couple.
            - paragraph [ref=f5475e438]: After being contacted by someone, Elizabeth Nowak worried that everyone would think Isaac Nowak had been a drug user .
            - paragraph [ref=f5475e439]: A few days later, Elizabeth Nowak offered to fund Brandon Bagman 's tuition, in exchange for confidentiality about the fact that Isaac Nowak had had the Red Curse .
            - paragraph [ref=f5475e440]: Hours before the conference, Sebastian Walsh was offered a similar deal and took it.
            - paragraph [ref=f5475e441]: However, the laboratory investigation found zero evidence that either Red Curse victim had been a drug user .
            - heading [level=3] [ref=f5475e442]:
              - text: Conclusion
              - link "Sign in to edit" [ref=f5475e444] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fthe-case-of-the-golden-idol.fandom.com%2Fwiki%2FChapter_1%3A_The_Curse%3Fveaction%3Dedit%26section%3D5&uselang=en&metadata=article-registration-edit-article-section
            - paragraph [ref=f5475e447]: Shortly before his death, Isaac Nowak went to meet someone at the Steelside warehouse .
            - paragraph [ref=f5475e448]: A few days later, someone connected to the Steelside warehouse provoked Elizabeth Nowak into bribing Sebastian Walsh , who stopped the investigation into Isaac Nowak 's death.
