              - link "Sign in to edit" [ref=f5829e285] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Fthe-case-of-the-golden-idol.fandom.com%2Fwiki%2FUnder_Construction%3Fveaction%3Dedit%26section%3D1&uselang=en&metadata=article-registration-edit-article-section
            - paragraph [ref=f5829e288]:
              - text: On July 11, 1977, four construction workers (
              - link "Joel Gregson" [ref=f5829e289] [cursor=pointer]:
                - /url: /wiki/Joel_Gregson
              - text: ","
              - link "Ted Werter" [ref=f5829e290] [cursor=pointer]:
                - /url: /wiki/Ted_Werter
              - text: ","
              - link "Monty Totsky" [ref=f5829e291] [cursor=pointer]:
                - /url: /wiki/Monty_Totsky
              - text: and
              - link "Bill Jenkins" [ref=f5829e292] [cursor=pointer]:
                - /url: /wiki/Bill_Jenkins
              - text: ) were permitted to end their shift early if they finished their work in a construction pit. Their job was to remove sewage pipes, but Bill's cutter was broken, so Monty crashed his demolisher into a pipe to remove it instead. The pipe dislodged and landed on Joel, killing him. When authorities arrived on the scene, detective
              - link "Ian Worth" [ref=f5829e293] [cursor=pointer]:
                - /url: /wiki/Ian_Worth
              - text: discovered the fresh corpse of
              - link "Luke Brown" [ref=f5829e294] [cursor=pointer]:
                - /url: /wiki/Luke_Brown
              - text: in the pipe, whose eyes were red due to his affliction with the Red Curse.
